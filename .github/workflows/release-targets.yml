# release-targets.yml — the per-target downloads (#413 phase 3).
#
# THE targets/ FOLDER IS THE MATRIX (JP's rule): tools/release_targets.sh iterates the
# targets/*/target.toml manifests; this workflow only decides WHICH toolchain a job carries.
# Adding a riscv target with `artifact = true` needs no edit here at all.
#
# WHAT AN ARTIFACT IS: a byte-reproducible image built from `git archive` with the PUBLISHED
# placeholder key (deterministic — two cold builds measured sha-identical at 97150a8), stamped
# build 0 (#420: not a fleet-ratchet number; identity = git hash), carrying a NOTES.md with the
# chip's stack-floor provenance and the #394 re-key instructions. Downloads are for NEW hardware;
# fleet boards update over mesh OTA only (docs/RELEASES.md).
#
# The S3 job provisions espup EXACTLY as xtensa-spike.yml proved (fresh, uncached — the cache
# traded 41 s for eviction pressure on the real gates' entries; measured, see that file). `ships`
# for the S3 stays false in build-matrix.toml — a downloadable preview is not fleet-shipped.
name: release-targets
on:
  workflow_dispatch: {}
  schedule:
    - cron: '47 7 * * *'   # nightly, offset from the 06:17 spike cron
concurrency:
  # Scoped by ref (#571, xreview): concurrency is resolved BEFORE ref-guard runs, so with one shared
  # group a rejected branch/tag dispatch could still cancel a legitimate main publication mid-upload.
  group: release-targets-${{ github.ref }}
  # #574 (xreview): never cancel a run in progress. A cancel landing in the publish job could stop it
  # between images and manifest; a newer run now waits instead (at most one pending per ref).
  cancel-in-progress: false
env:
  XTENSA_VERSION: 1.95.0.0
  ESPUP_VERSION: 0.17.1
permissions:
  contents: read             # #574: only the publish job writes (its own permissions block)
jobs:
  # #571: the publish job (#574: the ONLY job that writes to the release) PUBLISHES to the
  # public nightly. A workflow_dispatch from a feature branch therefore overwrote the public images
  # with branch-built ones (one did, 2026-11-13 11:14Z; only the concurrency group cancelled it
  # first). Two layers: this job refuses a non-main ref EARLY and LOUDLY, and every publishing job
  # also carries its own `if:` on the ref, so the guard holds even if `needs:` is ever edited away.
  # Test build changes with tools/release_targets.sh locally, never by dispatching this.
  # LIMIT (xreview): workflow_dispatch runs the workflow file AT THE SELECTED REF, so a branch or tag
  # cut before this guard still carries the unguarded version and can still publish if dispatched,
  # and re-running a pre-guard run keeps its old definition. Never dispatch release-targets on any
  # ref but main.
  ref-guard:
    name: publish only from main (#571)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse to publish from a non-main ref
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::release-targets publishes to the PUBLIC nightly and runs only from refs/heads/main; refusing $GITHUB_REF (#571). Test build changes with tools/release_targets.sh locally."
            exit 1
          fi
          echo "ref ok: $GITHUB_REF publishes the nightly"
  riscv-targets:
    name: riscv artifacts (c3 family)
    needs: ref-guard
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (repo-pinned stable + riscv32imc)
        run: rustup show >/dev/null && rustup target add riscv32imc-unknown-none-elf
      - name: espflash (packager)
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/esp-rs/espflash/releases/latest/download/espflash-x86_64-unknown-linux-gnu.zip -o /tmp/ef.zip
          cd /tmp && unzip -o ef.zip && install -m755 espflash "$HOME/.cargo/bin/espflash"
      - name: Build the riscv artifacts
        run: bash tools/release_targets.sh out c3
      # #574: STAGE only. Publishing is the publish job's, after every build job has succeeded.
      - uses: actions/upload-artifact@v4
        with: { name: riscv-artifacts, path: out/, if-no-files-found: error, retention-days: 3 }
  riscv-gui-targets:
    name: riscv GUI artifacts (c6-watch, c5-cyd)
    needs: ref-guard
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45          # Slint compiles the scene set from source; slower than a fleet image
    steps:
      - uses: actions/checkout@v4
      # targets/c6-watch/rust-toolchain.toml pins `stable` + rust-src + riscv32imac, and rustup
      # honours it on entry to that directory, so this is belt-and-braces rather than the
      # mechanism. NOTE: no espup here — these two boards are RISC-V. The S3's GUI arm is
      # Xtensa and is built by the s3-target job instead.
      - name: Toolchain (riscv32imac for the GUI workspace)
        run: rustup target add riscv32imac-unknown-none-elf
      - name: espflash (packager)
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/esp-rs/espflash/releases/latest/download/espflash-x86_64-unknown-linux-gnu.zip -o /tmp/ef.zip
          cd /tmp && unzip -o ef.zip && install -m755 espflash "$HOME/.cargo/bin/espflash"
      # The GUI workspace's .cargo/config.toml is gitignored and holds real credentials on a
      # developer machine, so a checkout has none. tools/ci_provision_gui.sh writes a
      # credentials-FREE one (absent, not placeheld) and asserts no credential key reached it.
      # Prove that assertion can fail before trusting the build that depends on it.
      - name: Sabotage-test the credential assertion
        run: CI_PROVISION_GUI_SELFTEST=1 bash tools/ci_provision_gui.sh targets/c6-watch riscv32imac-unknown-none-elf
      - name: Build the riscv GUI artifacts
        run: bash tools/release_targets.sh out c6-watch c5-cyd
      # #574: STAGE only. Publishing is the publish job's, after every build job has succeeded.
      - uses: actions/upload-artifact@v4
        with: { name: riscv-gui-artifacts, path: out/, if-no-files-found: error, retention-days: 3 }
  s3-target:
    name: "xtensa artifacts (s3-cyd: fleet + gui)"
    needs: ref-guard
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install espup + the esp toolchain (fresh, uncached — xtensa-spike.yml's proven recipe)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/espup \
            "https://github.com/esp-rs/espup/releases/download/v${ESPUP_VERSION}/espup-x86_64-unknown-linux-gnu"
          chmod +x /tmp/espup
          /tmp/espup install --toolchain-version "$XTENSA_VERSION" --targets esp32s3 --export-file "$HOME/export-esp.sh"
      - name: Assert the toolchain is EXACTLY the pinned fork
        run: |
          set -euo pipefail
          v="$(rustc +esp --version --verbose | sed -n 's/^release: //p')"
          echo "esp rustc release: $v"
          test -n "$v"
      - name: espflash (packager)
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/esp-rs/espflash/releases/latest/download/espflash-x86_64-unknown-linux-gnu.zip -o /tmp/ef.zip
          cd /tmp && unzip -o ef.zip && install -m755 espflash "$HOME/.cargo/bin/espflash"
      # Both S3 flavors ride THIS job, not the riscv ones: the GUI arm's board-esp32s3-cyd
      # feature is Xtensa too, so it needs the same espup toolchain and the same sourced
      # export-esp.sh (the GCC linker xtensa-esp32s3-elf-gcc must be on PATH — an unsourced
      # shell fails with "linker not found", which reads like a broken toolchain).
      # release_targets.sh builds both from the one manifest: `artifact` -> the fleet image,
      # `gui_artifact` -> the GUI image.
      - name: Build the S3 artifacts (fleet + gui)
        run: |
          set -euo pipefail
          . "$HOME/export-esp.sh"
          bash tools/release_targets.sh out s3-cyd
      # #574: STAGE only. Publishing is the publish job's, after every build job has succeeded.
      - uses: actions/upload-artifact@v4
        with: { name: s3-artifact, path: out/, if-no-files-found: error, retention-days: 3 }
  publish:
    # #574: ONE publisher. The three build jobs used to each `gh release upload nightly out/* --clobber`
    # and a checksums job hashed whatever the release held, so a cancelled or failed job left a public
    # MIXTURE of old and new assets (2026-11-13, run 43415382132: c3 + xtensa published, c6-watch
    # failed) under a SHA256SUMS that covered all of it. Now the build jobs only stage, and this job:
    #   * runs only when EVERY build job succeeded (the implicit success() below: all or nothing);
    #   * refuses a staged set that is not EXACTLY `release_targets.sh --expected` (from the manifests)
    #     before touching the release (tools/publish_nightly.sh);
    #   * prunes whole sets past 14 days first (the release had grown to 817 assets, cap 1000), uploads,
    #     VERIFIES each file's state and sha256 digest on the release, and only then writes the run's
    #     immutable SHA256SUMS-<date>-g<hash>: a set is published when that manifest exists. GitHub has
    #     no atomic multi-asset swap, so that manifest, not the asset list, is the commit record;
    #     plain SHA256SUMS is a copy of the latest, replaced last (docs/RELEASES.md).
    # tools/test_publish_nightly.sh proves each of those arms against a fake gh (gate.sh host).
    # Same main-only rule as every publisher (#571): needs ref-guard AND its own `if:` on the ref.
    name: publish the nightly (all or nothing, #574)
    needs: [ref-guard, riscv-targets, riscv-gui-targets, s3-target]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # gh release upload / asset delete: this job only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: staged }       # one subdirectory per staged set
      - name: Publish one complete set, SHA256SUMS last
        env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}' }
        run: bash tools/publish_nightly.sh staged
