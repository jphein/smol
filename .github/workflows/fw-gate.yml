# #338 — the firmware gate, in CI.
#
# Before this, `.github/workflows/` held only `pages.yml`: nothing built any feature tier, ran
# clippy, or ran the host suites. The "4-tier gate" cited in ONBOARDING.md and rust-toolchain.toml
# was prose plus whoever remembered to run it. On 2026-08-01 that cost us main sitting red on its
# own `-D warnings` rule unnoticed, a new feature (`ledger-provision`) with no matrix to add it to,
# and two agents separately hand-building baselines to compute a clippy delta.
#
# DELIBERATELY THIN: every actual command lives in `tools/gate.sh`, which a developer runs verbatim
# before pushing. If the gate logic lived here, the local instructions and CI would be two
# definitions free to drift — the same failure in a new place. This file only supplies a machine.
name: fw gate

on:
  pull_request:
  # #345: EVERY branch, not just main. With `branches: [main]` a commit pushed to a feature branch
  # whose PR had already closed triggered NOTHING — no `pull_request` event (the PR is closed) and
  # no `push` event (not main) — so it was silently ungated. That is not hypothetical: it happened
  # to this workflow's own follow-up commit within an hour of it landing (#341 squash-merged while
  # `ec16fe3` was in flight; the commit sat on a closed branch with zero CI and was only rescued
  # because the same work had been opened as a second PR).
  #
  # `'**'` is branches-only by design — it does NOT match tags. A release tag should not spend
  # forty minutes re-running a gate that already passed on the commit it points at.
  push:
    branches: ['**']
  workflow_dispatch:

# Keyed on the BRANCH, deliberately, so the `push` and `pull_request` events for the same branch
# land in ONE group and dedupe instead of double-running: `github.head_ref` is the PR's source
# branch and is empty for a push, where `github.ref_name` supplies the same name. Keying on
# `github.ref` (the previous form) could not dedupe them — a PR's ref is `refs/pull/N/merge` and a
# push's is the branch, so they were always distinct groups.
#
# `main` gets its OWN group and NEVER cancels: a branch push cannot reach `fw-gate-main`, and
# cancel-in-progress is false there, so an in-flight main gate always runs to completion. Over-
# running is the cheap failure here; a main gate cancelled by unrelated branch activity is not.
# (Two independent guarantees on purpose — either alone would do.)
#
# SECURITY: `github.head_ref` is attacker-controlled (a fork can name a branch anything), so it must
# never reach a `run:` shell or a checkout `ref:`. Here it is used ONLY as part of a concurrency
# GROUP NAME — an opaque scheduling label that is never evaluated — which is the form GitHub's own
# docs recommend. These two lines are the only interpolations in this file; keep it that way.
concurrency:
  group: fw-gate-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

env:
  CARGO_TERM_COLOR: always
  # Keep a runner's memory in bounds: these are LTO release builds of an embedded crate.
  SMOL_GATE_JOBS: 2
  # Where gate.sh leaves the stack verdict, declared ONCE so the arm that WRITES it and the summary
  # step that READS it cannot drift. They were two independent `/tmp/gate-stack-report` literals in
  # two files until 2026-08-25 — and when `tools/gate.sh`'s default moved out of `/tmp` (JP's tmpfs
  # directive: katana's /tmp is a 16 GB RAM-backed tmpfs), a workflow still reading the old literal
  # would have reported "stack number unavailable" on every run while every gate stayed green. Set
  # explicitly rather than relying on the script's default, so this file states what it reads.
  SMOL_GATE_STACK_REPORT: ${{ github.workspace }}/tmp/gate-stack-report

jobs:
  # Split so a Rust-only breakage is distinguishable at a glance from a host-logic regression,
  # and so the host suites still report when the riscv toolchain is the thing that broke.
  host:
    name: host verifier suites
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins `stable` + the riscv target + clippy; rustup honours it
      # automatically, so there is no version to restate here (and none to drift).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: experiments
          key: host
      - run: tools/gate.sh host

  # #533: the OTA-verify suite gets its OWN job rather than riding inside `gate.sh host`.
  #
  # Measured: the suite is 403 s; the host job is 161 s and the slowest job today is 214 s. Folding
  # it into `host` would take that job to ~564 s and make PR feedback 2.6x slower FOR EVERY PR,
  # including the ones that touch nothing it guards. As its own job it runs in PARALLEL, so the
  # wall-clock cost is 403 s instead of 564 s, the fast signals still arrive in ~3 minutes, and a
  # failure names itself instead of being one red line inside a nine-minute log.
  #
  # It invokes the suite directly rather than through `gate.sh`, which is the one place this
  # workflow's "every actual command lives in tools/gate.sh" rule is deliberately not followed: the
  # gate's arms are what a developer runs before pushing, and this one is explicitly the arm that is
  # too slow for that. `gate.sh` still runs it under SMOL_GATE_SLOW=1 for anyone touching
  # `ota_verify.sh`, and prints a loud SKIP line otherwise so nobody mistakes absence for a pass.
  ota_verify:
    name: OTA-verify suite (#533)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: tools/test_ota_verify.sh

  firmware:
    name: tiers + clippy + stack floor
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Show resolved toolchain
        working-directory: rust/clock
        run: rustc -vV && cargo clippy --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/clock
          key: fw
      # readelf reads _stack_start/_stack_end out of the riscv ELF (arch-independent); ubuntu-latest
      # ships binutils, but assert it rather than discovering its absence as a confusing FATAL.
      - name: Assert readelf present
        run: readelf --version >/dev/null

      - run: tools/gate.sh fw

      # The single highest-value line in this workflow, surfaced where a reviewer sees it without
      # opening logs. Both the #233 spike and the #266 rebase turned on this number and both found
      # it at the last possible moment; it was previously computed only at package time.
      - name: Stack number → job summary
        if: always()
        run: |
          {
            echo "### Canonical image stack"
            if [ -s "$SMOL_GATE_STACK_REPORT" ]; then
              echo '```'; cat "$SMOL_GATE_STACK_REPORT"; echo '```'
            else
              echo "_stack number unavailable — the canonical build did not reach the check._"
            fi
            echo ""
            echo "⚠️ This bounds the linked **region**, not runtime high-water. A struct in a"
            echo "stack-resident \`RadioManager\` can cost ~1.8 KB of real stack while moving this"
            echo "number by ~32 B. Green here is not evidence of runtime headroom."
            echo ""
            echo "⚠️ It is also **tree-dependent** and must not be compared byte-for-byte against a"
            echo "number from another tree: \`board.rs\`/\`secrets.rs\` are git-ignored and provisioned"
            echo "per tree, their literals land in \`.rodata\`/\`.data\`, and \`.stack\` is the leftover."
            echo "Same commit measures ~114,648 on a dev box and ~114,608 here (#348)."
          } >> "$GITHUB_STEP_SUMMARY"

      # #350: what this run actually covered, from the manifest rather than from this file.
      #
      # NOT a `strategy.matrix` fan-out yet, deliberately. Exactly one chip has `builds = true`
      # today (`esp-hal` is pinned to `esp32c3` and `.cargo/config.toml` pins the target), so a
      # fan-out would be one job wearing a matrix costume — and a permanently-red S3 arm would
      # teach everyone to ignore the gate, which is worse than not having it. The manifest is
      # already the single declaration; when #331 flips a second chip to `builds = true`, this
      # step's `include` becomes `strategy.matrix` and nothing else moves. Printing it now keeps
      # the emitter exercised and makes the coverage claim checkable by a reader.
      - name: Build matrix → job summary
        if: always()
        run: |
          {
            echo "### Build matrix (derived from \`tools/build-matrix.toml\`)"
            echo '```'
            tools/build_matrix.py check || true
            echo '```'
            echo "Jobs this manifest declares:"
            echo '```json'
            tools/build_matrix.py ci-matrix | python3 -m json.tool
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # #351 — the BYTE-FREE claims, checked instead of asserted.
  #
  # A SEPARATE JOB, not another step in `firmware`, because it builds with a different cargo
  # PROFILE (`CARGO_PROFILE_RELEASE_DEBUG=line-tables-only`) in a different target dir. Folding it
  # in would thrash the fingerprints the stack-floor build depends on and put two profiles'
  # artifacts in one rust-cache; hence its own `key: excl`.
  #
  # NOT for cost, and the first version of this comment was wrong to say so. MEASURED here: 2m59s
  # for all ten links on a COLD cache. The ~700 s it cited came from a local experiment that gave
  # every tier its own target dir and so paid for ten cold DEPENDENCY builds — not the shipped
  # path, which shares one dir and pays only the crate plus the LTO link per tier.
  #
  # ⚠️ WHAT THIS JOB'S GREEN MEANS. It links a DEBUG-INSTRUMENTED build, which is not the shipped
  # image: `line-tables-only` moves 464,180 of 1,027,816 ALLOC bytes and grows .text by 46 B,
  # against a control pair differing by 3 bytes of build stamp (tools/measure_debuginfo_delta.sh).
  # A size change means codegen differs, so inlining moved — and inlining is what line-table
  # attribution rides on. This arm is CORROBORATION; the proof is the [tier_exclusive] source
  # check inside `tools/gate.sh excl`, which costs nothing and is LTO-proof. A refusal here is a
  # true alarm worth 3 minutes of CI. Its silence is weaker evidence than it looks.
  exclusions:
    name: tier exclusions (#351)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/clock
          key: excl                      # its own cache: a different profile, so different artifacts
      # Same assertion as the `firmware` job, for the same reason — and it matters more here,
      # because without readelf this gate has no instrument at all.
      - name: Assert readelf present
        run: readelf --version >/dev/null

      - run: tools/gate.sh excl

      - name: Exclusions → job summary
        if: always()
        run: |
          {
            echo "### Tier exclusions — the BYTE-FREE claims"
            echo '```'
            tools/check_exclusions.py claims || true
            echo '```'
            echo "Derived from the \`#[cfg(feature = …)]\` on each \`mod\`, walked from"
            echo "\`src/main.rs\`, and cross-checked both ways against \`[tier_exclusive]\` in"
            echo "\`tools/build-matrix.toml\` — so REMOVING a gate fails the gate instead of"
            echo "quietly removing the claim along with it."
            echo ""
            echo "⚠️ This proves no **executable** bytes from an excluded module survived, via the"
            echo "DWARF line table (which attributes inlined code back to its source file). A"
            echo "consts-only module emits no line rows and is invisible — those are declared in"
            echo "\`tools/build-matrix.toml\`'s \`[unobservable]\` with a reason."
          } >> "$GITHUB_STEP_SUMMARY"
