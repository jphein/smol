name = "c6-watch"
chip = "esp32c6"
flavor = "gui"                   # its own workspace (subtree of the watch repo) — NOT rust/clock
source = "targets/c6-watch"

# TWO ARTIFACT AXES, because a folder can ship both flavors (#413 phase 3.1):
#   artifact      = the rust/clock FLEET image for this board
#   gui_artifact  = the targets/c6-watch GUI image, selected by `gui_board`
# Only this file decides; adding a GUI board is a manifest edit, never a workflow edit.

artifact = false
# NO FLEET ARTIFACT: rust/clock `cargo check`s clean for the C6 but cannot LINK a fleet image
# for it — the 6 MB OTA slots need the watch's `widen_rom_region` build.rs hook, which
# rust/clock does not carry ([chip.esp32c6] builds = false in tools/build-matrix.toml).

gui_artifact = true
gui_board = "board-waveshare-c6"
gui_artifact_name = "smol-watch-c6"
# The reference GUI board, and the only one of the three whose 71,680 B stack floor is a
# MEASURED number rather than a stand-in (src/main.rs splits the assert per board).
# Credentials are ABSENT from published GUI images, not placeheld — tools/ci_provision_gui.sh
# carries that argument and the assertion that enforces it.
