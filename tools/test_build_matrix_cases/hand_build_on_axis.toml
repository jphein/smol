# EXPECT: already on the CI matrix
# TARGETS: _targets_gw_c3
# The canonical chip crosses every tier, so a C3 hand build is a second, unchecked copy of a CI job.
[meta]
canonical_chip = "esp32c3"
canonical_tier = "fleet"
[chip.esp32c3]
target = "riscv32imc-unknown-none-elf"
builds = true
checks = true
ships = true
[chip.esp32s3]
target = "xtensa-esp32s3-none-elf"
builds = false
checks = true
ships = false
[tier.fleet]
features = "espnow,cast,io"
[tier.gw]
features = "gw,${canonical}"
[hand_build.s3-gw]
chip = "esp32c3"
tier = "gw"
