# build-matrix.toml — #350. The (chip, tier) matrix, declared ONCE as data.
#
# ── WHY ───────────────────────────────────────────────────────────────────────
# #338 made the canonical feature set a single variable so CI could not gate a different
# tier than the one that ships. That fixed the one-variable case. This is the same lesson
# generalised to a table, before #331 makes `chips x tiers` unbounded.
#
# The failure mode being designed against is not hypothetical. WLED's maintainers hand-
# enumerated their build environments and are on record that it became "impossible to
# maintain over several years"; their fix was to DERIVE the CI matrix from the config
# (`pio project config --json-output | jq ...`) rather than list it. Full study:
# `scratch/parity/multitarget-prior-art.md`.
#
# ── THE TWO RULES THIS FILE ENCODES ───────────────────────────────────────────
#
# 1. BUILDS AND SHIPS ARE SEPARATE DECLARATIONS. A target can be defined and compiled
#    while being deliberately absent from the release — OpenWrt's `DEFAULT := n`
#    (openwrt#12672), which kept 4/32 devices buildable after they stopped being shipped.
#    `ships = true` on a chip with `builds = false` is a contradiction and the checker
#    refuses it: you cannot ship what nothing compiles.
#
# 2. ONE AXIS AT A TIME. The matrix is (every buildable chip x the canonical tier) UNION
#    (the canonical chip x every tier). It is NEVER the cross product. Tasmota crosses its
#    27 locales only with the single spine variant — 99 binaries a release instead of 270 —
#    and that discipline is the only reason their matrix is still legible. `emit` refuses
#    to produce a cross product; `tools/test_build_matrix.sh` proves the refusal.
#
# ── WHAT THIS FILE DELIBERATELY DOES NOT CONTAIN ──────────────────────────────
# No expected image size, and no expected stack region. Both are TREE-DEPENDENT: `board.rs`
# and `secrets.rs` are git-ignored and provisioned per tree, their literals land in
# `.rodata`/`.data`, and `.stack` is whatever DRAM is left over — so the same commit
# measures 114,648 B here, 114,640 B under the CI templates locally, and 114,608 B on a
# GitHub runner (#348, 3dd35d1). A byte-equality assertion on either would be a gate that
# is red for everyone except the tree it was written on. The gates that DO apply are
# inequalities with margin — `.stack >= floor`, `image <= slot` — and they live in
# `repro_stack_check` / `ota_publish.sh`, which measure the artifact. Keep it that way: this
# file declares WHAT is built, never HOW BIG it came out.
#
# Per-chip MEMORY BUDGETS are not here either — they are `rust/clock/src/budget.rs` (#348),
# which has to be Rust because its mechanism is a compile-time const-assertion, and which
# moves to `smol-core` at #347 Phase 2, where a CI build matrix has no business. The chip
# ROSTER is therefore stated in two places by necessity, so `build_matrix.py check` asserts
# the two agree in BOTH directions and fails the gate if either grows a chip alone.

[meta]
# The chip whose all-tiers axis is crossed, and the tier crossed with every chip.
canonical_chip = "esp32c3"
canonical_tier = "fleet"

# ── CHIPS ─────────────────────────────────────────────────────────────────────
# `builds` means CI compiles it and a green run says something about it. It is FALSE for a
# chip the tree cannot compile today — declaring a job that always fails is worse than
# declaring none, because a permanently-red arm teaches everyone to ignore the gate.
# `blocked_on` records why, so the row is a tracked commitment rather than a wish.
#
# ── `checks`: THE THIRD DECLARATION (#347 Part 2) ─────────────────────────────
# Rule 1 above splits BUILDS from SHIPS. There turned out to be a rung below both, and leaving it
# undeclared is what made the de-pin hard to finish: a chip can COMPILE — `cargo check` clean, on
# the canonical tier, with its own features and its own target — long before CI can produce a
# linked, budget-honest, publishable artifact for it. Those are different claims and they were
# collapsed into one word.
#
# The C6 is the case that forced the split. Its arm passes `cargo check` clean TODAY, but it cannot
# have `builds = true`, because its 6 MB OTA slots need a `widen_rom_region` hook smol does not
# carry (see its row). Under a two-rung model the only truthful thing to say about the C6 was
# `builds = false` — which reads as "nothing about this chip works" and is the same
# rounding-a-caveat-to-zero that leaves the next person re-deriving what already holds.
#
# So: `checks` = "smol's own source compiles for this chip". It is what `tools/check_chips.sh`
# asserts, in BOTH directions — a `checks = true` chip that stops compiling fails the gate, and a
# `checks = false` chip that starts compiling ALSO fails it, because a stale pessimistic
# declaration is exactly as misleading as a stale optimistic one and this file's whole discipline
# is that a reason which has expired is worse than no reason. Every value below was measured, not
# predicted; two of them contradicted what the roster said before it was.
#
# The implication ladder is checked by build_matrix.py: ships => builds => checks. You cannot ship
# what nothing builds, and you cannot build what does not compile.

# ── `config_markers`: WHAT `.cargo/config.toml` MUST SAY FOR THIS CHIP (#280) ────────────────
# Literal strings that must appear INSIDE this chip's `[target.<triple>]` section of
# `rust/clock/.cargo/config.toml`. `tools/assert_cargo_config.sh` asserts them before a build.
#
# WHY THIS IS DECLARED DATA AND NOT A CHECKSUM. The file is git-TRACKED, but `~/Projects/.stignore`
# ignores `.cargo`, so the copy on a remote builder arrives OUT OF BAND — this repo's own build
# instructions tell agents to "copy .cargo/config.toml if missing". A manual copy satisfies
# "present" and never satisfies "current". On 2026-08-25 familiar's copy was found byte-current
# except for the S3 arm's `-Tlinkall.x`, added that morning by #398. A checksum would need ground
# truth from another host; markers need only what this manifest already knows.
#
# WHY THE SECTION SCOPE IS LOAD-BEARING. A whole-file grep for `-Tlinkall.x` PASSES on that exact
# stale file, because the two riscv arms carry it and only the xtensa arm was missing it. The
# assertion is therefore per-section, and a marker list that "works" under a file-wide grep is not
# the same check at all.
#
# WHY THESE MARKERS. Each is load-bearing AND silent at `cargo check` time, which is the pairing
# that makes a stale config expensive:
#   `-Tlinkall.x`          esp-hal's linker script. `cargo check` never links, so its absence is
#                          invisible until `ld` emits 129 undefined references (#398 measured
#                          exactly that on the S3: with the line, 129 -> 0).
#   force-frame-pointers   esp-backtrace needs them to unwind a panic. Absence costs nothing at
#                          build time and everything at the moment you need a backtrace.
#   linker-flavor=ld.lld   riscv ONLY. This machine's `cc` is a non-compiler shim, so the target
#                          link must not route through it. DELIBERATELY ABSENT from the S3 list:
#                          the xtensa target has no LLD backend and links through esp GCC, so
#                          pinning rust-lld there would BREAK it. Same reason, opposite action —
#                          which is precisely why this is per-chip data rather than one global list.

[chip.esp32c3]
target = "riscv32imc-unknown-none-elf"
config_markers = ["-Tlinkall.x", "force-frame-pointers", "linker-flavor=ld.lld"]
builds = true
ships  = true
checks = true

[chip.esp32s3]
# JP's next fleet target.
#
# #347 Part 2 REMOVED two of the three original blockers: `esp-hal` no longer hardcodes a chip
# (the `esp32s3` feature supplies it) and `.cargo/config.toml` now declares this triple instead of
# pinning only the C3's. What remains is a TOOLCHAIN fact, not a manifest one — which is why the
# reason below was rewritten rather than left standing. A `blocked_on` whose stated cause has been
# fixed reads as a considered decision and is the most expensive kind of stale comment.
target     = "xtensa-esp32s3-none-elf"
config_markers = ["-Tlinkall.x", "force-frame-pointers"]
builds     = false
ships      = false
# CHECKS PASS as of #398's S3 arm. The 6 errors this row used to catalogue fell in two moves:
#   * TSENS (2): the `has-tsens` fallback landed — `sensors.rs` grew cfg'd constructors and
#     `Reading.chip_c` became `Option<f32>` (a no-tsens chip omits the field, never fabricates).
#     This was ALSO the C5's named blocker; if the C5 unexpectedly compiles now, this gate will
#     say so and its row flips too.
#   * `SocResetReason` CPU-scoped spelling (4): predicated on the new `hal-cpu-reset-unindexed`
#     feature (the `hal-*` namespace = esp-hal API facts, distinct from `has-*` silicon facts —
#     see the block in rust/clock/Cargo.toml). See src/ota.rs's reset_reason_token().
checks     = true
# The xtensa toolchain is a property of the CHIP, declared here so no script hardcodes it. Empty /
# absent `toolchain` means the default (rust-toolchain.toml's `stable`).
toolchain  = "esp"
build_std  = "core,alloc"
# ⚠️ TOOLCHAIN-BUG WORKAROUND, not a preference — this row REVERTS when upstream fixes it.
# The shipping profile (opt-level = "s", lto = "fat") crashes the Xtensa LLVM backend on this
# chip's fleet-tier codegen:
#     rustc-LLVM ERROR: Incomplete scavenging after 2nd pass
# (opt = "z" crashes the same scavenger differently; 2 and 3 both link; matrix + upstream draft:
# targets/s3-cyd/BUDGET-PREP.md §6.1 and docs/upstream/xtensa-fat-lto-scavenger.md.) Threaded as
# CARGO_PROFILE_RELEASE_OPT_LEVEL for THIS CHIP ONLY — the global profile is shared with the C3
# and every C3 measurement on record (stack floors, #32 symbol sizes, byte-reproducibility)
# depends on it staying untouched.
# ⚠️ FIRST-FLASH CAVEAT, for whoever flashes the first S3 fleet image: a compiler that
# demonstrably mishandled this code at opt="s" merely LINKING at opt=2 is escape, not proof of
# correct codegen. Treat that flash as unproven silicon — not routine bring-up.
opt_level  = "2"
# `builds = false` is about CI, not about this tree. Xtensa is a Tier-3 target needing espup's `esp`
# channel (Xtensa Rust 1.95.0.0, pinned byte-identical on katana and familiar) plus
# `. ~/export-esp.sh` and a per-invocation `CARGO_UNSTABLE_BUILD_STD=core,alloc`. GitHub runners
# have none of it, and a permanently-red arm teaches everyone to ignore the gate (#343).
blocked_on = "ONLY the CI-runner toolchain remains (espup `esp` channel + export-esp.sh are not on GitHub runners): the manifest/target pins (#347 Part 2), the linkall+opt_level workaround (#408/#409), the display arm, AND the measured ChipBudget row (budget.rs ESP32S3_CYD, 2026-08-25) are all DONE — the chip builds, boots, meshes and draws on real hardware; only CI cannot compile it yet"
# When the toolchain question is answered, flipping `builds` to true is a ONE-WORD data change and
# the matrix, the CI jobs and the tier coverage all follow. That is the entire point of this file.
# `ships` stays false after that: OpenWrt's DEFAULT := n. Buildable is not shipped.

[chip.esp32c6]
# The esp32c6-watch already runs this chip in its own repo (#347 Phase 2's third consumer), and
# Part 1 landed its MEASURED ChipBudget row — which Part 2's per-feature lookup can now select.
target     = "riscv32imac-unknown-none-elf"
config_markers = ["-Tlinkall.x", "force-frame-pointers", "linker-flavor=ld.lld"]
builds     = false
ships      = false
# The manifest pin is gone. What blocks a green CI arm is smol's own code, not the chip plumbing:
# the ROM region. esp-hal generates a 4 MiB ROM region for the C6 and the measured row's 6 MB OTA
# slots exist only because the watch's `widen_rom_region` build.rs hook rewrites it. smol does not
# carry that hook, so a C6 image links against a 4 MiB ceiling while its budget claims 6 MB.
blocked_on = "needs the watch's widen_rom_region build.rs hook (#67 there) before the 6MB-slot budget row is honest; manifest + target pins are DONE (#347 Part 2), and `cargo check` is CLEAN (checks = true)"
# ✅ MEASURED CLEAN: `cargo check --no-default-features --features esp32c6,espnow,cast,io --target
# riscv32imac-unknown-none-elf` (SMOL_CHIP=esp32c6) compiles smol's entire source with zero errors
# — the only output is 3 pre-existing dead_code warnings for unused WEATHER_* constants in the
# git-ignored board.rs. This chip is the reason `checks` exists as its own axis: everything smol
# writes is C6-ready, and what remains is a LINK-time ROM-region fact above.
#
# Getting here took ONE line of source: src/ota.rs's glitch arm. Before it, the C6 arm failed with
# 2 errors and nothing else — TSENS resolved, the radio stack resolved, esp-wifi-sys resolved. The
# single most portable-looking function in the tree was the last thing pinned to the C3.
checks     = true

[chip.esp32c5]
# The NM-CYD-C5 (#388), fifth fleet target and the intended Zigbee-bridge role. Shares
# `riscv32imac` with the C6 — the triple CANNOT tell them apart, which is #349's whole subject;
# the chip FEATURE is what discriminates now.
target     = "riscv32imac-unknown-none-elf"
config_markers = ["-Tlinkall.x", "force-frame-pointers", "linker-flavor=ld.lld"]
builds     = false
ships      = false
# NO ChipBudget row, deliberately: nobody has measured this silicon, and `budget.rs` hands an
# unmeasured chip a poison row rather than the C6's numbers. `builds = false` is therefore also
# what keeps the roster check quiet — rule 1 of this file only demands a budget for a chip that
# BUILDS. The board-specific code stop-points are recorded on #388.
blocked_on = "no measured ChipBudget row yet (budget.rs hands an unmeasured chip the poison row); measure on hardware per #388, then flip `builds`"
# CHECKS PASS as of #398's S3 arm — the `has-tsens` fallback it landed was ALSO this row's last
# stop-point (sensors.rs cfg'd constructors + `Reading.chip_c: Option<f32>`), and the gate itself
# demanded this flip: it ran the C5, found it COMPILING CLEAN against a `checks = false`
# declaration, and refused the stale pessimism — exactly the failure-is-also-an-expectation
# behaviour this file promises. Two prior suspicions resolved by that run: the TSENS errors are
# gone (fixed, not moved), and the long-suspected "hard-typed GPIO9" stop-point never existed —
# the compiler reached the end and found nothing (it had been UNCONFIRMED, never measured; now it
# is disproven).
checks     = true

# ── TIERS ─────────────────────────────────────────────────────────────────────
# `features` is passed verbatim to `--features` (empty string = default features only).
# `${canonical}` expands to the canonical tier's feature string so the combined builds
# cannot drift from it — the #338 rule applied inside this file.
#
# `check` and `clippy` default to TRUE. A tier excluded from either needs a written reason
# in `why`: #343's finding was that a tier which only gets `cargo check` has its new
# warnings invisible, which is how findings accumulated unnoticed for months.

[tier.default]
features = ""

[tier.wifi]
features = "wifi"

[tier.espnow]
features = "espnow"

[tier.fleet]
# THE canonical fleet tier. Must equal `REPRO_FLEET_FEATURES` in tools/repro_build.sh, which
# stays the source of truth for the PACKAGING path — `repro_build.sh` is sourced by
# `ota_publish.sh`, and putting a TOML parser on the publish path is new failure surface for
# no gain. `build_matrix.py check` asserts the two strings are identical.
features = "espnow,cast,io"
ships    = true

[tier.bard]
# #347: off the C3 fleet image, still a supported build for chips with room. `off-fleet` is
# #348's declaration that this is not the fleet image; without it the budget predicate
# correctly refuses to compile the Bard for a C3. `repro_build_bin` refuses to PACKAGE
# anything naming `off-fleet`, so this tier cannot leak into a shipped artifact.
features = "bard,off-fleet,${canonical}"

[tier.ledger-provision]
# #181/#266. A deliberate USB-touch provisioning build, never shipped.
features = "ledger-provision"

# ── the three that nothing was compiling ──────────────────────────────────────
# Found by the `feature coverage` arm below when it was first written: `wled`, `coexist-soak`
# and `mesh-test` were in Cargo.toml with no tier anywhere, i.e. code paths CI never built —
# the exact `ledger-provision` case that motivated #338, still live in the file that fixed it.
# All three compile; they were simply never asked to.

[tier.wled]
# #26 smol Cast — the display streamed to a WLED matrix as realtime UDP pixels.
features = "wled,${canonical}"

[tier.coexist-soak]
# #23/#204 bench soak for the WiFi <-> ESP-NOW co-channel window.
features = "coexist-soak,${canonical}"

[tier.mesh-test]
# #13 routed-flood bench harness. It cannot RUN in CI — it needs a per-board `DEAF_MACS` that
# only a real board.rs has — but it can and must COMPILE. "Cannot run" was silently treated as
# "cannot build", which is how it stopped being compiled at all.
features = "mesh-test,${canonical}"

[tier.stack-paint]
# #300 bench instrument: paints the free stack with a sentinel and reports the true high-water —
# the measurement the whole stack floor is derived from. It carries `off-fleet` via its own
# Cargo.toml declaration (#350), because a build that exists to measure is by definition not the
# fleet image.
features = "stack-paint,${canonical}"

# ── features with NO tier, declared so the omission is a decision ─────────────
# The coverage arm requires every feature in Cargo.toml to be either covered by a tier above or
# listed here with a reason. An undeclared gap is a gate failure — the aspiration that used to
# live in a gate.sh comment ("any feature not covered below should be added"), made checkable.
[exempt]
default  = "the `default` tier IS this feature set"
hw       = "implied by every firmware tier; a tier for it alone would build nothing new"
hostsim  = "host-only, and covered by the `cargo test` arm in tools/gate.sh"

# ── #347 Part 2: the chip axis is not a tier ──────────────────────────────────
# A CHIP is the other axis of this very matrix — `[chip.*]` above — so a `[tier.esp32c5]` would
# duplicate the roster in the table designed to stop the roster being duplicated, and would make
# the cross product this file exists to refuse. Coverage of a chip feature is `builds = true` on
# its `[chip.*]` row; that is where the "is anything compiling this?" question belongs, and it is
# already checked in both directions against `budget.rs`.
#
# `esp32c3` is exempted for a second, stronger reason worth stating separately: it is carried by
# `default`, so EVERY tier in this file builds it. It is the most-compiled feature in the tree.
esp32c3 = "the chip axis, not a tier — carried by `default`, so every tier above already builds it"
esp32c5 = "the chip axis, not a tier — coverage is `builds` on [chip.esp32c5]"
esp32c6 = "the chip axis, not a tier — coverage is `builds` on [chip.esp32c6]"
esp32s3 = "the chip axis, not a tier — coverage is `builds` on [chip.esp32s3]"

# ── #347 Part 2: capability markers ───────────────────────────────────────────
# Empty marker features, selected BY a chip feature, existing to be `cfg`'d on. They cannot have a
# tier for the same reason as the chips (they are not an independent axis — no build chooses a
# capability, the silicon does), and right now they gate no code at all.
#
# ⚠️ THAT IS THE HONEST WEAKNESS OF THESE TWO ENTRIES, so it is written down rather than smoothed
# over. A marker nothing reads is indistinguishable from a marker that has quietly stopped being
# read, and this file's own rule is that an exemption whose reason has expired is worse than none.
# The reason has NOT expired — it has not yet started: both are declarations that the silicon has
# a thing, made at the point where the constraint is documented (see the ⚠️ blocks at each feature
# in rust/clock/Cargo.toml — the espnow⊕ieee802154 build-script panic, and esp-radio's heap never
# going in PSRAM). When code starts predicating on them, these entries stay valid unchanged; what
# would invalidate them is a `has-*` feature that pulls a real dependency, and that one needs a
# tier.
has-ieee802154 = "capability marker selected by esp32c5/esp32c6; gates no code yet and links nothing (see the mutual-exclusion note at its declaration)"
has-psram      = "capability marker selected by esp32s3; gates no code yet and links nothing (PSRAM mode is a RUNTIME PsramConfig field, not a feature)"

# ── The markers that DO gate code — a DIFFERENT exemption reason, deliberately ────────────────
# The two entries above are exempt because they gate nothing. These three are exempt for the
# opposite reason, and collapsing them into one shared "capability marker" reason would destroy
# the distinction this file exists to keep: they ARE compiled, on every tier, and still cannot
# have a tier of their own.
#
# Why they cannot: no build chooses a capability — the SILICON does. Each is selected by a chip
# arm, so `[tier.has-tsens]` would mean "build a C3 image that pretends it has no temperature
# sensor", which is not a configuration anyone can flash. The chip axis already covers them.
#
# ⚠️ AND THE HONEST PART: the gate's message says "no tier builds it", which is FALSE for all
# three. `default` carries `esp32c3`, which selects `has-tsens` and `has-reset-glitch-split`, so
# every one of the 10 jobs in this matrix compiles both — they are among the most-compiled
# features in the tree. The checker reads each tier's `features` string LITERALLY and cannot see
# a feature reached transitively through a chip arm, so a truly-covered feature still lands here.
# That is a limitation of the instrument, not a property of the feature, and the exemption says so
# rather than restating the checker's wrong claim back as a reason. Teaching the checker to expand
# the feature graph is the real fix and it is NOT done here (it would need to resolve Cargo.toml's
# feature closure, which is a cargo-metadata job, not a regex one) — recorded so the next person
# finds a known gap instead of rediscovering it.
#
# `has-reset-glitch-unified` is the one of the three that genuinely is NOT compiled by any job
# today: only the C5 selects it, and [chip.esp32c5] is `builds = false`. It is covered by a
# per-chip `cargo check` (tools/check_chips.sh), which is not part of this matrix.
has-tsens                = "capability marker selected by esp32c3/esp32c6/esp32s3, read by src/sensors.rs; the silicon picks it, not a build, so the chip axis covers it — compiled by every tier via `default`->esp32c3 though the checker cannot see through the chip arm"
has-reset-glitch-split   = "capability marker selected by esp32c3/esp32s3, read by src/ota.rs reset_reason_token(); same chip-axis reason — compiled by every tier via `default`->esp32c3"
has-reset-glitch-unified = "capability marker selected by esp32c5 ALONE, read by src/ota.rs; genuinely uncompiled by this matrix because [chip.esp32c5] is builds=false — covered by tools/check_chips.sh until it flips"
# `hal-*` is the third exemption story: not a silicon capability at all but an esp-hal API fact
# (see the namespace charter in rust/clock/Cargo.toml). No build chooses a spelling — the HAL
# does, per chip — so a `[tier.hal-cpu-reset-unindexed]` would mean "build an image that pretends
# esp-hal names the S3's reset reasons the C3 way", which cannot compile by construction.
hal-cpu-reset-unindexed  = "esp-hal API-fact marker (hal-* namespace) selected by esp32s3 ALONE, read by src/ota.rs reset_reason_token(); uncompiled by this matrix while [chip.esp32s3] is builds=false — covered by tools/check_chips.sh, same standing as has-reset-glitch-unified"
# `off-fleet` deliberately has NO entry here: the bard tier names it, so it is covered, and the
# checker rejects a feature that is both exempted and covered — an exemption whose reason has
# quietly stopped applying is worse than none. It caught this exact case when first written.

# ── modules #351's exclusion check cannot SEE, declared so the blind spot is a decision ───────
# `tools/check_exclusions.py` proves a module contributed no code to a tier that excludes it, by
# asking the tier's DWARF line table which source files its instructions came from. A module of
# pure `const`/`static` items emits no instructions, therefore no line-table rows, therefore
# nothing to find — and an absence check that cannot detect presence proves nothing at all. So
# the checker REFUSES to pass a claim it never observed anywhere, and an honest blind spot has to
# be written down here with its reason.
#
# Same discipline as [exempt] above, including the stale case: a module listed here that IS
# observed fails the gate, because a reason that has quietly stopped applying reads as a
# considered decision and is worse than no entry.
[unobservable]
# (`src/net/mesh_elect.rs` was here through stage 1 of #278 and is deliberately gone. Stage 2 added
# the `Frame::Elect` dispatch arm and the announce/follow paths, so the module now emits observable
# code in the espnow tier and the entry's claim became FALSE — the gate failed on it, which is the
# designed sequence working. Removed together with the paired `#[allow(dead_code)]` in net.rs; the
# two-sided marker is why neither could be dropped quietly.)

# #398: the FIRST CI-unbuildable exclusives — chip-gated on esp32s3, whose tiers cannot
# build on CI runners (xtensa toolchain absent; see [chip.esp32s3] blocked_on). Observed
# LOCALLY instead: tools/check_chips.sh compiles both on the pinned espup 1.95.0.0
# toolchain (familiar/katana), and both have run on real hardware (unit
# 14:C1:9F:D1:C8:10 — the board draws through s3_oled). When #413 puts the xtensa
# toolchain in CI (per-target releases), these two graduate back to observed and the
# gate will FAIL on these entries — the designed stale-claim sequence; delete them then.
"src/board_s3.rs" = "esp32s3 tiers cannot build on CI (no espup); observed locally via check_chips.sh + on hardware — graduates when #413 lands xtensa in CI"
"src/s3_oled.rs" = "esp32s3 tiers cannot build on CI (no espup); observed locally via check_chips.sh + on hardware — graduates when #413 lands xtensa in CI"

"src/secrets.rs" = """\
consts only (WIFI_NETWORK / MQTT_* / WLED_CAST_*) — 0 fn / 0 impl in both secrets.rs and \
secrets.rs.example, so it emits .rodata and no line rows. It is also git-ignored and \
provisioned per tree, so its contents are not a property of the commit at all."""

# ── the tier-exclusion COMMITMENT (#351) ──────────────────────────────────────────────────
# Which modules smol commits to keeping out of the tiers that do not enable them. The source
# already says this in each `#[cfg(feature = …)]`, and stating it twice is normally the thing
# that rots — so why here.
#
# Because it was MEASURED to be necessary. The realistic regression is not "someone references
# an excluded module": that does not compile, the module is not there. It is "someone drops the
# `#[cfg]` so their new call site compiles, and leaves the BYTE-FREE comment above it". Doing
# exactly that to `pub mod target;` put src/net/target.rs into the default tier — 11 crate files
# to 12 — and the ELF check reported **0 leaked**, because the claim it would have violated was
# derived from the very `#[cfg]` the regression deleted. A gate that can be silenced by editing
# its subject is not a gate.
#
# So: declared here, checked against the source in BOTH directions (same move #350 makes for the
# chip roster vs budget.rs). Removing a gate now fails the gate until the line below is deleted
# too — which puts the decision in the diff, where a reviewer sees it. Adding a gated module
# without an entry fails as well, so the table cannot quietly stop covering what is added later.
# The value is the gate CONJUNCTION, so changing a gate is caught, not only removing one.
#
# Regenerate with: tools/check_exclusions.py claims --toml
[tier_exclusive]
"src/textclip.rs" = "wifi"
# #398: chip-exclusive (esp32s3). The gate's contract is BOTH sections: this DECLARATION
# (so removing the cfg-gate later cannot go unnoticed) plus the [unobservable] excuse
