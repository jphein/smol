# smol · Control Room — LAYOUT-CARD 12-col grid (edge-to-edge, scalable) — v2 REAL CARDS.
# =====================================================================
# v1 used inline-styled markdown HTML → HA's sanitizer STRIPS style/class (JP screenshot:
# unstyled text) + CSP blocks data:svg in picture (broken topology). v2 fix:
#   • data → REAL cards (glance/entities/gauge); VT323 titles come from the theme.
#   • text → markdown SYNTAX (#, **) styled via card_mod `ha-markdown$` (shadow), readable fallback.
#   • topology → picture pointing at a SERVED FILE (/local/luna-cards/smol-topology.svg).
# build_control_room.py injects: TOPO url · LEGEND→entities card · fleet node cards (discovered).
# =====================================================================
title: smol · Control Room
path: smol-control
icon: mdi:chip
theme: smol
type: custom:grid-layout
layout:
  grid-template-columns: repeat(12, 1fr)
  grid-gap: 16px
  margin: 0
  mediaquery:
    "(max-width: 1000px)": {grid-template-columns: "repeat(6, 1fr)"}
    "(max-width: 720px)": {grid-template-columns: "1fr"}
cards:

  # ---- BANNER (span 12) ----
  # #311: the build script fills this. It used to be inline Jinja that read the headline **build**
  # and **last sync** from `update.smol_7_dominion_update` / `sensor.smol_7_status` — id7, which
  # turned out to be a RETAINED GHOST (cleared 2026-07-28). The dashboard's most prominent
  # fleet-wide figures were sourced from a board that was not there, and after the clear had no
  # backing at all. The generator now resolves them from the ELECTED crown, and counts lit sigils
  # from the discovered fleet rather than `^binary_sensor\.smol_\d+_online$` — a pattern that only
  # ever matched the hand-written 5/7/8/9 sensors, so it counted ghosts and missed the C6 watches.
  # The filled content is still Jinja, so channel/seq/lit stay live between runs.
  - type: markdown
    view_layout: {grid-column: "span 12"}
    content: "BANNER"
    card_mod:
      style:
        .: |
          ha-card { background:none; border:none; box-shadow:none; padding:0 4px; }
        ha-markdown$: |
          h1 { font-family:'VT323','IBM Plex Mono',monospace; font-size:54px; line-height:.8; margin:0; color:var(--primary-color); text-shadow:0 0 22px rgba(91,255,154,.35); letter-spacing:2px; }
          p { margin:5px 0 0; color:var(--secondary-text-color); font-size:12.5px; line-height:1.7; }
          strong { color:var(--primary-color); font-weight:600; }

  # ---- 01 · THE MESH (topology span 7 + legend span 5) ----
  - type: markdown
    view_layout: {grid-column: "span 12"}
    content: "**01**&nbsp;&nbsp;the mesh · topology"
    card_mod: &kick
      style:
        .: |
          ha-card { background:none; border:none; box-shadow:none; padding:10px 4px 0; }
        ha-markdown$: |
          p { margin:0; font-size:11px; letter-spacing:4px; text-transform:uppercase; color:var(--secondary-text-color); }
          strong { color:var(--primary-color); }

  - type: picture
    image: "TOPO"        # ← build script replaces with /local/luna-cards/smol-topology.svg?v=…
    view_layout: {grid-column: "span 7"}
    card_mod:
      style: |
        ha-card { border:1px solid var(--ha-card-border-color); border-radius:8px; overflow:hidden;
          box-shadow: inset 0 0 26px rgba(0,0,0,.9), var(--ha-card-box-shadow); position:relative; }
        ha-card:after { content:''; position:absolute; inset:0; pointer-events:none;
          background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.28) 2px 3px); }

  - type: markdown
    content: "LEGEND"    # ← build script replaces this card with a generated entities legend (span 5)
    view_layout: {grid-column: "span 5"}

  # ---- mesh-overview matrix: crown/channel + per-node build / slot / reset / OTA (span 12) ----
  - type: markdown
    content: "MESHOVW"   # ← build script fills the live fleet status matrix
    view_layout: {grid-column: "span 12"}
    card_mod:
      style:
        .: |
          ha-card { position:relative; overflow:hidden; }
          ha-card:before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--accent-color),transparent); opacity:.55; }
        ha-markdown$: |
          table { width:100%; border-collapse:collapse; font-family:'VT323','IBM Plex Mono',monospace; }
          th { text-align:left; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--secondary-text-color); border-bottom:1px solid var(--ha-card-border-color); padding:5px 10px; }
          td { font-size:16px; color:var(--primary-text-color); border-bottom:1px solid rgba(127,127,127,.12); padding:3px 10px; }
          td:first-child { color:var(--primary-color); }
          p { margin:2px 0 10px; font-size:13px; color:var(--secondary-text-color); }
          strong { color:var(--primary-color); }
          em { color:var(--secondary-text-color); font-style:normal; opacity:.7; font-size:11px; }

  # ---- #153 burst freeze + #217 coexist belief-vs-observation (span 12) ----
  # JP's standing complaint is UI freezes during WiFi, so the longest app gap gets the big
  # phosphor number and everything else is supporting text.
  - type: markdown
    content: "FREEZE"    # ← build script fills the burst-freeze + coexist verdict panel
    view_layout: {grid-column: "span 12"}
    card_mod:
      style:
        .: |
          ha-card { position:relative; overflow:hidden; }
          ha-card:before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,#5bd0ff,transparent); opacity:.55; }
        ha-markdown$: |
          h3 { margin:2px 0 0; font-family:'VT323','IBM Plex Mono',monospace; font-size:46px;
               line-height:.9; font-weight:400; color:#5bd0ff; text-shadow:0 0 10px rgba(91,208,255,.45); }
          p { margin:3px 0 9px; font-size:13px; color:var(--secondary-text-color); }
          p:first-child { font-size:11px; letter-spacing:3px; text-transform:uppercase; }
          strong { color:var(--primary-color); }
          em { font-style:normal; opacity:.78; font-size:11.5px; }
          code { font-size:11px; opacity:.8; }

  # ---- 02 · THE FLEET ----
  - type: markdown
    view_layout: {grid-column: "span 12"}
    content: |
      {% set on = states.binary_sensor | selectattr('state','eq','on') | map(attribute='entity_id') | select('search','^binary_sensor\.smol_\d+_online$') | list | count %}
      {% set tot = states.binary_sensor | map(attribute='entity_id') | select('search','^binary_sensor\.smol_\d+_online$') | list | count %}
      **02**&nbsp;&nbsp;the fleet · {{ tot }} sigils · {{ on }} online · nodes &amp; firmware
    card_mod: *kick

  - type: entities
    view_layout: {grid-column: "span 12"}
    title: set all sigils → default screen
    show_header_toggle: false
    entities:
      - entity: input_select.smol_all_screen
        name: Screen (all nodes)
      - entity: input_select.smol_all_page
        name: Page (all)
      - entity: input_select.smol_all_led
        name: LED (all nodes)
        icon: mdi:led-on
      - entity: input_button.smol_all_apply
        name: Apply to all — retained, on next burst
        icon: mdi:send-check
      # #302/#303 Bard controls — FLEET-WIDE, and this is where JP was looking for the size
      # slider. They used to be per-id in smol_bard.yaml for 7/8/9: 7 and 9 are retired, id8
      # runs a pre-Bard build, and id50/id51 — the only boards that can render a font — had no
      # control at all, so the node boxes rendered a row pointing at a nonexistent entity. One
      # set now fans out to every DISCOVERED node (see smol_bard.yaml), so adding a board needs
      # no edit here. These publish on change; no Apply press needed.
      - type: section
        label: Bard · fleet-wide (applies on change)
      - entity: input_select.smol_all_bard_font
        name: Text size (all nodes)
        icon: mdi:format-size
      - entity: input_number.smol_all_bard_speed
        name: Typewriter (ms/char) — reveal pace, NOT generation speed
        icon: mdi:speedometer
      - entity: input_select.smol_all_bard_mode
        name: Delivery (inf = endless · page = one screenful)
        icon: mdi:book-open-page-variant
      - entity: input_text.smol_all_tale
        name: Story opening — empty = each node's own persona
        icon: mdi:feather
      - entity: input_button.smol_all_reboot
        name: Reboot ALL nodes
        icon: mdi:restart-alert
        tap_action:
          action: perform-action
          perform_action: input_button.press
          target: {entity_id: input_button.smol_all_reboot}
          confirmation:
            text: "Reboot ALL smol nodes? The whole fleet drops off the mesh briefly."
    # The accent top-rule every plain data card wears. Anchored here (first use) and aliased
    # as *accent by the §04/§05/§06 cards below, which carry byte-identical styling live.
    card_mod: &accent
      style: |
        ha-card { position:relative; overflow:hidden; }
        ha-card:before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--accent-color),transparent); opacity:.55; }

  # ---- #43 DISPLAY UNITS · fleet-wide (°F/°C · 12h/24h) — STAGED; deploys with #46 CFG-relay proof ----
  # Global (not per-node): HA input_selects → retained smol/config/units=<F|C>|<12|24>, gateway relays to leaves.
  # Entities land with 1add131 (HA package) + fw read (lucid) + leaf relay (#46). HOLD live deploy until #46.
  - type: entities
    view_layout: {grid-column: "span 12"}
    title: display units · fleet-wide
    show_header_toggle: false
    entities:
      - entity: input_select.smol_temp_unit
        name: Temperature (°F / °C)
        icon: mdi:thermometer
      - entity: input_select.smol_clock_format
        name: Clock (24h / 12h)
        icon: mdi:clock-outline
      - type: divider
      - entity: sensor.smol_units
        name: Applied (retained → smol/config/units)
        icon: mdi:cog-sync
    card_mod:
      style: |
        ha-card { position:relative; overflow:hidden; }
        ha-card:before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--accent-color),transparent); opacity:.55; }

  - type: markdown
    content: "FLEET"   # ← build script REPLACES this with N node cards spliced DIRECTLY into the view grid
                       #    (each view_layout: span = adaptive; 4 sigils → 2×2). Nested grid-layout renders EMPTY — avoided.

  # ---- vitals · history (heap + uptime across the whole fleet, 24h) ----
  - type: markdown
    view_layout: {grid-column: "span 12"}
    content: "**02·b**&nbsp;&nbsp;vitals · heap &amp; uptime · 24h history"
    card_mod: *kick
  - type: markdown
    content: "VITALS"  # ← build script REPLACES this with heap + uptime history-graph cards (span 6 each)

  # ---- 03 · GLASS · POWER · FORGE ----
  - type: markdown
    view_layout: {grid-column: "span 12"}
    content: "**03**&nbsp;&nbsp;the glass · power · the forge"
    card_mod: *kick

  # THE GLASS — live OLED preview (what boards mirror) + override controls
  - type: vertical-stack
    view_layout: {grid-column: "span 4"}
    cards:
      - type: custom:mushroom-template-card
        primary: "{{ states('sensor.smol_display_batt').replace('|',' · ') if states('sensor.smol_display_batt') not in ['unknown','unavailable','none',''] else 'BATT · —' }}"
        secondary: "{{ states('sensor.smol_display_grid').replace('|',' · ') if states('sensor.smol_display_grid') not in ['unknown','unavailable','none',''] else 'GRID · —' }}"
        icon: mdi:blank
        card_mod:
          style:
            .: |
              ha-card{background:#020402;border:1px solid var(--ha-card-border-color);border-radius:10px 10px 0 0;border-bottom:none;box-shadow:inset 0 0 12px rgba(0,0,0,.9);position:relative;overflow:hidden;padding-top:22px}
              ha-card:before{content:'THE GLASS · what every board mirrors';position:absolute;top:7px;left:14px;font-size:9px;letter-spacing:1px;color:#2f7a4e;z-index:2}
              ha-card:after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.35) 2px 3px)}
              mushroom-shape-icon{display:none}
            mushroom-state-info$: |
              .primary{font-family:'VT323','IBM Plex Mono',monospace;font-size:19px;line-height:1.2;color:var(--primary-color);text-shadow:0 0 5px rgba(91,255,154,.5);white-space:normal}
              .secondary{font-family:'VT323','IBM Plex Mono',monospace;font-size:19px;line-height:1.2;color:var(--primary-color);opacity:.85;white-space:normal}
      - type: entities
        show_header_toggle: false
        card_mod:
          style: "ha-card{border-radius:0 0 10px 10px;border-top:none;margin-top:-1px}"
        entities:
          - type: section
            label: override the glass
          - entity: input_boolean.smol_display_override
            name: Override — hand-write lines
            icon: mdi:pencil
          - entity: input_text.smol_display_line1
            name: Line 1
          - entity: input_text.smol_display_line2
            name: Line 2
          - entity: input_text.smol_display_line3
            name: Line 3

  # POWER & SOLAR
  # These four rows shipped as PLACEHOLDER entity ids that never existed in this HA
  # (`sensor.battery_bank_soc`, `sensor.ev_battery_soc`, `sensor.house_load`,
  # `sensor.solar_charge_current`) — the README always said "remap to your own". #305's
  # dead-row check is what finally made them visible instead of silently blank. Mapped to
  # the real topology 2026-07-28 on JP's instruction ("grid draw watts, solar battery soc
  # epever, and bmw i3 battery"):
  #   solar bank SOC  -> sensor.epever_battery_soc      (EPEver charge controller, Modbus)
  #   EV pack SOC     -> sensor.battery_emulator_0fcc_soc  (the BMW i3 pack, read over CAN
  #                      by Battery-Emulator; SoH 80% confirms it is the repurposed pack.
  #                      NOT sensor.battery_average_soc — that is the inverter's average
  #                      across banks, not the i3.)
  #   grid draw       -> sensor.yurt_consumption + the two PJ2101A clamps. This is the SAME
  #                      source `smol_publish_grid_display` renders onto the glass, so the
  #                      card and the OLED can never disagree. Total is kW; the legs are the
  #                      watts, which is why both are shown.
  #   solar charge    -> sensor.epever_charging_current
  # NOTE: the EPEver rows read `unavailable` whenever its Modbus link is down (it was live
  # this morning and dropped at 17:46 on 2026-07-28). That is a correct wiring showing a
  # real outage — do NOT "fix" it by pointing at a different battery.
  - type: vertical-stack
    view_layout: {grid-column: "span 4"}
    cards:
      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.epever_battery_soc
            name: solar bank
            unit: "%"
            min: 0
            max: 100
            severity: {green: 60, yellow: 35, red: 0}
          - type: gauge
            entity: sensor.battery_emulator_0fcc_soc
            name: i3 pack
            unit: "%"
            min: 0
            max: 100
            severity: {green: 50, yellow: 25, red: 0}
      - type: entities
        title: power & solar · sources on the glass
        show_header_toggle: false
        entities:
          - entity: sensor.yurt_consumption
            name: grid draw
          - entity: sensor.l1_power_clamp
            name: · L1
          - entity: sensor.l2_power_clamp
            name: · L2
          - entity: sensor.epever_charging_current
            name: solar charge
        card_mod:
          style: |
            ha-card { position:relative; overflow:hidden; margin-top:-2px; }
            ha-card:before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--primary-color),transparent); opacity:.55; }

  # THE FORGE · OTA — staged + per-node status (generated) + canary install
  - type: vertical-stack
    view_layout: {grid-column: "span 4"}
    cards:
      - type: entities
        title: the forge · OTA (canary-first)
        show_header_toggle: false
        card_mod:
          style: |
            ha-card { position:relative; overflow:hidden; border-radius:10px 10px 0 0; border-bottom:none; }
            ha-card:before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--accent-color),transparent); opacity:.55; }
        entities:
          - entity: sensor.smol_ota_staged
            name: Staged build
            icon: mdi:package-up
          - type: attribute
            entity: sensor.smol_ota_staged
            attribute: url
            name: Image URL
      - type: markdown
        content: "FORGE_OTA"   # ← build script fills per-node OTA status (installed → latest / offline)
        card_mod:
          style:
            .: |
              ha-card{border-radius:0;border-top:none;border-bottom:none;margin-top:-1px;padding-top:0}
            ha-markdown$: |
              p{margin:3px 0;font-size:12px;color:var(--secondary-text-color)}
              strong{color:var(--primary-color)}
      - type: entities
        show_header_toggle: false
        card_mod:
          style: "ha-card{border-radius:0 0 10px 10px;border-top:none;margin-top:-1px}"
        entities:
          - entity: FORGE_INSTALL   # ← build script replaces with per-node install buttons (canary-first)

  # =====================================================================================
  # §04 / §05 / §06 — BACK-PORTED FROM LIVE (#305, 2026-07-28).
  # These three sections were hand-built on the live dashboard and never existed here, so
  # the repo could not reproduce the Control Room. On 2026-07-27 the generator's old
  # remove-then-append save DELETED all ten of them; the merge in build_control_room.py now
  # preserves live-only cards, but "preserved" is not "reproducible" — a rebuilt HA would
  # still have lost them. Transcribed verbatim from the live `smol-mesh` dashboard, verified
  # deep-equal against it card-for-card.
  #
  # Placed BEFORE the footer, which is where the section numbering says they belong. Live
  # currently shows them AFTER the footer purely because the merge appends unknown cards to
  # the end — an artifact of the incident, not a layout choice. The next generator run will
  # therefore move the footer back to last. That is the only visual change this commit implies.
  #
  # DEBT (deliberately not fixed here): the per-node cards below are STATIC and name ids
  # 7/8/9 by hand, but the live fleet is 5/8/50/51 — ids 7 and 9 are retired. Node BOXES are
  # generator-owned and die with their node; these are not, so they will show `unavailable`
  # rows forever. The fix is to generate them from the registry like node_card() does, which
  # is a generator change, not a scaffold one. Left as-is so this commit stays a faithful
  # back-port; the banner above already hardcodes smol_7 the same way.
  # =====================================================================================

  # ---- 04 · THE HERALD · messaging (#160) ----
  - type: markdown
    view_layout: {grid-column: "span 12"}
    content: "**04**&nbsp;&nbsp;the herald · text your sigils · notify targets &amp; message log (#160)"
    card_mod: *kick

  - type: entities
    view_layout: {grid-column: "span 6"}
    title: scribe a message → the glass
    show_header_toggle: false
    entities:
      - entity: input_select.smol_msg_target
        name: Target sigil
        icon: mdi:target
      - entity: input_text.smol_msg_text
        name: Message
        icon: mdi:message-text-outline
      - entity: input_select.smol_msg_size
        name: Size
        icon: mdi:format-size
      - entity: input_select.smol_msg_align
        name: Align
        icon: mdi:format-align-center
      - entity: input_number.smol_msg_duration
        name: Show for (s · 0 = keep)
        icon: mdi:timer-sand
      - entity: input_boolean.smol_msg_priority
        name: Priority (interrupt — future fw)
        icon: mdi:alert-decagram
      - type: divider
      - entity: input_button.smol_msg_send
        name: SEND to glass
        icon: mdi:send
      - entity: input_button.smol_msg_clear
        name: CLEAR + revert
        icon: mdi:backspace-outline
    card_mod: *accent

  - type: entities
    view_layout: {grid-column: "span 6"}
    title: last message per sigil
    # ids 7/9 rows removed 2026-07-28 (#311): their sensors survive the package retire as
    # entity-registry ORPHANS (unique_id keeps the husk, `restored: true`, permanently
    # `unavailable`), so these rows rendered as dead controls rather than vanishing. Caught
    # by --check's orphan pass, which exists because a membership test called them healthy.
    show_header_toggle: false
    state_color: true
    entities:
      - entity: sensor.smol_8_last_message
        name: Eldritch Nexus
        secondary_info: last-changed
    card_mod: *accent

  # ---- 05 · OVERRIDES · IO · SCAN · CROWN-STEER ----
  # `broker` / `ota_host` are input_text HELPERS: the dashboard names the control, the VALUE
  # lives in HA. No LAN address is committed here, and none should be — see ha/README.md.
  - type: markdown
    view_layout: {grid-column: "span 12"}
    content: "**05**&nbsp;&nbsp;overrides · IO · scan · crown-steer"
    card_mod: *kick

  # ---- per-node overrides & IO — GENERATED (#311) ----
  # The build script replaces this with one card per LIVE sigil, resolved from the HA device
  # registry and gated on the node's helpers actually existing.
  - type: markdown
    content: "OVERRIDES"
    view_layout: {grid-column: "span 12"}

  # ---- ids 7 and 9: cards REMOVED, coupled to the package retire (#311) ---------------------
  # These were JP's two hand-written `Dominion` / `Herald · overrides & IO` cards. They are gone
  # because 53f45bf retired the helpers behind them from ha/packages/smol_mesh.yaml: at the next
  # `ha_deploy.sh push` every row would render 'Entity not found', so JP would open his dashboard
  # to two visibly broken panels the day after we finished fixing it. Removing them is coupled to
  # that deploy — it is not an opinion about whether he wants the controls.
  #
  # The hardware those ids named is not lost; it answers as id50/id51 now, and the OVERRIDES
  # placeholder above gives any live sigil a card automatically the moment its helpers exist.
  # To restore: `git show 18ceba5:ha/dashboard/smol-control-scaffold.yaml` has them verbatim.

  - type: entities
    view_layout: {grid-column: "span 6"}
    title: "fleet · crown-steer & scan"
    show_header_toggle: false
    entities:
      - entity: input_text.smol_channel_hint
        name: Channel hint (empty = clear)
        icon: mdi:access-point
      - entity: input_button.smol_channel_hint_apply
        name: Apply channel hint
        icon: mdi:access-point-check
      - entity: input_button.smol_channel_hint_clear
        name: Clear channel hint
        icon: mdi:access-point-remove
      - type: divider
      - entity: input_button.smol_all_scan
        name: Scan ALL (WiFi)
        icon: mdi:wifi-refresh
    card_mod: *accent

  # ---- 06 · TIME SYNC · NTP freshness ----
  - type: markdown
    view_layout: {grid-column: "span 12"}
    content: "**06**&nbsp;&nbsp;time sync · NTP freshness — reads RED fleet-wide until #192 periodic re-sync ships (not a bug)"
    card_mod: *kick

  - type: entities
    view_layout: {grid-column: "span 6"}
    title: time sync · NTP freshness
    # ids 7/9 rows removed 2026-07-28 (#311): their sensors survive the package retire as
    # entity-registry ORPHANS (unique_id keeps the husk, `restored: true`, permanently
    # `unavailable`), so these rows rendered as dead controls rather than vanishing. Caught
    # by --check's orphan pass, which exists because a membership test called them healthy.
    show_header_toggle: false
    state_color: true
    entities:
      - entity: sensor.smol_ntp_fleet
        name: Fleet freshness
        icon: mdi:clock-check
      - type: divider
      - entity: sensor.smol_8_ntp_fresh
        name: Nexus
        secondary_info: last-changed
    card_mod: *accent

  # ---- FOOTER (span 12) ----
  - type: markdown
    view_layout: {grid-column: "span 12"}
    content: >
      **smol · Control Room** — one phosphor surface for the ESP-NOW mesh: live topology,
      per-node screens + firmware, the shared glass, power, and the OTA forge. Retained MQTT
      everywhere; nodes apply on their next burst — no reflash. Fleet + topology auto-scale as sigils join.
    card_mod:
      style:
        .: |
          ha-card { background:none; border:none; box-shadow:none; }
        ha-markdown$: |
          p { font-size:11px; color:var(--secondary-text-color); line-height:1.8; border-top:1px solid var(--ha-card-border-color); padding-top:12px; }
          strong { color:var(--primary-text-color); }
