# smol · Bard story-prompt package (#303) — the runtime story opening, per node.
# =====================================================================
# ADDITIVE COMPANION, deployed as its own file. That is deliberate: the live HA carries
# `smol_notify.yaml` and `smol_telemetry.yaml` as separate additive packages (HA merges
# same-domain keys across package files), while `smol_mesh.yaml` is NOT currently deployed
# there — so a self-contained file is the pattern that actually works on this instance and
# cannot collide with whatever `smol_mesh.yaml` does or does not define. Everything here is
# NEW (unique_ids and entity names appear nowhere else).
#
# WHAT THIS CONTROLS
# The Bard (#300) is a 260K-param transformer that writes stories ON the board. This package
# sets the OPENING it continues, per node, at runtime — no reflash:
#   input_text.smol_<id>_tale  ->  retained  smol/<id>/config/tale  ->  CFG key `T`
# Empty value = retain-clear => the node falls back to its built-in persona prompt
# (id8 owl), the same "empty = default" convention as the `S` key. The firmware still carries a
# persona per id — the dragon and bird belonged to id7/id9, which no longer exist on the air
# (the hardware runs as id50/id51 since #198 Phase-2, and identity lives in NVS, which OTA
# never touches). Their controls were retired 2026-07-28; id50/id51 get theirs from the
# firmware-published discovery configs of #309, NOT from a hand-written block here.
#
# THE VALIDATION LIVES ON THE NODE, NOT HERE — and that is not laziness. Checking a prompt
# means encoding it with the model's own 512-token vocabulary, and the model is on the board.
# The firmware refuses bytes it has no token for (emoji, most non-ASCII) and refuses prompts
# that would spend too much of the shared 80-token window, KEEPING THE PREVIOUS PROMPT rather
# than derailing generation. A refusal is logged on the node (`smol #303: ... REFUSED`), not
# surfaced in HA — so if a prompt seems ignored, read the board's log.
#
# GUIDANCE FOR THE FIELD: simple nursery words work ("One day, a little owl found a red ball").
# Proper nouns are ACCEPTED but fragment into char-level tokens and read worse; that is the
# documented trade, not a bug. Shorter openings leave more window for the tale.
#
# Deploy: cat ha/packages/smol_bard.yaml | ssh jp@10.0.6.108 \
#           "sudo tee /homeassistant/packages/smol_bard.yaml > /dev/null"
#         then POST /api/services/homeassistant/reload_all (new input_* helpers AND mqtt
#         sensors need reload_all; automation.reload alone does not register them).

input_number:
  # #302 typewriter pace, in MILLISECONDS PER CHARACTER — the reveal clock, which is NOT the
  # generation clock. The board generates at ~224-274 ms/token in endless mode; this only sets how
  # fast finished text is unveiled. (Confusing the two axes has already caused one bug.) The leaf
  # clamps to 20..=500, so out-of-range values are corrected on the node, not here.
  # FLEET-WIDE, not per id. An `input_*` helper cannot be wildcarded in YAML the way an MQTT
  # trigger can, so "one definition for the whole fleet" here means ONE control that fans out,
  # rather than N controls generated per node. That is the honest shape: the previous per-id set
  # existed only for 7/8/9, and 7/9 are retired while id8 runs a pre-Bard build — so the only
  # boards that can actually render a font (id50/id51) had NO control at all, and the dashboard
  # rendered them a row pointing at a nonexistent entity. That is what JP was looking for and
  # not finding. Adding 50/51 by hand would just move the goalposts (#308/#309/#310).
  smol_all_bard_speed:
    name: "smol fleet typewriter (ms/char)"
    min: 20
    max: 500
    step: 10
    unit_of_measurement: "ms"
    mode: slider
    icon: "mdi:speedometer"

input_select:
  # #302 delivery mode. `inf` = the story never ends (the screen is a window the tale moves past);
  # `page` = one screenful of new text, then wait for a button press. NOTE: `inf` is near-continuous
  # compute — measured 0.2 W / ~40 mA at the USB side, the fleet's worst-case draw — so it is the
  # mode to avoid on a battery build.
  # #302 TEXT SIZE. Discrete, not continuous — the panel has four fonts, so a select is honest
  # where a slider would imply sizes that do not exist. The label carries what actually changes:
  # the character grid. Bigger text = fewer characters on the 72x40 glass; the story window is
  # measured in TOKENS, so a larger font shows LESS story without changing what the model writes.
  smol_all_bard_font:
    name: "smol fleet text size"
    options: ["5x8 · 14x5 small", "6x10 · 12x4 medium", "9x15 · 8x2 large", "10x20 · 7x2 huge"]
    icon: "mdi:format-size"
  smol_all_bard_mode:
    name: "smol fleet delivery"
    options: ["inf", "page"]
    icon: "mdi:book-open-page-variant"

input_text:
  # #303 Bard story prompt: the OPENING the on-device LLM continues. Empty = that node's
  # built-in persona ("Once upon a time, there was a little owl" for id8). The NODE validates
  # against the model's own 512-token vocabulary and keeps its previous prompt on refusal, so a
  # bad value here degrades nothing — watch the node's log for "story prompt REFUSED".
  # Keep the words SIMPLE (TinyStories nursery vocabulary): emoji and most non-ASCII are refused
  # outright, and unusual names fragment into char-level tokens and read worse. max 64 = the
  # firmware's CFG_VALUE_MAX and prompt buffer; every prompt token is a story token spent from
  # the shared 80-token window, so shorter openings leave longer tales.
  smol_all_tale:
    name: "smol fleet story prompt (Bard)"
    max: 64

automation:
  - id: smol_bard_delivery_publish
    alias: "smol #302: publish per-node Bard delivery (pace + mode)"
    description: >-
      Either helper changing republishes the whole retained value, because CFG key `V` carries
      BOTH fields as `<ms_per_char>:<mode>` in one frame (the same compound-in-one-key shape as
      `S`'s `<AppKind>:<page>`). Applies live on the node, mid-tale, without a reboot.
    # QUEUED, not parallel. `parallel` was right while this was per-id: three helpers, three
    # independent nodes, no shared state. It is now ONE composed payload fanned to every node, so
    # two quick changes race — run A computes its value, run B computes a newer one, and `parallel`
    # guarantees no ordering. If A's publishes land after B's, the retained topics keep A's OLDER
    # value. Nothing heals that: both automations here are state-triggered only, and NOTHING
    # republishes `config/delivery` or `config/tale` on a timer (verified: the only `time_pattern`
    # automations live in smol_mesh.yaml and touch neither topic). So a lost race is permanent
    # until somebody happens to touch a control again — the live-vs-desired drift `config_drift`
    # exists to catch, in a file with no heartbeat to expose it. The window is ~6x wider than it
    # was, because one change is now six sequential publishes.
    #
    # `queued` serialises, so the last run reads the latest state and lands last. `restart` would
    # also work HERE (B republishes to every node, so aborting A mid-loop loses nothing) but it is
    # not uniform: the tale automation publishes `trigger.to_state.state` rather than re-reading,
    # so the two would need different reasoning. `queued` needs none.
    mode: queued
    max: 10
    trigger:
      - platform: state
        entity_id:
          - input_number.smol_all_bard_speed
          - input_select.smol_all_bard_mode
          - input_select.smol_all_bard_font
    condition:
      - condition: template
        # Blocks the entity APPEARING (from_state None) and an availability blip, but NOT
        # `unknown` -> value. With `initial:` removed these helpers start `unknown` and stay
        # there until an operator chooses, so `unknown` is exactly the from_state of JP's FIRST
        # selection. Excluding it would have made the very first change a silent no-op — a worse
        # bug than the revert that removing `initial:` fixes, and the same "control does nothing"
        # class as the 5x8 omission.
        value_template: "{{ trigger.from_state is not none and trigger.from_state.state != 'unavailable' }}"
    action:
      # The FLEET is discovered at run time, not listed. `sensor.smol_<id>[_<slug>…]_status` is a
      # firmware-published MQTT-discovery entity, so its existence IS the node announcing itself —
      # the same source the dashboard generator discovers from. The slug is `(_[a-z0-9]+)*` (ANY
      # number of segments): a `?` there allowed only one and would miss the two-segment ids that
      # appear once discovery publishes the full sigil, which is exactly the quantifier that caused
      # a whole-fleet blackout in the generator (960bf1e).
      # WHY THIS IS SAFE, and it is a property to protect rather than luck: it keys on
      # `sensor.smol_<id>…_status`, an entity the FIRMWARE publishes via MQTT discovery. Clearing
      # a discovery config removes the entity outright, whereas a YAML-defined entity with a
      # `unique_id` leaves a `restored: true` REGISTRY HUSK behind — the id7/id9 retirement left
      # 110 of them. A husk that matched would make this fan out to a board that does not exist,
      # forever. Verified against live state: 6 matches (ids 5/8/50/51/122/236), no id7/id9 husk.
      # Do NOT "improve" this to also match YAML-defined entities.
      #
      # Dormant boards ARE included on purpose (id236 unavailable, id122 empty state): the publish
      # is RETAINED, so a sleeping board picks the value up when it wakes. Gate on state if that is
      # ever not wanted — but a config the fleet agrees on is worth more than one only live boards saw.
      - variables:
          fleet: >-
            {%- set ns = namespace(ids=[]) -%}
            {%- for e in states.sensor | map(attribute='entity_id') | select('search','^sensor\\.smol_\\d+(_[a-z0-9]+)*_status$') -%}
              {%- set id = e.split('.')[1].split('_')[1] -%}
              {%- if id not in ns.ids -%}{%- set ns.ids = ns.ids + [id] -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.ids }}
          # Built ONCE, outside the loop: every node gets the identical value, and building it per
          # iteration would re-read the helpers and could straddle an operator's second change.
          # int() because an input_number carries a float ("160.0" would not parse on the leaf).
          #
          # REVISIT once the whole fleet runs a build containing 7017d39. That firmware change
          # (taken from this finding) makes an absent font mean DEFAULT rather than keep-current,
          # which makes omitting `:5x8` correct again — and omitting it restores pace/mode control
          # on boards too old to parse a font field. It is NOT safe yet: every board is on v906,
          # where absent still means keep-current, so omitting would resurrect the unreachable
          # default this same commit fixed. Condition to flip: no board on a pre-7017d39 build.
          #
          # The font is ALWAYS sent, including `5x8`. It used to be omitted when 5x8, for
          # compatibility with firmware predating the field — but the firmware reads an ABSENT
          # third field as "keep the current font" (delivery.rs: `None | Some(b"") => current.font`).
          # The two together made the default UNREACHABLE: once an operator picked 9x15, selecting
          # "5x8 · 14x5 small" published `160:inf`, the node kept 9x15, and the control silently
          # did nothing. A control that cannot return to its own default is the same defect class as
          # a row pointing at a nonexistent entity — it reads as a broken board.
          #
          # The cost is that a board on pre-font firmware now REFUSES the whole delivery value
          # (`inf:5x8` fails its mode match) instead of accepting pace/mode. Accepted deliberately:
          # a build too old to parse the font field is too old to run the Bard at all, so pace and
          # mode have nothing to act on there. The better long-term fix is firmware-side — read an
          # absent font as the DEFAULT rather than as "keep current" — and then this can go back to
          # omitting it.
          # EVERY field is defaulted, because any of the three can be `unknown`. Removing
          # `initial:` (so an operator's choice survives a restart) means a helper reads `unknown`
          # until someone touches THAT control — so changing the speed slider first would other-
          # wise publish `200:unknown:unknown`, and the firmware refuses the whole value on a bad
          # mode or font. The operator would have moved a slider and had nothing happen, which is
          # the third form of this same bug today. Defaults match the firmware's own: 160 ms,
          # `inf`, `5x8`.
          value: >-
            {%- set na = ['unknown', 'unavailable', 'none', ''] -%}
            {%- set ms_raw = states('input_number.smol_all_bard_speed') -%}
            {%- set ms = 160 if ms_raw in na else ms_raw | int(160) -%}
            {%- set mode_raw = states('input_select.smol_all_bard_mode') -%}
            {%- set mode = 'inf' if mode_raw in na else mode_raw -%}
            {%- set font_raw = states('input_select.smol_all_bard_font') -%}
            {%- set font = '5x8' if font_raw in na else font_raw.split(' ')[0] -%}
            {{ ms }}:{{ mode }}:{{ font }}
      - choose:
          # The notification_id is PER CONTROL (`_delivery` / `_tale`), not shared. With one id the
          # two automations cross-clear: a successful tale fan-out dismisses a warning raised by a
          # failed delivery fan-out, and the font value stays unapplied with no warning and nothing
          # to re-apply against. There is a defensible fleet-wide reading — "no node was discovered"
          # is not per-control — but the message promises the operator that the notice tracks THEIR
          # control ("re-apply the control ... and this notice will clear itself"), and a signal
          # cleared by something other than the condition it described is the bug we keep finding.
          # Two notices when two controls failed is correct, not noise.
          #
          # An empty fleet reaching zero nodes and reporting SUCCESS is the exact disease this
          # whole campaign is about. `fleet` comes from MQTT-discovery entities, and after an HA
          # restart there is a window before the retained discovery configs replay — a control
          # changed in that window silently reaches nobody. Say so, loudly, because the operator
          # needs to know their change did not apply and should be re-made.
          - conditions: "{{ fleet | count == 0 }}"
            sequence:
              - service: persistent_notification.create
                data:
                  notification_id: smol_bard_fanout_empty_delivery
                  title: "smol: a Bard delivery setting reached NO nodes"
                  message: >-
                    A Bard delivery setting (text size / pace / mode) changed, but no smol node was discovered at that moment, so
                    nothing was published. This is usually the window just after an HA restart,
                    before the retained MQTT discovery configs replay. Re-apply the control once
                    the fleet is back and this notice will clear itself.
        default:
          # Clears the warning above once a fan-out reaches somebody, so a stale notice cannot
          # outlive the condition it described.
          - service: persistent_notification.dismiss
            data:
              notification_id: smol_bard_fanout_empty_delivery
          - repeat:
              for_each: "{{ fleet }}"
              sequence:
                - service: mqtt.publish
                  data:
                    topic: "smol/{{ repeat.item }}/config/delivery"
                    retain: true
                    qos: 1
                    payload: "{{ value }}"

  - id: smol_tale_publish
    alias: "smol #303: publish per-node Bard story prompt"
    description: >-
      On any per-node story-prompt input_text changing, publish retained smol/<id>/config/tale
      (raw). Empty payload = retain-clear -> the node falls back to its built-in persona prompt.
      The node validates the value against the model vocabulary; a refusal is logged there and
      leaves the previous prompt in place.
    # QUEUED, not parallel. `parallel` was right while this was per-id: three helpers, three
    # independent nodes, no shared state. It is now ONE composed payload fanned to every node, so
    # two quick changes race — run A computes its value, run B computes a newer one, and `parallel`
    # guarantees no ordering. If A's publishes land after B's, the retained topics keep A's OLDER
    # value. Nothing heals that: both automations here are state-triggered only, and NOTHING
    # republishes `config/delivery` or `config/tale` on a timer (verified: the only `time_pattern`
    # automations live in smol_mesh.yaml and touch neither topic). So a lost race is permanent
    # until somebody happens to touch a control again — the live-vs-desired drift `config_drift`
    # exists to catch, in a file with no heartbeat to expose it. The window is ~6x wider than it
    # was, because one change is now six sequential publishes.
    #
    # `queued` serialises, so the last run reads the latest state and lands last. `restart` would
    # also work HERE (B republishes to every node, so aborting A mid-loop loses nothing) but it is
    # not uniform: the tale automation publishes `trigger.to_state.state` rather than re-reading,
    # so the two would need different reasoning. `queued` needs none.
    mode: queued
    max: 10
    trigger:
      - platform: state
        entity_id:
          - input_text.smol_all_tale
    condition:
      - condition: template
        # Blocks the entity APPEARING (from_state None) and an availability blip, but NOT
        # `unknown` -> value. With `initial:` removed these helpers start `unknown` and stay
        # there until an operator chooses, so `unknown` is exactly the from_state of JP's FIRST
        # selection. Excluding it would have made the very first change a silent no-op — a worse
        # bug than the revert that removing `initial:` fixes, and the same "control does nothing"
        # class as the 5x8 omission.
        value_template: "{{ trigger.from_state is not none and trigger.from_state.state != 'unavailable' }}"
    action:
      - variables:
          fleet: >-
            {%- set ns = namespace(ids=[]) -%}
            {%- for e in states.sensor | map(attribute='entity_id') | select('search','^sensor\\.smol_\\d+(_[a-z0-9]+)*_status$') -%}
              {%- set id = e.split('.')[1].split('_')[1] -%}
              {%- if id not in ns.ids -%}{%- set ns.ids = ns.ids + [id] -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.ids }}
      - choose:
          # An empty fleet reaching zero nodes and reporting SUCCESS is the exact disease this
          # whole campaign is about. `fleet` comes from MQTT-discovery entities, and after an HA
          # restart there is a window before the retained discovery configs replay — a control
          # changed in that window silently reaches nobody. Say so, loudly, because the operator
          # needs to know their change did not apply and should be re-made.
          - conditions: "{{ fleet | count == 0 }}"
            sequence:
              - service: persistent_notification.create
                data:
                  notification_id: smol_bard_fanout_empty_tale
                  title: "smol: the Bard story prompt reached NO nodes"
                  message: >-
                    The Bard story prompt changed, but no smol node was discovered at that moment, so
                    nothing was published. This is usually the window just after an HA restart,
                    before the retained MQTT discovery configs replay. Re-apply the control once
                    the fleet is back and this notice will clear itself.
        default:
          # Clears the warning above once a fan-out reaches somebody, so a stale notice cannot
          # outlive the condition it described.
          - service: persistent_notification.dismiss
            data:
              notification_id: smol_bard_fanout_empty_tale
          - repeat:
              for_each: "{{ fleet }}"
              sequence:
                - service: mqtt.publish
                  data:
                    topic: "smol/{{ repeat.item }}/config/tale"
                    retain: true
                    qos: 1
                    payload: "{{ trigger.to_state.state }}"

mqtt:
  sensor:
    # #302 delivery readback: what the node was actually told, as `<ms>:<mode>`.
    - name: "smol 8 delivery"
      unique_id: smol_8_delivery_mirror
      state_topic: "smol/8/config/delivery"
      icon: "mdi:play-speed"
      value_template: "{{ value if value else '(default)' }}"
    # #303 Bard story-prompt mirror: read back the retained prompt so the card shows what was
    # commanded. '(default)' when empty = the node is using its built-in persona.
    - name: "smol 8 tale"
      unique_id: smol_8_tale_mirror
      state_topic: "smol/8/config/tale"
      icon: "mdi:feather"
      value_template: "{{ value if value else '(default)' }}"
