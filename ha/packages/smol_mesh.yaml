# smol mesh ↔ Home Assistant — MQTT-native downlink (team spec v2, 2026-07-08)
# ---------------------------------------------------------------------------
# This package is the HA end of the smol battery-display bridge. It publishes a
# RETAINED, display-ready payload to the MQTT topic `smol/display/batt` every
# time a source battery sensor changes, on a 5-minute heartbeat, and when HA
# starts. Because the message is retained, the broker itself is the cache: a smol
# gateway connects for only ~2 s during its WiFi burst, SUBSCRIBEs, and the
# broker delivers the last value immediately — no HA-side request/response. The
# gateway then rebroadcasts it over ESP-NOW (a SMOLv1 BATT frame) so every leaf
# node caches it too.
#
# Payload format (LOCKED — the exact lines the firmware renders on the 72×40 OLED):
#   BATT|48V 52.8V|HV 391.9V|d 43mV|48V 69%|HV 99%|Chg 4.1A
#   - pipe-separated, ≤6 segments, each ≤12 chars, whole payload ≤96 bytes, ASCII
#     (verified worst case ≈62 B). Segments 1-3 = the VOLTAGE overview page (title
#     `Batt`); segments 4-6 = the SOC/charge DETAIL segments (issue #17). A short tap
#     on the board pages through them; boards flashed before #17 `split('|').take(3)`
#     so they ignore 4-6 and keep showing the voltage page — FULLY backward-compatible.
#   ⚠️ BIG-RENDER CONTRACT (co-designed with the firmware, 2026-07-08): the firmware
#     renders each DETAIL segment (4-6) as its own full-window page = a small LABEL
#     (text before the FIRST space) + a BIG value (everything after). So each detail
#     segment MUST be `<shortlabel> <value>` with NO interior space before the value
#     (`48V 69%` -> label "48V", value "69%"). Keep labels single-token.
#   VOLTAGE overview page (segments 1-3, unchanged):
#   - seg 1: 48V bank    %.1f V   sensor.48v_battery1_voltage  (BMS-direct; see below)
#            fallback           → sensor.48v_battery2_voltage, else `--`
#   - seg 2: BMW i3 HV pack %.1f V   sensor.be_battery_voltage
#   - seg 3: i3 cell spread %.0f mV  sensor.be_cell_voltage_delta
#   DETAIL segments (4-6, issue #17 — each a big full-window page on the board):
#   - seg 4 `48V`: 48V bank SOC  %.0f %  sensor.48v_battery1_battery  (BMS, coulomb-
#            counted — the same source we trust for the voltage line), fallback
#            sensor.48v_battery2_battery. (Team ruling 2026-07-08: moved OFF EPEver —
#            EPEver's SOC is a crude voltage estimate and its bus flaps `unavailable`;
#            the BMS is authoritative and keeps the SOC page off the flaky EPEver path.)
#   - seg 5 `HV`: HV pack SOC   %.0f %  sensor.be_soc, fallback sensor.battery_state_of_charge
#   - seg 6 `Chg`: charge current %.1f A sensor.epever_charging_current (TOTAL solar
#            charge into the 48V bank), else `--`. (Kept on EPEver, not a BMS current:
#            the per-battery BMS currents are half-the-bank each and can't be summed in
#            the macro; EPEver gives the true total bank charge current.)
#   - any source that is unavailable / unknown / STALE renders `--` for that segment
#     (e.g. `BATT|48V --|HV 391.9V|d 43mV|48V 69%|HV 99%|Chg --`). See STALENESS below
#     — the HV SOC (seg 5) window is wider than the others on purpose.
#
# OVERRIDE MODE: when input_boolean.smol_display_override is ON, the automation
# publishes `BATT|<line1>|<line2>|<line3>|A ..|B ..|C ..` — the three line SOURCES
# (input_text.smol_display_line1/2/3) own segments 1-3 instead of the battery
# voltages, but the SOC trio (segments 4-6) is STILL appended (issue #17 spec), so
# a board can short-tap to the live SOC page even mid-override. SAME topic +
# envelope, so the boards need ZERO changes.
#   - A source is literal text with `{entity_id}` placeholders, e.g.
#     `48V {sensor.48v_battery1_voltage}V` -> `48V 52.8V`, `PV {sensor.epever_pv_power}W`.
#   - Placeholders are resolved by SAFE regex substitution (regex_findall on
#     `\{([a-z0-9_.]+)\}`, each `{id}` -> `states('<id>')`). We do NOT eval
#     user-typed Jinja (HA's sandbox forbids it and it would be an injection risk).
#     A placeholder whose entity is unknown/unavailable renders `--`.
#   - AFTER substitution each line is SANITIZED: `|` chars stripped (they'd corrupt
#     the pipe framing) and the line clipped to 12 chars (payload stays ≤96 B).
#     Blank lines render empty (fine on-glass). Toggle OFF -> live battery reading.
#   - REFRESH: placeholder values re-render on the 5-min time_pattern (referenced
#     entities are NOT dynamic triggers), plus on any override-helper edit and HA
#     start. So a value inside a placeholder can be up to ~5 min stale.
#
# DASHBOARD: `mqtt.sensor.smol_display_batt` mirrors the retained topic so a
# Lovelace card shows exactly what the boards will fetch. Ready-made card:
# ha/dashboard/smol_display_card.yaml (install via the WS lovelace/config/save
# API at deploy time — NOT by editing .storage; see ha/README.md).
#
# WHY NOT sensor.epever_battery_voltage for the 48V line? JP's HA history
# (2026-07-08) shows that entity is chronically corrupted — it bounces 0↔55 V with
# >100 V spikes all day (suspected Modbus/PE11 bus contention; under separate
# investigation). The BMS-direct `sensor.48v_battery1_voltage` (~52.8, stable) is
# the truth source; `sensor.48v_battery2_voltage` is the fallback. The epever
# entity is deliberately AVOIDED here.
#
# STALENESS: the automation also fires every 5 min (time_pattern) and the template
# renders `--` for any source whose `last_reported` is older than its per-segment
# window, so a wedged integration cannot freeze a stale-but-live-looking value into
# the retained payload. `last_reported` (not `last_updated`) is used deliberately:
# it advances on EVERY state write, so a live integration that keeps re-reporting an
# unchanged value stays "fresh", while a truly wedged one goes stale. (Confirmed
# live 2026-07-08: sensor.48v_battery1_battery re-reports every ~25 s at a steady
# 69% — last_reported 25 s, last_updated 46 min — so `last_reported` correctly
# treats it as fresh.)
#   - VOLTAGE segments + 48V BMS SOC + EPEver charge current: 30 min (1800 s), the
#     `cell()` default. The 30-min window (team ruling 2026-07-08) covers the measured
#     worst case: the BE HV/delta sensors publish on-change and a steady pack
#     legitimately goes quiet up to ~22.6 min, so a tighter window would blank HEALTHY
#     data and train the reader to ignore `--`. Keeping the EPEver charge current (s3)
#     at 30 min ALSO makes it a health signal for the PE11 bus — it blanks fast if the
#     bus wedges again.
#   - HV pack SOC (segment 5, sensor.be_soc): 6 h (21600 s). SOC at rest changes
#     glacially, so this on-change MQTT source legitimately goes silent for tens of
#     minutes to hours (measured 50 min silent at a steady 99% on 2026-07-08). A
#     30-min window would blank a perfectly valid SOC almost the whole time the pack
#     is at rest, gutting the SOC page. 6 h shows the real value yet still catches a
#     truly dead Battery-Emulator. Each window is a per-call `maxage` arg on `cell()`.
# KNOWN LIMITATION (see ha/README.md): if HA ITSELF dies, the retained payload
# persists on the broker and the boards cannot tell it is stale (they show it with
# their own fetch-age only). A payload-embedded timestamp is a filed follow-up.
#
# Deploy: copy to /homeassistant/packages/smol_mesh.yaml and restart HA. See
# ha/README.md. This file only PUBLISHES; the uplink entities (sensor.smol_<id>_*)
# are created automatically by the firmware's retained MQTT-discovery configs.

# --- Manual display-override helpers ---------------------------------------
# Three free-text lines + a master toggle. When the toggle is ON the automation
# publishes these (sanitized) instead of the battery reading.
input_text:
  # Line SOURCES (not the final text): literal chars + {entity_id} placeholders,
  # e.g. "48V {sensor.48v_battery1_voltage}V" or "PV {sensor.epever_pv_power}W".
  # max 100 to fit source + placeholders; the RENDERED line is clipped to 12.
  smol_display_line1:
    name: "smol display line 1 (source)"
    max: 100
    initial: ""
  smol_display_line2:
    name: "smol display line 2 (source)"
    max: 100
    initial: ""
  smol_display_line3:
    name: "smol display line 3 (source)"
    max: 100
    initial: ""
  # --- #45 Custom screen (per-node author string) — Model A: one helper/node.
  # Grammar: "<size><align> <text>" per line, '|'-separated lines (≤4). size s/m/l
  # (5x8/6x10/10x20), align l/c/r. {entity_id} refs are resolved HA-side (subst());
  # the compose template sensor converts to the wire form <count>|<sa>text;… and
  # publishes retained smol/<id>/config/custom (KV key Y, #56). e.g.
  #   lc {sensor.smol_8_temp}°F|sl Bench|sl Door {binary_sensor.shed_door}
  smol_8_custom:
    name: "Nexus Custom screen (author)"
    max: 120
    initial: ""
  # --- #100 Stage 2/3 per-node network overrides (dashboard-managed, un-brickable). BROKER =
  # MQTT leg "ip" or "ip:port" (RFC1918; empty = the slot's baked broker). OTA HOST = one extra
  # RFC1918 image host appended to the fetch allowlist (empty = slot default). The board
  # RFC1918-validates before applying and self-heals a wrong broker via the CONNACK fallback
  # (surfaced as brk=fb in smol/<id>/diag); a wrong OTA host can only refuse a fetch (never a brick).
  smol_8_broker:
    name: "Nexus broker override (ip[:port])"
    max: 21
    initial: ""
  smol_8_ota_host:
    name: "Nexus OTA host override (ip)"
    max: 15
    initial: ""
  # --- #72 IO registry (per-node, #194/#31). IO map = pin→kind config → retained smol/<id>/config/io
  # (";"-sep "<pin><kind>"); IO set = pin state command → retained smol/<id>/io/set (";"-sep "<pin>=<0|1>").
  # Labels/wire per the meshscope operator-mode parity checklist. Empty = no-op / clear.
  smol_8_io_map:
    name: "Nexus · IO map"
    max: 80
    initial: ""
  smol_8_io_set:
    name: "Nexus · IO set"
    max: 80
    initial: ""
  # --- channel_hint (FLEET, #194/#31): steer the elected mesh channel → retained smol/mesh/channel_hint
  # (decimal channel; empty = CLEAR). ONE fleet value (crown consumes), not per-node.
  smol_channel_hint:
    name: "smol · channel hint"
    max: 3
    initial: ""

input_boolean:
  smol_display_override:
    name: "smol display override"
    icon: "mdi:pencil"
  # --- #55 plugin visibility (per-node) — one input_boolean per maskable AppKind. The compose
  # automation ORs the set bits (stable bit0..6) → retained smol/<id>/config/plugins = 4-hex u16.
  # Default ALL ON (=007F); fw: 0000/bad/empty → keep-all (safety), masked live screen → board default.
  smol_8_plugin_clock:
    name: "Nexus · Clock visible"
    icon: "mdi:clock-outline"
    initial: true
  smol_8_plugin_snake:
    name: "Nexus · Snake visible"
    icon: "mdi:snake"
    initial: true
  smol_8_plugin_bench:
    name: "Nexus · Bench visible"
    icon: "mdi:test-tube"
    initial: true
  smol_8_plugin_batt:
    name: "Nexus · Batt visible"
    icon: "mdi:battery"
    initial: true
  smol_8_plugin_grid:
    name: "Nexus · Grid visible"
    icon: "mdi:transmission-tower"
    initial: true
  smol_8_plugin_wled:
    name: "Nexus · Wled visible"
    icon: "mdi:led-strip-variant"
    initial: true
  smol_8_plugin_about:
    name: "Nexus · About visible"
    icon: "mdi:information-outline"
    initial: true
  smol_8_plugin_familiar:
    name: "Nexus · Familiar visible"
    icon: "mdi:paw"
    initial: true

# =====================================================================
# KEYED CFG RELAY (issue #56) — the ONE wire that carries ALL per-node config
# to the credential-less, ESP-NOW-only leaves.
# ---------------------------------------------------------------------
# A gateway subscribes each retained config topic below and re-broadcasts it to
# its leaves as a SINGLE keyed ESP-NOW frame — `SMOLv1 CFG <NNN><KEY><value>` —
# on the ~10 s cadence (NNN = 3-digit target leaf id; KEY = 1 ASCII channel byte;
# value = the verbatim retained payload). The leaf DISPATCHES on KEY and ignores
# any key its firmware predates (forward-compat). Topic → KEY contract:
#     smol/<id>/config/default_screen  → S   (screen, issue #21)   ← the ONLY key #56 ships
#     smol/<id>/config/led             → L   (blue-LED mode, #48)
#     smol/config/units                → U   (display units, GLOBAL/#43)
#     smol/<id>/config/plugins         → P   (plugin-enable mask, #55; topic TBD)
#     smol/<id>/config/net             → N   (WiFi slot 0/1, #100 Stage 1; edge-triggered reboot)
#     smol/<id>/config/broker          → B   (MQTT broker ip[:port], #100 Stage 2; reboot + fallback)
#     smol/<id>/config/ota_host        → O   (extra OTA host ip, #100 Stage 3; no reboot)
# #56 is FOUNDATION ONLY: the firmware relays the S channel (default_screen) exactly
# as before — this file's default_screen PUBLISH half is UNCHANGED, and a leaf keeps
# converging on its dashboard-set screen. The L/U/(P) topics + GUI below already exist
# HA-side; their gateway relay + leaf apply land with #48/#43/#55 (each adds one fill
# site + one dispatch arm on top of this keyed channel — no new wire frame). HA never
# emits a KEY: it publishes to the topic, the gateway maps topic → KEY on relay.
# =====================================================================
# NODE MANAGER (issue #21) — remotely set each node's DEFAULT SCREEN + page
# via retained  smol/<id>/config/default_screen = <AppKind>:<page>.
# Protocol LOCKED per nodemgr-design.md §2. This is the HA PUBLISH/GUI half;
# the firmware CONSUME side (subscribe + panic-free parse) is a later wave.
#   - AppKind tokens = EXACT app.rs spellings (case-sensitive), full espnow set.
#     Firmware ignores/clamps any token it can't build in its tier (never crashes).
#   - page: flat "0"/"1" (only Batt has 2 pages today; firmware clamps invalid -> 0).
#   - "Apply"  -> publishes the retained value (broker = persistence).
#   - "Reset"  -> publishes an EMPTY retained payload = clear -> node falls back to
#                 its board.rs DEFAULT_APP/DEFAULT_PAGE (design §2.5, R-P1 lifecycle).
#   - "Set all" -> fans out to EVERY per-node topic (NO broadcast topic — ruling #3).
#   - Closed-set input_select => HA can never emit a malformed payload (security §7);
#     the firmware still parses panic-free because the broker is LAN-writable.
# NOTE (honest, per design): credential-less leaves never open MQTT, so they use
# their board.rs default until given creds (reach = JP decision F2). The OTA panel,
# mesh-topology view, and LIVE current-screen preview are DEFERRED (JP-decisions
# F5/F6/F7 + firmware smol/<id>/status F4); v1 reflects COMMANDED config only.
# =====================================================================
input_select:
  # --- #43 display units (GLOBAL: one setting, whole fleet) → retained smol/config/units ---
  smol_temp_unit:
    name: "smol · temperature unit"
    options: ["°F", "°C"]
    initial: "°F"          # default °F = current firmware behavior
    icon: mdi:thermometer
  smol_clock_format:
    name: "smol · clock format"
    options: ["24h", "12h"]
    initial: "24h"         # default 24h = current firmware behavior
    icon: mdi:clock-outline
  # --- set-all (writes every per-node topic) ---
  smol_all_screen:
    name: "smol all · default screen"
    options: [Menu, Clock, Batt, Grid, Snake, Bench, MeshSnake, About, Custom, Familiar]
    initial: Menu
    icon: mdi:monitor-multiple
  smol_all_page:
    name: "smol all · default page"
    options: ["0", "1", "2", "3"]   # 0=voltage/entry; 1-3 = Batt SOC detail pages (#17); fw wraps % page_count for screens with fewer
    initial: "0"
    icon: mdi:book-open-page-variant
  # --- id8. ONE COPY-PASTE BLOCK PER NODE is the shape of this file and also its bug
  # (#309): the file cannot know an id exists, so a re-provisioned fleet gets silence, not an
  # error. Do not duplicate-and-renumber for id50/id51 — that re-arms it. ---
  smol_8_screen:
    name: "Nexus · default screen"
    options: [Menu, Clock, Batt, Grid, Snake, Bench, MeshSnake, About, Custom, Familiar]
    initial: Menu
    icon: mdi:monitor
  smol_8_page:
    name: "Nexus · default page"
    options: ["0", "1", "2", "3"]   # 0=voltage/entry; 1-3 = Batt SOC detail pages (#17); fw wraps % page_count for screens with fewer
    initial: "0"
    icon: mdi:book-open-page-variant
  # --- #48 blue-LED mode (per-node: status/on/off, default status) → retained smol/<id>/config/led ---
  # status = LED tracks node state (fw default) · on = force on · off = force off.
  smol_all_led:
    name: "smol all · LED mode"
    options: [status, "on", "off"]
    initial: status
    icon: mdi:led-on
  smol_8_led:
    name: "Nexus · LED mode"
    options: [status, "on", "off"]
    initial: status
    icon: mdi:led-on
  # --- #142: config/net (WiFi-slot switch) RETIRED. The per-node `smol_<id>_network` selects +
  # their publish automations were removed 2026-07-19 (#194/#31) — net is not a live control.
  # The board's actual slot is still surfaced read-only from `net=` in smol/<id>/diag (mirror sensors).

input_button:
  smol_all_apply:
    name: "smol all · apply"
    icon: mdi:send-check
  smol_8_apply:
    name: "Nexus · apply"
    icon: mdi:send
  smol_8_reset:
    name: "Nexus · reset to board default"
    icon: mdi:backup-restore
  smol_ota_install_8:
    name: "smol OTA · install staged → Nexus"
    icon: mdi:download
  # --- #52 remote REBOOT (TRANSIENT cmd) — named *_reboot to avoid colliding with the #21
  # "*_reset to board default" config buttons above. Topic = smol/<id>/cmd/reset (locked). ---
  smol_all_reboot:
    name: "smol all · reboot"
    icon: mdi:restart-alert
  smol_8_reboot:
    name: "Nexus · reboot"
    icon: mdi:restart
  # --- #71 on-demand WiFi SCAN (per-node + all, #194/#31) → TRANSIENT smol/<id>/cmd/scan (retain:FALSE).
  # Same transient discipline as reboot (cmd/ topic, never retained). Topic-triggered (payload ignored).
  smol_all_scan:
    name: "smol all · scan"
    icon: mdi:wifi-refresh
  smol_8_scan:
    name: "Nexus · scan"
    icon: mdi:wifi-refresh
  # --- channel_hint apply/clear buttons (fleet, #194/#31) ---
  smol_channel_hint_apply:
    name: "smol · apply channel hint"
    icon: mdi:access-point-check
  smol_channel_hint_clear:
    name: "smol · clear channel hint"
    icon: mdi:access-point-remove

# --- Dashboard mirror: subscribe the retained topic so a card shows exactly ---
# what the boards fetch (the payload is <=96 chars, well under the 255 state cap).
mqtt:
  # --- #74 item 5 (stage-2) DISPLAY MIRROR — the gateway's live OLED as an image ---
  # The gateway publishes its glass as a base64 64×32 1-bit BMP to retained smol/<id>/screen
  # (fw reuses the #26 Cast framebuffer tee — no new draw-path tap; GATEWAY-only v1, a leaf's
  # screen needs a mesh-frame follow-on). HA decodes b64 → BMP and serves it as an image the
  # dashboard renders (the node-box "mini-OLED" idiom made real). Downsampled to 64×32 so the
  # 1-bit BMP (~424 B base64) fits the gateway's 512 B MQTT packet. Only the elected gateway
  # publishes a live image; the other ids stay 'unknown' until they take the gateway role.
  # NOTE: supersedes luna's staged TEXT `smol/<id>/display` (DISP|line;…) mirror — that HELD
  # approach needed an invasive per-plugin text tap; this bitmap path is non-invasive + faithful.
  image:
    - name: "smol 8 screen"
      unique_id: smol_8_screen_mirror
      image_topic: "smol/8/screen"
      image_encoding: b64
      content_type: image/bmp
      entity_category: diagnostic
      icon: "mdi:monitor-screenshot"
  sensor:
    - name: "smol display batt"
      unique_id: smol_display_batt_mirror
      state_topic: "smol/display/batt"
      icon: "mdi:monitor-dashboard"
    - name: "smol display grid"
      unique_id: smol_display_grid_mirror
      state_topic: "smol/display/grid"
      icon: "mdi:transmission-tower"
    # --- node-manager: COMMANDED config mirrors (issue #21) ---
    # Reflect the commanded config (the retained value HA published) so the card
    # shows what was set. LIVE actual screen + running build needs the firmware
    # smol/<id>/status publish (design F4) — deferred; v1 = commanded config only.
    - name: "smol 8 config"
      unique_id: smol_8_config_mirror
      state_topic: "smol/8/config/default_screen"
      icon: "mdi:cog"
    # --- #45 Custom-screen mirror: read back the retained wire payload the compose
    # template sensor published (round-trip confirmation + dashboard preview). State =
    # the FIRST line's resolved text (2-char size/align prefix stripped); '(none)' when empty. ---
    - name: "smol 8 custom"
      unique_id: smol_8_custom_mirror
      state_topic: "smol/8/config/custom"
      icon: "mdi:card-text-outline"
      value_template: >-
        {% set p = value.split('|', 1) %}{% if p | length > 1 and p[1] %}{{ p[1].split(';')[0][2:] }}{% else %}(none){% endif %}
    # --- #55 plugin-mask mirror (read back the retained hex the compose published) ---
    - name: "smol 8 plugins"
      unique_id: smol_8_plugins_mirror
      state_topic: "smol/8/config/plugins"
      icon: "mdi:puzzle-outline"
    # --- #43 display units (GLOBAL) — mirror of the retained smol/config/units ---
    - name: "smol units"
      unique_id: smol_units_mirror
      state_topic: "smol/config/units"
      value_template: >-
        {% set p = value.split('|') %}
        {% set t = p[0] if (p | length >= 1 and p[0] in ['F', 'C']) else 'F' %}
        {% set c = p[1] if (p | length >= 2 and p[1] in ['12', '24']) else '24' %}
        {{ ('°F' if t == 'F' else '°C') ~ ' · ' ~ c ~ 'h' }}
      json_attributes_topic: "smol/config/units"
      json_attributes_template: >-
        {% set p = value.split('|') %}
        {{ {'temp': (p[0] if (p | length >= 1 and p[0] in ['F', 'C']) else 'F'),
            'clock': (p[1] if (p | length >= 2 and p[1] in ['12', '24']) else '24')} | tojson }}
      icon: "mdi:tune-variant"
    # --- OTA panel (issue #6) ---
    # The STAGED target — set by tools/ota_publish.sh. Unsigned: OTA|build|size|sha256|url;
    # signed (#32): OTA|build|size|sha256|sig|url. The url is ALWAYS the LAST field (its index
    # shifts with the sig), so extract it with `last`; `sig` exists only in the 6-field signed form.
    # State = the build number; the full fields are attributes (read-only operator
    # visibility; the board fetches the staged image on native Update Install).
    - name: "smol ota staged"
      unique_id: smol_ota_staged_mirror
      state_topic: "smol/ota/staged"
      value_template: "{{ value.split('|')[1] if value.startswith('OTA|') else 'none' }}"
      json_attributes_topic: "smol/ota/staged"
      json_attributes_template: >-
        {% set p = value.split('|') %}
        {{ ({'build': p[1], 'size': p[2], 'sha256': p[3], 'url': (p | last), 'sig': (p[4] if p | length >= 6 else '')} if (p | length >= 5 and p[0] == 'OTA') else {}) | tojson }}
      icon: "mdi:package-up"
    # Per-node LIVE status — smol/<id>/status = STAT|<screen>:<page>|<build> (design F4).
    # SHIPPED in #50 and live: id8 reports `Bard:0` / build 345 today. (This comment said
    # "NEEDS firmware … unknown until the firmware wave ships it" long after that wave
    # landed — the retirement/arrival blind spot in docs/DOC-UPKEEP.md, corrected 2026-07-27.)
    # Feeds the OTA no-downgrade gate (running build) AND the node-manager live
    # current-screen reflection.
    - name: "smol 8 screen"
      unique_id: smol_8_status_mirror
      state_topic: "smol/8/status"
      value_template: "{{ value.split('|')[1] if '|' in value else value }}"
      json_attributes_topic: "smol/8/status"
      json_attributes_template: "{% set p = value.split('|') %}{{ ({'build': p[2]} if p | length >= 3 else {}) | tojson }}"
      expire_after: 90   # #68/#94: online source. Flap-tune (90→180) was CONSIDERED then DROPPED — the all-192 flap was a mesh-SETTLING artifact (cadence briefly ~90s); at healthy steady-state status republishes ~11s, far under 90, so online is stable. F6-gated republish, ages out
      # when the gateway stops refreshing a dead leaf. Drives binary_sensor.smol_<id>_online.
      icon: "mdi:chip"
    # --- #73 id5/Aegis (HEADLESS) base plumbing — Aegis publishes STAT|<screen>:<page>|<build> like id8
    # (verified on wire: smol/5/status = "STAT|Custom:0|342"); it was just never mirrored, so the #69
    # telemetry generator couldn't discover it. Same pattern → makes Aegis carry online/build + OTA tiles. ---
    - name: "smol 5 screen"
      unique_id: smol_5_status_mirror
      state_topic: "smol/5/status"
      value_template: "{{ value.split('|')[1] if '|' in value else value }}"
      json_attributes_topic: "smol/5/status"
      json_attributes_template: "{% set p = value.split('|') %}{{ ({'build': p[2]} if p | length >= 3 else {}) | tojson }}"
      expire_after: 90   # online source (drives binary_sensor.smol_5_online), same as id8
      icon: "mdi:chip"
    # --- #40 running BUILD# as a first-class device-merged value (JP ask 2026-07-11) ---
    # Promotes the `build` attr of smol_<id>_screen to a plain visible sensor so the
    # leaf-mesh-OTA canary is verifiable HEADLESS in HA (build# flipping = update stuck;
    # the ESP32-C3 USB-JTAG boards give no reliable headless serial). Same
    # STAT|<screen>:<page>|<build> source; length-guarded split (panic-free).
    - name: "smol 8 build"
      unique_id: smol_8_build_mirror
      state_topic: "smol/8/status"
      value_template: "{% set p = value.split('|') %}{{ p[2] if p | length >= 3 else 'unknown' }}"
      entity_category: diagnostic
      icon: "mdi:tag-text"
    - name: "smol 5 build"
      unique_id: smol_5_build_mirror
      state_topic: "smol/5/status"
      value_template: "{% set p = value.split('|') %}{{ p[2] if p | length >= 3 else 'unknown' }}"
      entity_category: diagnostic
      icon: "mdi:tag-text"
    # --- #40 leaf-mesh-OTA relay PHASE (headless diag) — gateway publishes on its next burst
    # after relaying to this leaf: confirmed / rolled-back / fetch-failed / relay-failed /
    # leaf-timeout / mac-unknown. The mesh-only leaf has no serial, so this retained topic is
    # the ONLY window into a relay attempt's outcome. `none` until a relay is attempted.
    - name: "smol 8 ota diag"
      unique_id: smol_8_ota_diag_mirror
      state_topic: "smol/8/ota/diag"
      value_template: "{{ value if value else 'none' }}"
      entity_category: diagnostic
      icon: "mdi:cloud-upload-outline"
    # --- #40 leaf-mesh-OTA ARM-CHAIN trace (headless) — the GATEWAY dumps this every flush:
    # "install-caught=<id|none> pending=<id|none> staged_raw=<build|none> leaf_ota=<0|1>".
    # Pinpoints which arm link is null in one reflash (the C3 has no serial). Published by
    # whichever node is currently the gateway; the others read `none`.
    - name: "smol 8 ota armdiag"
      unique_id: smol_8_ota_armdiag_mirror
      state_topic: "smol/8/ota/armdiag"
      value_template: "{{ value if value else 'none' }}"
      entity_category: diagnostic
      icon: "mdi:link-variant"
    # --- #40 leaf-mesh-OTA RELAY PROGRESS (Luna · JP ask 2026-07-11) — the gateway publishes
    # smol/<id>/ota/relaydiag on each burst while relaying the image to this leaf:
    #   "rx=N otan=M last_wb=W/T otam_tx=A/B settle=S leaf=HxVyNzch<c>"
    # last_wb=W/T is the LITERAL image-transfer progress (e.g. 4288/4343 = 98.7%). STATE = that
    # percentage (numeric %, drives the dashboard progress bar); the raw fields ride as attributes
    # so a stalling/tailing relay is diagnosable HEADLESS (the mesh-only leaf has no serial).
    # Retained + STICKY: last_wb persists at 100% after a completed transfer — the dashboard gates
    # visibility on build#-behind-staged / non-clean phase, NOT on this number alone. Length- and
    # divide-guarded (panic-free): 'unknown' until a relay publishes a parseable last_wb.
    - name: "smol 8 ota relaydiag"
      unique_id: smol_8_ota_relaydiag_mirror
      state_topic: "smol/8/ota/relaydiag"
      unit_of_measurement: "%"
      entity_category: diagnostic
      icon: "mdi:progress-upload"
      value_template: >-
        {% set ns = namespace(w=0, t=0, ok=false) %}
        {% for tok in value.split() %}
          {% if tok.startswith('last_wb=') and '/' in tok %}
            {% set f = tok.split('=', 1)[1].split('/') %}
            {% set ns.w = f[0] | int(0) %}{% set ns.t = f[1] | int(0) %}{% set ns.ok = true %}
          {% endif %}
        {% endfor %}
        {% if ns.ok and ns.t > 0 %}{{ (100.0 * ns.w / ns.t) | round(1) }}{% else %}unknown{% endif %}
      json_attributes_topic: "smol/8/ota/relaydiag"
      json_attributes_template: >-
        {% set ns = namespace(rx='', otan='', wb='', otam='', settle='', leaf='') %}
        {% for t in value.split() %}
          {% if t.startswith('rx=') %}{% set ns.rx = t[3:] %}
          {% elif t.startswith('otan=') %}{% set ns.otan = t[5:] %}
          {% elif t.startswith('last_wb=') %}{% set ns.wb = t[8:] %}
          {% elif t.startswith('otam_tx=') %}{% set ns.otam = t[8:] %}
          {% elif t.startswith('settle=') %}{% set ns.settle = t[7:] %}
          {% elif t.startswith('leaf=') %}{% set ns.leaf = t[5:] %}
          {% endif %}
        {% endfor %}
        {% set wp = ns.wb.split('/') %}
        {{ {'rx': ns.rx, 'otan': ns.otan, 'last_wb': ns.wb,
            'wb_done': (wp[0] | int(0)) if wp | length == 2 else 0,
            'wb_total': (wp[1] | int(0)) if wp | length == 2 else 0,
            'otam_tx': ns.otam, 'settle': ns.settle, 'leaf': ns.leaf, 'raw': value} | tojson }}
    # --- #48 LED mode — mirror of the retained smol/<id>/config/led (commanded value) ---
    - name: "smol 8 LED"
      unique_id: smol_8_led_mirror
      state_topic: "smol/8/config/led"
      icon: "mdi:led-on"
    # --- MESH TOPOLOGY (issue #27) — HELD; needs the firmware peers/channel publish ---
    # NOT YET PUBLISHED BY FIRMWARE. These + the template block below back the topology
    # card (ha/dashboard/smol_topology_card.yaml). Contract (#27, fw morpheus-fw Task 3):
    #   smol/mesh/channel = MC|owner|channel|seq         (the elected gateway + mesh ch)
    #   smol/<id>/peers   = PEERS|role|ch|<peer>;<peer>;…   (peers ';'-separated; each = id,rssi,age,ch,flags)
    # Parsing mirrors the batt/grid/config discipline (guarded split, panic-free). Until
    # firmware publishes these, every entity below reads unknown/unavailable (harmless).
    - name: "smol mesh channel"
      unique_id: smol_mesh_channel_mirror
      state_topic: "smol/mesh/channel"
      value_template: "{% set p = value.split('|') %}{{ p[2] if p | length >= 4 else 'unknown' }}"
      json_attributes_topic: "smol/mesh/channel"
      json_attributes_template: "{% set p = value.split('|') %}{{ ({'owner': p[1], 'channel': p[2], 'seq': p[3]} if p | length >= 4 else {}) | tojson }}"
      expire_after: 90
      icon: "mdi:lan"
    - name: "smol 8 peers"
      unique_id: smol_8_peers_mirror
      state_topic: "smol/8/peers"
      value_template: "{% set p = value.split('|') %}{{ 'gateway' if (p | length > 1 and p[1] == 'G') else 'leaf' }}"
      json_attributes_topic: "smol/8/peers"
      json_attributes_template: "{% set p = value.split('|') %}{{ ({'ch': p[2], 'peers': (p[3].split(';') if p | length >= 4 and p[3] else [])} if p | length >= 3 else {'peers': []}) | tojson }}"
      expire_after: 90
      icon: "mdi:lan-connect"

    # --- COEXIST: per-board WiFi-uplink AP channel (crown-channel-health, the OTA-liveness signal).
    # Only the elected crown associates to an uplink AP, so `ap=<ch>:<rssi>:<bssid>` appears ONLY in
    # the crown's smol/<id>/diag (leaves omit it). State = AP channel (int) or 'none' when absent;
    # rssi (signed dBm) + bssid ride as attributes. The template sensor `smol coexist health` below
    # coalesces these (whichever board reports a real channel IS the crown) and compares to the
    # elected mesh channel — a mismatch = the ch1-AP-vs-ch6-mesh coexist trap that silently kills OTA.
    - name: "smol 8 ap channel"
      unique_id: smol_8_ap_channel_mirror
      state_topic: "smol/8/diag"
      entity_category: diagnostic
      icon: "mdi:access-point-network"
      value_template: >-
        {% set ns = namespace(v='') %}{% for kv in value.split('|') %}{% if kv.startswith('ap=') %}{% set ns.v = kv.split('=',1)[1] %}{% endif %}{% endfor %}{% set p = ns.v.split(':') %}{{ p[0] if (ns.v and p[0]) else 'none' }}
      json_attributes_topic: "smol/8/diag"
      json_attributes_template: >-
        {% set ns = namespace(v='') %}{% for kv in value.split('|') %}{% if kv.startswith('ap=') %}{% set ns.v = kv.split('=',1)[1] %}{% endif %}{% endfor %}{% set p = ns.v.split(':') %}{{ {'rssi': (p[1] | int(0)) if p | length >= 2 else 0, 'bssid': (p[2] if p | length >= 3 else ''), 'raw': ns.v} | tojson }}
      expire_after: 90
    - name: "smol 5 ap channel"
      unique_id: smol_5_ap_channel_mirror
      state_topic: "smol/5/diag"
      entity_category: diagnostic
      icon: "mdi:access-point-network"
      value_template: >-
        {% set ns = namespace(v='') %}{% for kv in value.split('|') %}{% if kv.startswith('ap=') %}{% set ns.v = kv.split('=',1)[1] %}{% endif %}{% endfor %}{% set p = ns.v.split(':') %}{{ p[0] if (ns.v and p[0]) else 'none' }}
      json_attributes_topic: "smol/5/diag"
      json_attributes_template: >-
        {% set ns = namespace(v='') %}{% for kv in value.split('|') %}{% if kv.startswith('ap=') %}{% set ns.v = kv.split('=',1)[1] %}{% endif %}{% endfor %}{% set p = ns.v.split(':') %}{{ {'rssi': (p[1] | int(0)) if p | length >= 2 else 0, 'bssid': (p[2] if p | length >= 3 else ''), 'raw': ns.v} | tojson }}
      expire_after: 90

    # =====================================================================
    # #309: the per-field DIAG entities THAT USED TO LIVE HERE ARE GONE — the firmware
    # publishes them as retained MQTT discovery configs now (net/wifi.rs `DIAG_DISCOVERY`).
    #
    # WHY: they were hand-written per node id, so a board only appeared in the dashboard if
    # somebody had typed a stanza for it. ids 50/51/122 were on the mesh with nothing drawn
    # while dead families for 7/9 kept rendering, and the file could not know an id exists.
    # The **unique_ids** are unchanged (`smol_<id>_heap_free_mirror`, …) — firmware reproduces
    # those exactly, and that is what preserves history: a discovery config whose unique_id
    # matches an existing registry row LANDS ON that row and inherits its entity_id.
    #
    # The **entity_ids** are NOT unchanged, and an earlier version of this comment claimed they
    # were. `object_id` does not pin an entity_id — HA ignores it and composes the id from the
    # device name instead (#322). So a field only keeps `sensor.smol_<id>_heap_free` where a row
    # under that unique_id already existed; anywhere it did not, the id comes out
    # device-composed: `sensor.smol_5_obsidian_aegis_heap_free`.
    #
    # Measured on the live fleet 2026-08-01 (entity registry, 312 firmware-published rows):
    # object_id honoured 127/312 overall, and **0/117 for ids 50/51/122** — the three boards
    # that never had a hand-written stanza here, so they had no row to inherit. id5 is 2/43
    # because its old rows used a different scheme (`smol5_heap_free_luna`) that the firmware's
    # `_mirror` unique_ids do not match. id8 is the mixed case, 40/59.
    #
    # The cross-node consumers below and `build_control_room.py` keep working anyway — but
    # because that generator resolves telemetry ids from the REGISTRY (see its comment at
    # :166), not because the convention held. Do not address these by convention; #322 carries
    # the fix. Every board does now get the full set instead of the four that were typed out.
    #
    # A field ABSENT from the record now reads HA `unknown` rather than `0`. That is the
    # point, not a regression: `blrev=`/`brst=` are absent-until-measured, a leaf's record is
    # cut at 232 B, and the C6 watches stop at `dfwd=`. A `0` for "no answer yet" was a lie
    # that looked like data.
    #
    # STILL HAND-WRITTEN HERE, deliberately — a discovery config cannot express these:
    #   * `ap channel` — splits `ap=<ch>:<rssi>:<bssid>` into state + json_attributes, and
    #     `sensor.smol_coexist_health` reads those attributes. `apch=` (what coexist BELIEVES)
    #     is firmware-published and is the more useful signal.
    #   * `NTP fresh` — a DERIVED label over two keys (`tage=`+`tsrc=` → fresh/aging/stale/
    #     no-sync), not a field mirror. `time_sync_age` + `time_source` are published raw.
    # DELETED WITHOUT A REPLACEMENT (one only): `time offset` / `toff=`, which NO producer has
    # ever emitted — `set_diag_extra`'s own doc says "toff deferred" — so it had always
    # rendered a fabricated `0`.
    #
    # `cfg=` CONTRACT (pinned, fw #74 stage-2 — still needed by the config-drift comparator in
    # the template: section below): `cfg=<screen>:<page>,<led>,<mask4hexU>,<units>`, e.g.
    # `Grid:1,status,0000,F24` — screen = the LIVE rendered screen, mask = #55's %04X hex,
    # units = temp+clock (e.g. F24).
    # =====================================================================
    # --- #194/#31 NTP freshness (per-node) — parsed from `tage=`(s since last time-sync) + `tsrc=` in
    # smol/<id>/diag. State: fresh(<300s) / aging(<3600s) / stale(>=3600s) / no-sync (thresholds = #187
    # SYNC_FRESH_S 300 / SYNC_STALE_S 3600). ⚠ HONEST: boots sync once then age climbs — reads
    # STALE fleet-wide until #192 periodic re-sync ships. That is EXPECTED, not a dashboard bug
    # (see the `note` attribute). expire_after → 'unavailable' if a node stops publishing diag. ---
    - name: "smol 8 NTP fresh"
      unique_id: smol_8_ntp_fresh
      state_topic: "smol/8/diag"
      entity_category: diagnostic
      icon: "mdi:clock-check-outline"
      expire_after: 180
      value_template: >-
        {% set ns = namespace(age=-1, src='none') %}{% for kv in value.split('|') %}{% if kv.startswith('tage=') %}{% set ns.age = kv.split('=',1)[1] | int(-1) %}{% elif kv.startswith('tsrc=') %}{% set ns.src = kv.split('=',1)[1] %}{% endif %}{% endfor %}{% if ns.src in ['none',''] or ns.age < 0 %}no-sync{% elif ns.age < 300 %}fresh{% elif ns.age < 3600 %}aging{% else %}stale{% endif %}
      json_attributes_topic: "smol/8/diag"
      json_attributes_template: >-
        {% set ns = namespace(age=-1, src='none') %}{% for kv in value.split('|') %}{% if kv.startswith('tage=') %}{% set ns.age = kv.split('=',1)[1] | int(-1) %}{% elif kv.startswith('tsrc=') %}{% set ns.src = kv.split('=',1)[1] %}{% endif %}{% endfor %}{{ {'age_s': ns.age, 'source': ns.src, 'fresh_below_s': 300, 'stale_above_s': 3600, 'note': 'boot-only sync ages out → reads stale/red fleet-wide until #192 periodic re-sync ships; NOT a dashboard bug'} | tojson }}
    # --- id8 display text mirror (#74 item 5) ---
    - name: "smol 8 display"
      unique_id: smol_8_display_mirror
      state_topic: "smol/8/display"
      entity_category: diagnostic
      icon: "mdi:monitor-eye"
      value_template: >-
        {% set p = value.split('|') %}{{ (p[1].split(';') | join(' / ')) if p | length > 1 and p[1] else '' }}
      json_attributes_topic: "smol/8/display"
      json_attributes_template: >-
        {% set p = value.split('|') %}{{ {'lines': (p[1].split(';') if p | length > 1 and p[1] else [])} | tojson }}
    # --- id8 OTA history ring (#74 item 4) ---
    - name: "smol 8 ota history"
      unique_id: smol_8_ota_history_mirror
      state_topic: "smol/8/ota/history"
      entity_category: diagnostic
      icon: "mdi:history"
      value_template: >-
        {% set p = value.split('|') %}{% set e = (p[1].split(';')[0] if p | length > 1 and p[1] else '') %}{{ e.split(':')[0] ~ (' ' ~ e.split(':')[1] if ':' in e else '') }}
      json_attributes_topic: "smol/8/ota/history"
      json_attributes_template: >-
        {% set p = value.split('|') %}{% set ns = namespace(rows=[]) %}
        {% for e in (p[1].split(';') if p | length > 1 and p[1] else []) %}{% set f = e.split(':') %}
        {% if f | length >= 4 %}{% set ns.rows = ns.rows + [{'builds': f[0], 'outcome': f[1], 'dur_s': f[2] | int(0), 'at_up': f[3] | int(0)}] %}{% endif %}{% endfor %}
        {{ {'entries': ns.rows} | tojson }}
# =====================================================================
# MESH TOPOLOGY derived sensors (issue #27) — HELD; back the topology card.
# rssi = each spoke's signal as heard by the ELECTED owner (dynamic — reads the
# owner's peers list; an UNKNOWN owner now yields 'unknown' rather than falling back to a
# named board, because the old id7 fallback outlived id7 and would have read a deleted
# entity). online = the node's STAT is fresh — reads
# sensor.smol_<id>_screen (the cache-republished smol/<id>/status, reliable single-frame),
# NOT the sparse relay-fragmented telemetry voltage that FALSE-offlined a live-but-sparse
# leaf (#68). F6 (net/wifi.rs:1656) freshness-gates the gateway leaf-status republish at 45s
# → a genuinely-dead node stops refreshing → _screen expire_after (90s) fires → online off;
# an alive leaf keeps re-arming it. (Corrects the earlier #12 note that mis-credited F6 to the
# telemetry path — F6 gates STATUS, which is exactly why online now reads it.)
# resync = a leaf's self-reported ch != the elected channel.
# reelecting = the elected owner is offline or the MC record went stale.
# =====================================================================
template:
  - sensor:
      # --- #194/#31 NTP freshness FLEET counter. HONEST TWICE OVER: expect "0/1 fresh" (stale)
      # until #192 periodic re-sync ships (boot-only sync ages past 3600s), AND the denominator is
      # 1, not the fleet — this counts the hand-listed ids, which since the id7/id9 retirement is
      # only id8. A real fleet counter has to come off the device registry (#309/#308). ---
      - name: "smol NTP fleet"
        unique_id: smol_ntp_fleet
        icon: mdi:clock-check
        # STATIC entity refs (not concatenated) so HA reliably tracks them as dependencies.
        state: "{{ [states('sensor.smol_8_ntp_fresh')] | select('eq', 'fresh') | list | count }}/1 fresh"
        attributes:
          aging: "{{ [states('sensor.smol_8_ntp_fresh')] | select('eq', 'aging') | list | count }}"
          stale: "{{ [states('sensor.smol_8_ntp_fresh')] | reject('in', ['fresh', 'aging']) | list | count }}"
          note: "Expect 0/1 fresh until #192 periodic re-sync ships — boot-only sync ages past 3600s. Not a dashboard bug. Denominator = the hand-listed ids (id8 only since the id7/id9 retirement), NOT the live fleet — see #309."
      # --- #45 Custom-screen COMPOSE: turn each node's author string into the wire
      # payload <count>|<size><align>text;… . A TEMPLATE sensor (not a static automation)
      # so it auto-subscribes to whatever {entity_id}s the user references — the clean fix
      # for #45's "trigger on each referenced entity" (a static trigger list can't know
      # them). Reuses the Batt display-override subst() macro; strips ';', clips per size
      # (7 for l, 12 for s/m). Empty author → '' (clears the custom). The publish
      # automation ships this on change. ---
      - name: "smol 8 custom lay"
        unique_id: smol_8_custom_lay
        state: >-
          {%- macro subst(src) -%}
          {%- set ns = namespace(out=src) -%}
          {%- for id in src | regex_findall('\{([a-z0-9_.]+)\}') -%}
          {%- set v = states(id) -%}
          {%- set v = '--' if (v | lower) in ['unknown','unavailable','none',''] else v -%}
          {%- set ns.out = ns.out | replace('{' ~ id ~ '}', v) -%}
          {%- endfor -%}{{- ns.out -}}
          {%- endmacro -%}
          {%- set author = states('input_text.smol_8_custom') -%}
          {%- if (author | lower) in ['unknown','unavailable','none',''] -%}{{- '' -}}
          {%- else -%}
          {%- set ns = namespace(segs=[]) -%}
          {%- for raw in author.split('|')[:4] -%}
          {%- set ln = raw.strip() -%}
          {%- if ln | length >= 2 -%}
          {%- set size = ln[0] if ln[0] in 'sml' else 's' -%}
          {%- set align = ln[1] if ln[1] in 'lcr' else 'l' -%}
          {%- set text = (subst(ln[2:] | trim) | replace(';','')) -%}
          {%- set ns.segs = ns.segs + [size ~ align ~ text[:(7 if size == 'l' else 12)]] -%}
          {%- endif -%}
          {%- endfor -%}
          {%- if ns.segs | length > 0 -%}{{- ns.segs | length -}}|{{- ns.segs | join(';') -}}{%- else -%}{{- '' -}}{%- endif -%}
          {%- endif -%}
  - sensor:
      # --- #51 dynamic-role gap fix: EVERY node needs leaf-bond entities (any node can be a leaf).
      # These read the DYNAMIC elected owner's peers (sensor.smol_<owner>_peers → this node's entry),
      # so they follow the crown wherever it moves. What they can NOT follow is the id list itself:
      # the id7/id9 copies were deleted 2026-07-28 with those boards, and id50/id51 have none. ---
      - name: "smol 8 rssi"
        unique_id: smol_8_rssi
        state: >-
          {#- NO `or '<id>'` default. It used to be `or '7'`, so an unknown owner silently read
          sensor.smol_7_peers — a board that stopped existing in July and whose entity is now
          deleted outright. Unknown owner must read 'unknown', never borrow a named board. -#}
          {% set owner = state_attr('sensor.smol_mesh_channel', 'owner') %}
          {% set ps = state_attr('sensor.smol_' ~ owner ~ '_peers', 'peers') or [] %}
          {% set m = ps | select('match', '^8,') | list %}
          {% if m %}{% set v = m[0].split(',')[1] | int(-999) %}{{ v - 256 if v > 127 else v }}{% else %}unknown{% endif %}
  - binary_sensor:
      - name: "smol 8 online"
        unique_id: smol_8_online
        state: "{{ states('sensor.smol_8_screen') not in ['unavailable', 'unknown', 'none', ''] }}"
      - name: "smol 5 online"
        unique_id: smol_5_online
        state: "{{ states('sensor.smol_5_screen') not in ['unavailable', 'unknown', 'none', ''] }}"
      - name: "smol 8 resync"
        unique_id: smol_8_resync
        state: >-
          {% set ch = state_attr('sensor.smol_8_peers', 'ch') %}
          {{ ch is not none and ch != state_attr('sensor.smol_mesh_channel', 'channel') }}
      - name: "smol mesh reelecting"
        unique_id: smol_mesh_reelecting
        state: >-
          {#- same retired-default fix as `smol 8 rssi` above: was `or '7'`. is_state() on a
          missing entity is False, so the old default did not error — it quietly answered
          "not re-electing" using a dead board. The unavailable-channel clause below is the
          honest signal when the owner is unknown. -#}
          {% set owner = state_attr('sensor.smol_mesh_channel', 'owner') %}
          {{ is_state('binary_sensor.smol_' ~ owner ~ '_online', 'off')
             or states('sensor.smol_mesh_channel') in ['unavailable', 'unknown'] }}

  # --- #27 topology edge-weighting helpers (luna, issue-27 Appendix A) ---
  - sensor:
      - name: "smol 8 rssi band"
        unique_id: smol_8_rssi_band
        state: >-
          {% set r = states('sensor.smol_8_rssi') | int(-999) %}
          {{ 'unknown' if r == -999 else 'strong' if r >= -55 else 'good' if r >= -70 else 'weak' if r >= -82 else 'faint' }}
  - binary_sensor:
      - name: "smol mesh asleep"
        unique_id: smol_mesh_asleep
        state: "{{ states('sensor.smol_mesh_channel') in ['unknown','unavailable','none',''] }}"

  # --- COEXIST health — crown WiFi-uplink AP channel vs the elected mesh channel. Co-channel is
  # REQUIRED (WiFi + ESP-NOW share the one C3 radio): a crown on ch1 while the mesh runs ch6 goes
  # deaf mid-transfer = OTA dies, and until now this was INVISIBLE (hand-parsed from diag for ~2h).
  # `ap=` appears ONLY in the crown's diag, so coalesce it across all boards (the one reporting a
  # real channel IS the crown) and compare to smol/mesh/channel (MC frame). GREEN = co-channel;
  # RED = mismatch (coexist broken); AMBER = co-channel but AP rssi <= -80 (weak/degraded uplink;
  # <= to match meshscope's WEAK_LINK_DBM boundary — pixel-identical at exactly -80).
  # STATIC entity refs only (never a dynamically-built 'sensor.smol_'~id~'_x' — those do NOT track,
  # and a states.sensor|selectattr scan didn't re-render reliably here either). The four ap_channel
  # sensors are enumerated LITERALLY so HA registers a listener per entity → re-renders the instant
  # the crown re-associates to a new channel (the exact event we watch). Crown = the MC owner
  # (smol/mesh/channel); we read THAT node's ap= (spec agreed w/ meshscope: luna-hatel + luna-otaui).
  # {%- -%} trims the render to a bare token (idle/violated/…), matching the ota_death sensor idiom.
  # ======================================================================================
  # `smol coexist health` — REBUILT crown-derived, and now sourced from the firmware's OWN verdict.
  #
  # It used to enumerate candidate ids LITERALLY (5/7/8/9, then 5/8 after the id7/id9 retirement)
  # and compare that board's `sensor.smol_<id>_ap_channel` against the elected mesh channel. Two
  # problems, one of them live:
  #   · The list is not the fleet. With the crown at id50/id51/id122 the state read `unknown` —
  #     and a health indicator that says "unknown" when it means "I cannot see the crown" is the
  #     worst possible failure for the one signal that tells us OTA is dead. It read `healthy`
  #     only because the crown happened to be id5, one of the two ids still on the list.
  #   · It re-derived a verdict the BOARD already computes. `cc=<0|1>` is the crown's own
  #     co-channel answer (live AP channel == mesh channel), computed where both values actually
  #     live, and it is on the wire today (verified: id5 publishes `ap=6:-43:… cc=1 degraded=0`).
  #     Comparing two HA entities that update independently could always skew; reading one field
  #     from one record cannot.
  #
  # The literal-enumeration comment that used to sit here was right about WHY it was written that
  # way — a `states.sensor | selectattr` scan registers no per-entity listener and did not
  # re-render reliably. An MQTT trigger sidesteps that entirely: it fires on message arrival, so
  # it needs no listeners and is *more* prompt than the entity-listener version it replaces.
  #
  # State vocabulary is UNCHANGED (`healthy` · `degraded` · `violated` · `unknown`) because that is
  # a documented contract. `ap_reporters` is gone: it counted how many entries of a hardcoded
  # 2-board list were reporting, i.e. it measured the list rather than the fleet. Nothing in the
  # tree reads it (meshscope classifies the crown itself from MQTT, not from these attributes).
  # ======================================================================================
  - trigger:
      - platform: mqtt
        topic: "smol/+/diag"
    condition:
      # Only the ELECTED crown, and only a record that carries `cc=`. Both matter: `cc` is
      # documented as always present and 0 on a leaf, so an untruncated leaf record would
      # otherwise land here as a confident "crown off-channel". Split-then-startswith so `cc=`
      # cannot be matched inside another field.
      - condition: template
        value_template: "{{ trigger.payload is string and (trigger.payload.split('|') | select('search','^cc=') | list | count) > 0 }}"
      - condition: template
        value_template: >-
          {% set o = state_attr('sensor.smol_mesh_channel','owner') %}
          {{ o is none or (o | string) == trigger.topic.split('/')[1] }}
    sensor:
      - name: "smol coexist health"
        unique_id: smol_coexist_health
        state: >-
          {%- set ns = namespace(cc='', rssi=0, ap='') -%}
          {%- for kv in trigger.payload.split('|') -%}
            {%- if kv.startswith('cc=') -%}{%- set ns.cc = kv.split('=',1)[1] -%}
            {%- elif kv.startswith('ap=') -%}{%- set ns.ap = kv.split('=',1)[1] -%}{%- endif -%}
          {%- endfor -%}
          {%- set p = ns.ap.split(':') -%}
          {%- set ns.rssi = (p[1] | int(0)) if p | length >= 2 else 0 -%}
          {#- cc=0 is off-channel: the ch1-AP-vs-ch6-mesh trap that silently kills OTA
              (co-channel moved 48 KB, off-channel moved 0). AMBER stays "co-channel but the
              uplink is weak", which is a DIFFERENT condition from the firmware's own
              `degraded=` flag — see strand_guard_latched below. -#}
          {%- if ns.cc == '' -%}unknown
          {%- elif ns.cc != '1' -%}violated
          {%- elif ns.rssi <= -80 and ns.rssi != 0 -%}degraded
          {%- else -%}healthy{%- endif -%}
        icon: >-
          {%- set s = states('sensor.smol_coexist_health') -%}
          {%- if s == 'violated' -%}mdi:wifi-alert{%- elif s == 'degraded' -%}mdi:wifi-strength-2-alert{%- elif s == 'healthy' -%}mdi:wifi-check{%- else -%}mdi:wifi-cancel{%- endif -%}
        attributes:
          mesh_channel: "{{ states('sensor.smol_mesh_channel') }}"
          mesh_owner: "{{ state_attr('sensor.smol_mesh_channel','owner') }}"
          node: "{{ trigger.topic.split('/')[1] }}"
          crown_ap_channel: >-
            {%- set ns = namespace(v='') -%}
            {%- for kv in trigger.payload.split('|') -%}{%- if kv.startswith('ap=') -%}{%- set ns.v = kv.split('=',1)[1].split(':')[0] -%}{%- endif -%}{%- endfor -%}
            {{ ns.v if ns.v else 'none' }}
          ap_rssi: >-
            {%- set ns = namespace(v='') -%}
            {%- for kv in trigger.payload.split('|') -%}{%- if kv.startswith('ap=') -%}{%- set ns.v = kv.split('=',1)[1] -%}{%- endif -%}{%- endfor -%}
            {%- set p = ns.v.split(':') -%}{{ (p[1] | int(0)) if p | length >= 2 else 0 }}
          co_channel: >-
            {%- set ns = namespace(v='') -%}
            {%- for kv in trigger.payload.split('|') -%}{%- if kv.startswith('cc=') -%}{%- set ns.v = kv.split('=',1)[1] -%}{%- endif -%}{%- endfor -%}
            {{ ns.v }}
          # DELIBERATELY not called `degraded`: the firmware's `degraded=1` means the strand-guard
          # has LATCHED because the crown is off-channel (MQTT alive, OTA off, never crownless).
          # This sensor's `degraded` STATE means co-channel with a weak uplink. Two different
          # conditions; giving them one name would make a latched strand-guard read as bad signal.
          strand_guard_latched: >-
            {%- set ns = namespace(v='') -%}
            {%- for kv in trigger.payload.split('|') -%}{%- if kv.startswith('degraded=') -%}{%- set ns.v = kv.split('=',1)[1] -%}{%- endif -%}{%- endfor -%}
            {{ ns.v == '1' }}
          note: >-
            GREEN=crown AP co-channel with the mesh (firmware `cc=1`) · RED=off-channel (coexist
            broken -> OTA dead, the ch1-vs-ch6 trap) · AMBER=co-channel but AP rssi<=-80.
            Sourced from the ELECTED crown's own DIAG, so it follows a takeover to any id with no
            candidate list. `unknown` means no crown record carrying `cc=` has arrived — that is
            "cannot see the crown", NOT a pass. `strand_guard_latched` is the firmware's own
            `degraded=` flag and is a different condition from this sensor's `degraded` state.

  # ======================================================================================
  # #153 burst-freeze (`brst=`) and #217 coexist belief-vs-observation (`apch=` vs `ap=`)
  #
  # WILDCARD-SUBSCRIBED, deliberately. Both fields live in `smol/<id>/diag`, a per-id topic,
  # and every other consumer of that topic in this file is hand-written per id (5/8 — it was
  # 5/7/8/9 until the id7/id9 retirement) — which is exactly why the peers roster went dark the
  # moment the crown moved to id50, and why `smol coexist health` above can only ever see two
  # boards, one fewer blind spot than yesterday and still not the fleet. An MQTT *trigger* takes a
  # topic wildcard, and `trigger.topic` carries the id, so ONE block covers the whole fleet
  # including boards HA has never seen. No per-id duplication, nothing to extend when a node
  # is added.
  #
  # Field extraction splits on `|` and matches with startswith, never a bare substring test:
  # an unanchored search for `ap=` matches the tail of `heap=42040`, which is how
  # tools/ota_verify.sh came to compare free heap against a WiFi channel and tell the
  # operator to re-channel a live AP (fixed in da1cba8). The firmware named the field `apch=`
  # to kill that class; this parser does its half.
  # ======================================================================================
  - trigger:
      - platform: mqtt
        topic: "smol/+/diag"
    condition:
      # Only act on a record that actually carries a measurement. The firmware appends
      # `brst=` ONLY once a burst has been measured (mode.rs ~3336), so its ABSENCE means
      # "nothing measured yet", not zero — and a sensor that recomputed on every DIAG would
      # overwrite a real peak with a confident `0 ms`. Filtering here leaves the entity at
      # `unknown` until there is something true to say.
      - condition: template
        value_template: "{{ trigger.payload is string and (trigger.payload.split('|') | select('search','^brst=') | list | count) > 0 }}"
    sensor:
      - name: "smol burst freeze"
        unique_id: smol_burst_freeze
        # THE number JP asks about: how long the active screen got no service at all inside a
        # WiFi burst. This IS the felt freeze — the burst's own duration is only supporting
        # detail, since the app can be serviced partway through a long burst.
        unit_of_measurement: "ms"
        state_class: measurement
        icon: "mdi:snowflake-alert"
        state: >-
          {%- set ns = namespace(v='') -%}
          {%- for kv in trigger.payload.split('|') -%}{%- if kv.startswith('brst=') -%}{%- set ns.v = kv.split('=',1)[1] -%}{%- endif -%}{%- endfor -%}
          {{ ns.v.split(':')[0] | int(0) }}
        attributes:
          burst_ms: >-
            {%- set ns = namespace(v='') -%}
            {%- for kv in trigger.payload.split('|') -%}{%- if kv.startswith('brst=') -%}{%- set ns.v = kv.split('=',1)[1] -%}{%- endif -%}{%- endfor -%}
            {%- set p = ns.v.split(':') -%}{{ (p[1] | int(0)) if p | length >= 2 else 0 }}
          kind: >-
            {%- set ns = namespace(v='') -%}
            {%- for kv in trigger.payload.split('|') -%}{%- if kv.startswith('brst=') -%}{%- set ns.v = kv.split('=',1)[1] -%}{%- endif -%}{%- endfor -%}
            {%- set p = ns.v.split(':') -%}{{ p[2] if p | length >= 3 else '' }}
          # `f` and `n` are crown-only (the MQTT telemetry flush; the NTP resync is gated on
          # is_gateway()). `r` is the opposite — maybe_leaf_reelect() returns early on a
          # gateway, so a RE-ELECTION burst can only ever be reported by a LEAF attempting a
          # takeover. So this is not a crown-only metric, and a leaf showing `r` is election
          # churn freezing that leaf's screen.
          kind_label: >-
            {%- set ns = namespace(v='') -%}
            {%- for kv in trigger.payload.split('|') -%}{%- if kv.startswith('brst=') -%}{%- set ns.v = kv.split('=',1)[1] -%}{%- endif -%}{%- endfor -%}
            {%- set p = ns.v.split(':') -%}{%- set k = p[2] if p | length >= 3 else '' -%}
            {%- if k == 'f' -%}telemetry flush (crown)
            {%- elif k == 'n' -%}NTP resync (crown)
            {%- elif k == 'r' -%}re-election (leaf takeover)
            {%- else -%}unknown{%- endif -%}
          node: "{{ trigger.topic.split('/')[1] }}"
          note: >-
            PEAK since that board's previous DIAG, not a live sample: the firmware keeps the
            worst gap in the window and RESETS the field after publishing, so each record is
            one window's high-water mark. Absent until a burst is measured, so `unknown` means
            "not yet measured", never 0 ms. CAVEAT (#306): in practice only the CROWN can
            reach HA with this. A leaf's DIAG travels as ONE ESP-NOW frame capped at
            RELAY_VALUE_MAX=232 B and a realistic leaf record offers ~307 B, so the tail —
            including brst= — is dropped with no signal. Leaves DO burst (kind `r`,
            maybe_leaf_reelect returns early on a gateway, so re-election bursts are
            leaf-ONLY), which means a missing value is NOT evidence that leaves never freeze.

  # A leaf's DIAG travels as ONE ESP-NOW frame capped at RELAY_VALUE_MAX=232 B, and the record
  # outgrew it, so leaves silently lost their trailing fields — `cc`, `cdeaf`, `apch`, `blrev`
  # and `brst` all live in that tail. Firmware now cuts on a field boundary and appends
  # `|cut=<bytes>` (capped 999) to say how much went. That marker turns "brst= is missing from
  # leaves" from an assertion into a measurement: if this sensor has a value, the burst-freeze
  # panel can name the board and the byte count instead of hand-waving.
  - trigger:
      - platform: mqtt
        topic: "smol/+/diag"
    condition:
      - condition: template
        value_template: "{{ trigger.payload is string and (trigger.payload.split('|') | select('search','^cut=') | list | count) > 0 }}"
    sensor:
      - name: "smol diag truncated"
        unique_id: smol_diag_truncated
        unit_of_measurement: "B"
        state_class: measurement
        icon: "mdi:content-cut"
        state: >-
          {%- set ns = namespace(v='') -%}
          {%- for kv in trigger.payload.split('|') -%}{%- if kv.startswith('cut=') -%}{%- set ns.v = kv.split('=',1)[1] -%}{%- endif -%}{%- endfor -%}
          {{ ns.v | int(0) }}
        attributes:
          node: "{{ trigger.topic.split('/')[1] }}"
          note: >-
            Bytes dropped from the END of this board's DIAG record because it exceeded the
            232 B ESP-NOW relay cap. The lost tail is where the newest fields live — cc,
            cdeaf, apch, blrev, brst — so a board reporting a cut here CANNOT deliver its
            burst-freeze measurement. Value is capped at 999 by the publisher, so 999 means
            "at least 999". Crowns are unaffected: they self-publish the full record over MQTT.

  # ======================================================================================
  # #153 `blrev=` — the MEASURED bootloader auto-revert capability.
  #
  # This closes a gate the roadmap has carried as UNPROVEN since July: does the bootloader do
  # app-rollback, or is the app-side `boot_confirm` path the only thing between a bad image and a
  # brick? `on` = the net exists. `off` = it does not, and canary discipline is load-bearing.
  #
  # THREE answers, and absent is not one of them. The field is omitted entirely when never
  # observed, and that is the COMMON case, because the value is only measurable on a post-OTA boot:
  # it lives in RTC-fast persistent RAM, survives the rollback's software_reset, holds for the
  # power-on session the OTA started, and a power cycle clears it. So `unknown` here means "no OTA
  # boot has been observed since this board last lost power" — emphatically NOT "no net".
  # Rendering absence as `off` would invent a brick risk; rendering it as `on` would invent safety.
  #
  # Deliberately NOT crown-filtered. Any board that boots an OTA image can answer, and the boards
  # that get OTA'd are exactly the ones worth hearing from. In practice a leaf's answer is lost to
  # the 232 B tail truncation (#306) — `blrev=` sits in the dropped region — so today this is
  # crown-or-recently-crowned in effect, which `sensor.smol_diag_truncated` will corroborate.
  #
  # It holds its value on purpose (no reset-to-unknown between reports): the failure mode here is
  # boring, per the lead — an OTA campaign runs, the answer scrolls past, nobody writes it down.
  # The `measured_by`/`last_changed` pair is the provenance that makes a held value readable.
  # ======================================================================================
  - trigger:
      - platform: mqtt
        topic: "smol/+/diag"
    condition:
      - condition: template
        value_template: "{{ trigger.payload is string and (trigger.payload.split('|') | select('search','^blrev=') | list | count) > 0 }}"
    sensor:
      - name: "smol bootloader revert"
        unique_id: smol_bootloader_revert
        icon: >-
          {%- set s = states('sensor.smol_bootloader_revert') -%}
          {%- if s == 'on' -%}mdi:shield-check{%- elif s == 'off' -%}mdi:shield-off-outline{%- else -%}mdi:shield-question-outline{%- endif -%}
        state: >-
          {%- set ns = namespace(v='') -%}
          {%- for kv in trigger.payload.split('|') -%}{%- if kv.startswith('blrev=') -%}{%- set ns.v = kv.split('=',1)[1] -%}{%- endif -%}{%- endfor -%}
          {{ ns.v if ns.v in ['on','off'] else 'unknown' }}
        attributes:
          measured_by: "{{ trigger.topic.split('/')[1] }}"
          verdict: >-
            {%- set ns = namespace(v='') -%}
            {%- for kv in trigger.payload.split('|') -%}{%- if kv.startswith('blrev=') -%}{%- set ns.v = kv.split('=',1)[1] -%}{%- endif -%}{%- endfor -%}
            {%- if ns.v == 'on' -%}bootloader DOES auto-revert — a bad OTA image has a net beneath the app
            {%- elif ns.v == 'off' -%}bootloader does NOT auto-revert — the app-side boot_confirm is the ONLY net, canary one board at a time
            {%- else -%}not measured — only observable on a post-OTA boot, and a power cycle clears it{%- endif -%}
          note: >-
            Measured, not assumed: recorded by boot_confirm on a post-OTA boot, held in RTC-fast
            persistent RAM for that power-on session. `unknown` means no OTA boot has been seen
            since this board last lost power — NOT that there is no net. `off` is the honest
            reading of "not promoted": whether rollback is disabled or the bootloader simply did
            not set the state, the operational consequence is the same. On a leaf the answer is
            usually lost to the 232 B DIAG tail truncation (#306).

  - trigger:
      - platform: mqtt
        topic: "smol/+/diag"
    condition:
      # `ap=` is present only while a board holds a live WiFi association, i.e. the crown.
      # Split-then-startswith so `heap=` cannot masquerade as `ap=`.
      - condition: template
        value_template: "{{ trigger.payload is string and (trigger.payload.split('|') | select('search','^ap=') | list | count) > 0 }}"
      # ...and only from the board that is CURRENTLY the elected crown. Every DIAG topic is
      # retained, so on an HA restart the retained records of former crowns (id13 still holds a
      # role-G payload; id7's was cleared 2026-07-28 with the board's retirement, which removes one
      # such ghost and not the hazard) all replay at subscribe time and the last one to arrive
      # would win — publishing a confident verdict about a board that has not been crown for
      # hours. Owner comes from the mesh-wide `smol/mesh/channel`, so this stays id-agnostic.
      # If the owner is not yet known, accept rather than go silent.
      - condition: template
        value_template: >-
          {% set o = state_attr('sensor.smol_mesh_channel','owner') %}
          {{ o is none or (o | string) == trigger.topic.split('/')[1] }}
    binary_sensor:
      - name: "smol coexist belief mismatch"
        unique_id: smol_coexist_belief_mismatch
        device_class: problem
        # `ap=<ch>:<rssi>:<bssid>` is what the HAL reports for the LIVE association;
        # `apch=<ch>` is what the coexist logic BELIEVES after its last scan — and the belief
        # is what the off-channel decision is actually made from. Either number alone looks
        # fine; the DISAGREEMENT is the bug, and off-channel is a proven OTA blocker here
        # (co-channel moved 48 KB, off-channel moved 0).
        state: >-
          {%- set ns = namespace(obs='', bel='') -%}
          {%- for kv in trigger.payload.split('|') -%}
            {%- if kv.startswith('ap=') -%}{%- set ns.obs = kv.split('=',1)[1].split(':')[0] -%}
            {%- elif kv.startswith('apch=') -%}{%- set ns.bel = kv.split('=',1)[1] -%}{%- endif -%}
          {%- endfor -%}
          {#- apch=0 is "not yet scanned", NOT channel zero: treating it as a channel would
              report a mismatch against every real association on boot. -#}
          {{ ns.obs != '' and ns.bel not in ['', '0'] and (ns.bel | int(-1)) != (ns.obs | int(-2)) }}
        # Cleared if the reporting board stops publishing (it demoted, or went away). A real
        # standing mismatch re-arms this on every DIAG (~60 s), so the timer only ever expires
        # once the evidence has genuinely stopped arriving.
        auto_off: "00:05:00"
        attributes:
          node: "{{ trigger.topic.split('/')[1] }}"
          observed_channel: >-
            {%- set ns = namespace(v='') -%}
            {%- for kv in trigger.payload.split('|') -%}{%- if kv.startswith('ap=') -%}{%- set ns.v = kv.split('=',1)[1].split(':')[0] -%}{%- endif -%}{%- endfor -%}
            {{ ns.v if ns.v else 'none' }}
          # THREE distinct outcomes, not two. `absent` = this build does not publish apch= at
          # all (pre-907), `unscanned` = apch=0, i.e. published but no answer yet, and a number
          # = a real belief. Collapsing the first two into "unknown" made the sensor read a
          # confident `off` — "belief verified OK" — on a board that cannot report a belief in
          # the first place. Same failure shape as rendering a missing brst= as 0 ms.
          believed_channel: >-
            {%- set ns = namespace(v='', seen=false) -%}
            {%- for kv in trigger.payload.split('|') -%}{%- if kv.startswith('apch=') -%}{%- set ns.v = kv.split('=',1)[1] -%}{%- set ns.seen = true -%}{%- endif -%}{%- endfor -%}
            {%- if not ns.seen -%}absent{%- elif ns.v == '0' -%}unscanned{%- else -%}{{ ns.v }}{%- endif -%}
          # What the card should actually say. `unevaluable` is NOT the same as `ok`.
          verdict: >-
            {%- set ns = namespace(obs='', bel='', seen=false) -%}
            {%- for kv in trigger.payload.split('|') -%}
              {%- if kv.startswith('ap=') -%}{%- set ns.obs = kv.split('=',1)[1].split(':')[0] -%}
              {%- elif kv.startswith('apch=') -%}{%- set ns.bel = kv.split('=',1)[1] -%}{%- set ns.seen = true -%}{%- endif -%}
            {%- endfor -%}
            {%- if not ns.seen -%}unevaluable · firmware does not publish apch= yet
            {%- elif ns.bel == '0' -%}unevaluable · coexist has not scanned yet (apch=0)
            {%- elif (ns.bel | int(-1)) != (ns.obs | int(-2)) -%}mismatch · believes ch{{ ns.bel }}, associated on ch{{ ns.obs }}
            {%- else -%}ok · belief agrees with the live association (ch{{ ns.obs }}){%- endif -%}
          observed_rssi: >-
            {%- set ns = namespace(v='') -%}
            {%- for kv in trigger.payload.split('|') -%}{%- if kv.startswith('ap=') -%}{%- set ns.v = kv.split('=',1)[1] -%}{%- endif -%}{%- endfor -%}
            {%- set p = ns.v.split(':') -%}{{ (p[1] | int(0)) if p | length >= 2 else 0 }}
          note: >-
            ON = the coexist logic believes a different AP channel than the one it is actually
            associated on. That disagreement is itself the bug. OFF is NOT automatically a pass —
            read `verdict`: believed_channel `absent` (pre-907 firmware) or `unscanned` (apch=0)
            both mean the comparison could not be made at all.

  - sensor:
      # --- #74 RSSI-matrix union (HELD; populates when every node publishes smol/<id>/peers) ---
      - name: "smol mesh matrix"
        unique_id: smol_mesh_matrix
        state: >-
          {{ states.sensor | selectattr('entity_id','search','^sensor\\.smol_\\d+_peers$') | list | count }} nodes
        attributes:
          edges: >-
            {% set ns = namespace(e=[]) %}
            {% for s in states.sensor | selectattr('entity_id','search','^sensor\\.smol_\\d+_peers$') %}
              {% set src = s.entity_id.split('_')[1] %}
              {% for p in state_attr(s.entity_id,'peers') or [] %}
                {% set f = p.split(',') %}
                {% if f | length >= 2 %}
                  {% set ns.e = ns.e + [{'from': src, 'to': f[0], 'rssi': f[1]|int(0), 'age': (f[2]|int(0) if f|length>2 else 0), 'ch': (f[3] if f|length>3 else ''), 'flags': (f[4] if f|length>4 else '')}] %}
                {% endif %}
              {% endfor %}
            {% endfor %}
            {{ ns.e }}

  # =====================================================================================
  # #74 item 3 — config-drift COMPARATOR (fw contract PINNED in #74 stage-2).
  # `_expected` rebuilds the SAME canonical string the fw emits in `cfg=`, from the retained
  # COMMAND topics HA published. `config_drift` does a ROBUST FIELD-BY-FIELD compare (not a
  # brittle whole-string equality): a field is only judged when HA has actually commanded it
  # (a still-unknown command topic = "no opinion" = never drift), and the screen field
  # tolerates a commanded default that omits the `:page`. So a half-configured node does NOT
  # false-alarm; drift lights only on a genuine live≠desired (dropped CFG relay / stale NVS /
  # manual nav off the commanded default). Attributes surface applied-vs-expected for debug.
  # NOTE: logic host-validated (jinja mocks, 10 scenarios); confirm on a LIVE board (id8 — the
  # id7 canary this note named has not existed since #198 Phase-2) that the live cfg= string
  # parses as expected before trusting the dashboard drift chip.
  - sensor:
      - name: "smol 8 config expected"
        unique_id: smol_8_config_expected
        icon: "mdi:cog-outline"
        state: >-
          {% set scr = states('sensor.smol_8_config') %}
          {% set led = states('sensor.smol_8_led') %}
          {% set mask = states('sensor.smol_8_plugins') %}
          {% set units = (state_attr('sensor.smol_units','temp') or 'F') ~ (state_attr('sensor.smol_units','clock') or '24') %}
          {{ scr }},{{ led }},{{ mask }},{{ units }}
  - binary_sensor:
      - name: "smol 8 config drift"
        unique_id: smol_8_config_drift
        device_class: problem
        icon: "mdi:cog-sync"
        state: >-
          {% set ap = states('sensor.smol_8_config_applied') %}
          {% set ns = namespace(drift=false) %}
          {% if ap not in ['unknown','unavailable','none',''] %}
            {% set f = ap.split(',') %}
            {% if f | length >= 4 %}
              {% set e_scr = states('sensor.smol_8_config') %}
              {% set e_led = states('sensor.smol_8_led') %}
              {% set e_mask = states('sensor.smol_8_plugins') %}
              {% set e_units = (state_attr('sensor.smol_units','temp') or '') ~ (state_attr('sensor.smol_units','clock') or '') %}
              {% if e_scr not in ['unknown','unavailable','none',''] %}
                {% set a_cmp = f[0] if ':' in e_scr else f[0].split(':')[0] %}
                {% if a_cmp != e_scr %}{% set ns.drift = true %}{% endif %}
              {% endif %}
              {% if e_led not in ['unknown','unavailable','none',''] and f[1] != e_led %}{% set ns.drift = true %}{% endif %}
              {% if e_mask not in ['unknown','unavailable','none',''] and f[2] != e_mask %}{% set ns.drift = true %}{% endif %}
              {% if e_units | length == 3 and f[3] != e_units %}{% set ns.drift = true %}{% endif %}
            {% endif %}
          {% endif %}
          {{ ns.drift }}
        attributes:
          applied: "{{ states('sensor.smol_8_config_applied') }}"
          expected: "{{ states('sensor.smol_8_config_expected') }}"

automation:
  - id: smol_publish_batt_display
    alias: "smol: publish battery display payload (retained)"
    description: >-
      Publishes the display-ready payload to smol/display/batt (retained, QoS0):
      6 segments `BATT|v1|v2|v3|s1|s2|s3` — the voltage trio (1-3) is the manual
      override text when input_boolean.smol_display_override is ON, otherwise the
      live battery voltages; the SOC trio (4-6, issue #17) is always appended.
      Fires on any source-sensor change, any override-helper change, every 5
      minutes, and at HA start. Stale (voltage/EPEver >30 min, HV SOC >6 h) or
      unavailable sources render as `--` per segment.
    mode: single
    max_exceeded: silent
    trigger:
      - platform: state
        id: sensor_change
        entity_id:
          - sensor.48v_battery1_voltage
          - sensor.48v_battery2_voltage
          - sensor.be_battery_voltage
          - sensor.be_cell_voltage_delta
          # SOC page (issue #17, segments 4-6). 48V SOC = the BMS (coulomb-counted,
          # same source we trust for the voltage line) — decoupled from the flaky
          # EPEver bus per team ruling 2026-07-08. Charge current (s3, still EPEver)
          # rides the 5-min heartbeat instead of triggering, to avoid churn.
          - sensor.48v_battery1_battery
          - sensor.48v_battery2_battery
          - sensor.be_soc
          - sensor.battery_state_of_charge
      - platform: state
        id: override_change
        entity_id:
          - input_boolean.smol_display_override
          - input_text.smol_display_line1
          - input_text.smol_display_line2
          - input_text.smol_display_line3
      - platform: time_pattern
        id: heartbeat
        minutes: "/5"
      - platform: homeassistant
        event: start
        id: ha_start
    action:
      - service: mqtt.publish
        data:
          topic: smol/display/batt
          retain: true
          qos: 0
          # `>-` folds the block to one line; the {%- -%} trims + per-cell |trim
          # make the rendered output EXACTLY the `BATT|...` line, no stray space.
          # The SOC trio (s1/s2/s3) is computed ONCE and appended in both branches
          # so the SOC page is available even mid-override (issue #17).
          # Override ON -> `subst()` resolves {entity_id} placeholders in each line
          # source (unknown -> `--`), then `|` is stripped and the line clipped to
          # 12; OFF -> the live battery voltages. The `cell(label, entities, fmt,
          # maxage)` macro picks the first available source from its fallback list
          # whose `last_reported` is within `maxage` (default 1800 s; HV SOC 21600 s).
          payload: >-
            {%- macro cell(label, entities, fmt, maxage=1800) -%}
            {%- set ns = namespace(out=label ~ ' --', found=false) -%}
            {%- for ent in entities -%}
            {%- if not ns.found -%}
            {%- set s = states[ent] -%}
            {%- if s is not none and (s.state | lower) not in ['unknown', 'unavailable', 'none', ''] and (now() - s.last_reported).total_seconds() <= maxage -%}
            {%- set ns.out = label ~ ' ' ~ (fmt | format(s.state | float)) -%}
            {%- set ns.found = true -%}
            {%- endif -%}
            {%- endif -%}
            {%- endfor -%}
            {{- ns.out -}}
            {%- endmacro -%}
            {%- macro subst(src) -%}
            {%- set ns = namespace(out=src) -%}
            {%- for id in src | regex_findall('\{([a-z0-9_.]+)\}') -%}
            {%- set v = states(id) -%}
            {%- set v = '--' if (v | lower) in ['unknown', 'unavailable', 'none', ''] else v -%}
            {%- set ns.out = ns.out | replace('{' ~ id ~ '}', v) -%}
            {%- endfor -%}
            {{- ns.out -}}
            {%- endmacro -%}
            {%- set s1 = cell('48V', ['sensor.48v_battery1_battery', 'sensor.48v_battery2_battery'], '%.0f%%') | trim -%}
            {%- set s2 = cell('HV', ['sensor.be_soc', 'sensor.battery_state_of_charge'], '%.0f%%', 21600) | trim -%}
            {%- set s3 = cell('Chg', ['sensor.epever_charging_current'], '%.1fA') | trim -%}
            {%- if is_state('input_boolean.smol_display_override', 'on') -%}
            {%- set bad = ['unknown', 'unavailable', 'none', ''] -%}
            {%- set o1 = states('input_text.smol_display_line1') -%}
            {%- set o2 = states('input_text.smol_display_line2') -%}
            {%- set o3 = states('input_text.smol_display_line3') -%}
            {%- set l1 = '' if (o1 | lower) in bad else (subst(o1) | replace('|', ''))[:12] -%}
            {%- set l2 = '' if (o2 | lower) in bad else (subst(o2) | replace('|', ''))[:12] -%}
            {%- set l3 = '' if (o3 | lower) in bad else (subst(o3) | replace('|', ''))[:12] -%}
            BATT|{{ l1 }}|{{ l2 }}|{{ l3 }}|{{ s1 }}|{{ s2 }}|{{ s3 }}
            {%- else -%}
            BATT|{{ cell('48V', ['sensor.48v_battery1_voltage', 'sensor.48v_battery2_voltage'], '%.1fV') | trim }}|{{ cell('HV', ['sensor.be_battery_voltage'], '%.1fV') | trim }}|{{ cell('d', ['sensor.be_cell_voltage_delta'], '%.0fmV') | trim }}|{{ s1 }}|{{ s2 }}|{{ s3 }}
            {%- endif -%}

  # --- GRID display (issue #16, v2.2 EXTENSION) -----------------------------
  # A SECOND retained payload for the grid/consumption page the boards page to,
  # separate from the batt payload (own topic, own automation, own triggers):
  #   GRID|1118W|L1 150W|L2 970W
  #   - line 1 (no label): TOTAL = sensor.yurt_consumption — the "yurt consumption"
  #     sensor JP watches on his dashboard (a calculated sum over the two PJ2101A
  #     clamps). It reports in kW, so it is scaled ×1000 to WATTS for unit
  #     consistency with the legs. (sensor.total_grid_power is the same value already
  #     in W, but JP watches "yurt consumption", so that is the source of truth.)
  #   - line 2 `L1`: sensor.l1_power_clamp (W) · line 3 `L2`: sensor.l2_power_clamp (W)
  #   - same envelope as batt: ≤96 B, ≤12 ch/line, ASCII; per-line `--` on
  #     unavailable/unknown/STALE (>30 min last_reported). A value that would exceed
  #     5 digits of watts switches THAT line to `X.XXkW` (safety valve; a yurt won't).
  # Kept as its own automation (not a shared macro with batt) because power lines
  # need kW/W scaling + an empty-label total that the batt `cell()` macro doesn't —
  # two focused automations read cleaner than one merged one, and this leaves the
  # already-live batt publish untouched.
  - id: smol_publish_grid_display
    alias: "smol: publish grid display payload (retained)"
    description: >-
      Publishes the grid/consumption payload to smol/display/grid (retained, QoS0):
      GRID|<total>|L1 <l1>W|L2 <l2>W. Total = the "yurt consumption" sensor (kW,
      scaled to W); legs = the two PJ2101A power clamps (W). Fires on any of the
      three source changes, every 5 minutes, and at HA start. Stale (>30 min) or
      unavailable sources render `--` per line.
    mode: single
    max_exceeded: silent
    trigger:
      - platform: state
        id: grid_change
        entity_id:
          - sensor.yurt_consumption
          - sensor.l1_power_clamp
          - sensor.l2_power_clamp
      - platform: time_pattern
        id: heartbeat
        minutes: "/5"
      - platform: homeassistant
        event: start
        id: ha_start
    action:
      - service: mqtt.publish
        data:
          topic: smol/display/grid
          retain: true
          qos: 0
          # `pcell(label, entity, scale, maxage)` renders one power segment: an empty
          # label -> bare value (the total line); `scale` converts kW->W (total=1000,
          # legs=1); a magnitude >=100000 W renders `X.XXkW`; unavailable/unknown or
          # last_reported older than `maxage` (30 min) -> `--`.
          payload: >-
            {%- macro pcell(label, entity, scale, maxage=1800) -%}
            {%- set pre = (label ~ ' ') if label else '' -%}
            {%- set s = states[entity] -%}
            {%- if s is not none and (s.state | lower) not in ['unknown', 'unavailable', 'none', ''] and (now() - s.last_reported).total_seconds() <= maxage -%}
            {%- set w = (s.state | float) * scale -%}
            {%- if (w | abs) >= 100000 -%}
            {{- pre ~ ('%.2fkW' | format(w / 1000)) -}}
            {%- else -%}
            {{- pre ~ ('%.0fW' | format(w)) -}}
            {%- endif -%}
            {%- else -%}
            {{- pre ~ '--' -}}
            {%- endif -%}
            {%- endmacro -%}
            GRID|{{ pcell('', 'sensor.yurt_consumption', 1000) | trim }}|{{ pcell('L1', 'sensor.l1_power_clamp', 1) | trim }}|{{ pcell('L2', 'sensor.l2_power_clamp', 1) | trim }}

  # =====================================================================
  # #43 DISPLAY UNITS automation — publish the GLOBAL retained units config.
  # Trigger = either units input_select changing; payload = <F|C>|<12|24> from the
  # closed-set selects (always a valid token). GLOBAL: one topic, whole fleet (the
  # gateway relays it to leaves over the mesh — FW/lucid). Default (never published) = F|24.
  # =====================================================================
  - id: smol_units_publish
    alias: "smol #43: publish global display units"
    description: >-
      On either units select changing, publish retained smol/config/units =
      <F|C>|<12|24> (broker retention = persistence; the gateway reads it on its burst).
    mode: single
    trigger:
      - platform: state
        entity_id:
          - input_select.smol_temp_unit
          - input_select.smol_clock_format
    condition:
      - condition: template
        value_template: "{{ trigger.from_state is not none and trigger.from_state.state not in ['unavailable', 'unknown'] }}"
    action:
      - service: mqtt.publish
        data:
          topic: "smol/config/units"
          retain: true
          qos: 0
          payload: "{{ 'F' if is_state('input_select.smol_temp_unit', '°F') else 'C' }}|{{ '24' if is_state('input_select.smol_clock_format', '24h') else '12' }}"

  # =====================================================================
  # #48 blue-LED mode — per-node select → retained smol/<id>/config/led. status/on/off,
  # default status. Set-all fans out to every per-node select (no broadcast topic).
  # =====================================================================
  - id: smol_led_publish
    alias: "smol #48: publish per-node LED mode"
    description: >-
      On any per-node LED select changing, publish retained smol/<id>/config/led =
      status|on|off (broker retention = persistence; the gateway relays it to leaves).
    mode: parallel
    max: 10
    trigger:
      - platform: state
        entity_id:
          - input_select.smol_8_led
    condition:
      - condition: template
        value_template: "{{ trigger.from_state is not none and trigger.from_state.state not in ['unavailable', 'unknown'] }}"
    action:
      - service: mqtt.publish
        data:
          topic: "smol/{{ trigger.entity_id.split('.')[1].split('_')[1] }}/config/led"
          retain: true
          qos: 0
          payload: "{{ trigger.to_state.state }}"

  - id: smol_all_led_fanout
    alias: "smol #48: set-all LED mode → per-node selects"
    description: >-
      On the ALL LED select changing, fan out to every per-node LED select (which each
      then publish their retained smol/<id>/config/led). No broadcast topic.
    mode: single
    trigger:
      - platform: state
        entity_id: input_select.smol_all_led
    condition:
      - condition: template
        value_template: "{{ trigger.from_state is not none and trigger.from_state.state not in ['unavailable', 'unknown'] }}"
    action:
      - service: input_select.select_option
        target:
          entity_id:
            - input_select.smol_8_led
        data:
          option: "{{ trigger.to_state.state }}"

  # =====================================================================
  # #142 RETIRED (removed 2026-07-19, #194/#31): the config/net WiFi-slot switch. Both the
  # `smol_net_publish` and `smol_all_net_fanout` automations (and their `smol_<id>_network`
  # selects above) were dead plumbing — net is not a live control. The board's slot is still
  # visible read-only via the `net=` diag mirror. No publisher writes smol/<id>/config/net anymore.
  # =====================================================================

  # =====================================================================
  # #100 Stage 2 broker override — per-node input_text → RETAINED smol/<id>/config/broker (qos 1).
  # Value = "ip" or "ip:port" (empty = clear → the slot's baked broker). The board RFC1918-validates
  # + self-heals a wrong value via the CONNACK fallback. RETAINED so the gateway relays to leaves.
  # =====================================================================
  - id: smol_broker_publish
    alias: "smol #100: publish per-node broker override"
    description: >-
      On any per-node broker input_text changing, publish retained smol/<id>/config/broker (raw).
    mode: parallel
    max: 10
    trigger:
      - platform: state
        entity_id:
          - input_text.smol_8_broker
    condition:
      - condition: template
        value_template: "{{ trigger.from_state is not none and trigger.from_state.state not in ['unavailable', 'unknown'] }}"
    action:
      - service: mqtt.publish
        data:
          topic: "smol/{{ trigger.entity_id.split('.')[1].split('_')[1] }}/config/broker"
          retain: true
          qos: 1
          payload: "{{ trigger.to_state.state }}"

  # =====================================================================
  # #100 Stage 3 OTA-host override — per-node input_text → RETAINED smol/<id>/config/ota_host (qos 1).
  # Value = one extra RFC1918 image host (empty = clear → slot default). Applied WITHOUT a reboot;
  # the board RFC1918-validates. RETAINED so the gateway relays to leaves.
  # =====================================================================
  - id: smol_ota_host_publish
    alias: "smol #100: publish per-node OTA-host override"
    description: >-
      On any per-node OTA-host input_text changing, publish retained smol/<id>/config/ota_host (raw).
    mode: parallel
    max: 10
    trigger:
      - platform: state
        entity_id:
          - input_text.smol_8_ota_host
    condition:
      - condition: template
        value_template: "{{ trigger.from_state is not none and trigger.from_state.state not in ['unavailable', 'unknown'] }}"
    action:
      - service: mqtt.publish
        data:
          topic: "smol/{{ trigger.entity_id.split('.')[1].split('_')[1] }}/config/ota_host"
          retain: true
          qos: 1
          payload: "{{ trigger.to_state.state }}"

  # =====================================================================
  # #72 IO registry (#194/#31) — per-node input_text → RETAINED smol/<id>/config/io (map) or
  # smol/<id>/io/set (set). One automation; the trigger entity's suffix picks the topic.
  # =====================================================================
  - id: smol_io_publish
    alias: "smol #72: publish per-node IO map + set"
    mode: parallel
    max: 10
    trigger:
      - platform: state
        entity_id:
          - input_text.smol_8_io_map
          - input_text.smol_8_io_set
    condition:
      - condition: template
        value_template: "{{ trigger.from_state is not none and trigger.from_state.state not in ['unavailable', 'unknown'] }}"
    action:
      - variables:
          n: "{{ trigger.entity_id.split('.')[1].split('_')[1] }}"
          sub: "{{ 'io/set' if trigger.entity_id.endswith('_io_set') else 'config/io' }}"
      - service: mqtt.publish
        data:
          topic: "smol/{{ n }}/{{ sub }}"
          retain: true
          qos: 1
          payload: "{{ trigger.to_state.state }}"

  # =====================================================================
  # channel_hint (#194/#31) — FLEET crown-steer. Apply publishes the input_text value; Clear
  # publishes empty (CLEAR). RETAINED so the elected crown consumes it. → smol/mesh/channel_hint
  # =====================================================================
  - id: smol_channel_hint_publish
    alias: "smol #194: publish fleet channel_hint"
    mode: single
    trigger:
      - platform: state
        entity_id:
          - input_button.smol_channel_hint_apply
          - input_button.smol_channel_hint_clear
    condition:
      - condition: template
        value_template: "{{ trigger.from_state is not none and trigger.from_state.state != 'unavailable' }}"
    action:
      - service: mqtt.publish
        data:
          topic: "smol/mesh/channel_hint"
          retain: true
          qos: 1
          payload: "{{ '' if trigger.entity_id.endswith('_clear') else states('input_text.smol_channel_hint') }}"

  # =====================================================================
  # #52 remote REBOOT — per-node button → TRANSIENT smol/<id>/cmd/reset (retain:FALSE).
  # ⚠️ HARD SAFETY: the reset command is NEVER retained — a retained reset = reboot-loop /
  # soft-brick (same discipline as OTA-install). cmd/ = transient commands; config/ = retained.
  # =====================================================================
  - id: smol_reboot_publish
    alias: "smol #52: per-node remote reboot (transient)"
    description: >-
      On a per-node reboot button, publish TRANSIENT (retain:false) smol/<id>/cmd/reset =
      RESET. HARD SAFETY: never retained — a retained reset would reboot-loop the node.
    mode: parallel
    max: 10
    trigger:
      - platform: state
        entity_id:
          - input_button.smol_8_reboot
    condition:
      # Button guard: allow 'unknown' (a button's pre-first-press state) so the FIRST press
      # fires; `from_state is not none` still blocks the None->unknown startup event.
      - condition: template
        value_template: "{{ trigger.from_state is not none and trigger.from_state.state != 'unavailable' }}"
    action:
      - service: mqtt.publish
        data:
          topic: "smol/{{ trigger.entity_id.split('.')[1].split('_')[1] }}/cmd/reset"
          retain: false
          qos: 1     # #52 transient cmd — qos:1 REQUIRED: the gateway drops qos:0 (~5% loss →
          # unreliable reboot). retain:false stays (a retained reset = reboot-loop); qos:1 gives
          # at-least-once delivery of the momentary RESET. (Retained config topics tolerate qos:0
          # via reconnect-redelivery; only TRANSIENT cmd/ needs qos:1 — canary finding 2026-07-12.)
          payload: "RESET"

  - id: smol_all_reboot_fanout
    alias: "smol #52: reboot-all → per-node reboot buttons"
    description: >-
      On the ALL reboot button, fan out to every per-node reboot button (each then publishes
      its TRANSIENT smol/<id>/cmd/reset). Reboots the whole fleet — deliberate + recoverable.
    mode: single
    trigger:
      - platform: state
        entity_id: input_button.smol_all_reboot
    condition:
      # Button guard: allow 'unknown' (first-press state); block only the None->unknown startup.
      - condition: template
        value_template: "{{ trigger.from_state is not none and trigger.from_state.state != 'unavailable' }}"
    action:
      - service: input_button.press
        target:
          entity_id:
            - input_button.smol_8_reboot

  # =====================================================================
  # #71 on-demand WiFi SCAN (#194/#31) — per-node button → TRANSIENT smol/<id>/cmd/scan
  # (retain:FALSE, qos:1 — same discipline as reboot; topic-triggered, payload ignored by fw).
  # =====================================================================
  - id: smol_scan_publish
    alias: "smol #71: per-node on-demand WiFi scan (transient)"
    mode: parallel
    max: 10
    trigger:
      - platform: state
        entity_id:
          - input_button.smol_8_scan
    condition:
      - condition: template
        value_template: "{{ trigger.from_state is not none and trigger.from_state.state != 'unavailable' }}"
    action:
      - service: mqtt.publish
        data:
          topic: "smol/{{ trigger.entity_id.split('.')[1].split('_')[1] }}/cmd/scan"
          retain: false
          qos: 1
          payload: "SCAN"

  - id: smol_all_scan_fanout
    alias: "smol #71: scan-all → per-node scan buttons"
    mode: single
    trigger:
      - platform: state
        entity_id: input_button.smol_all_scan
    condition:
      - condition: template
        value_template: "{{ trigger.from_state is not none and trigger.from_state.state != 'unavailable' }}"
    action:
      - service: input_button.press
        target:
          entity_id:
            - input_button.smol_8_scan

  # =====================================================================
  # NODE MANAGER automations (issue #21) — publish the retained per-node config.
  # Trigger = the Apply/Reset input_buttons; payload = <AppKind>:<page> from the
  # closed-set input_selects (so it is always a valid token). "Set all" fans out
  # to every per-node topic (no broadcast). Reset publishes empty = clear.
  # =====================================================================
  - id: smol_nodemgr_8_apply
    alias: "smol nodemgr: id8 apply default screen"
    description: >-
      On the id8 Apply button, publish retained smol/8/config/default_screen.
    mode: single
    trigger:
      - platform: state
        entity_id: input_button.smol_8_apply
    condition:
      - condition: template
        value_template: "{{ trigger.from_state is not none and trigger.from_state.state != 'unavailable' }}"
    action:
      - service: mqtt.publish
        data:
          topic: "smol/8/config/default_screen"
          retain: true
          qos: 0
          payload: "{{ states('input_select.smol_8_screen') }}:{{ states('input_select.smol_8_page') }}"
  - id: smol_nodemgr_8_reset
    alias: "smol nodemgr: id8 reset to board default"
    description: >-
      On the id8 Reset button, publish an EMPTY retained payload (clear).
    mode: single
    trigger:
      - platform: state
        entity_id: input_button.smol_8_reset
    condition:
      - condition: template
        value_template: "{{ trigger.from_state is not none and trigger.from_state.state != 'unavailable' }}"
    action:
      - service: mqtt.publish
        data:
          topic: "smol/8/config/default_screen"
          retain: true
          qos: 0
          payload: ""
  - id: smol_nodemgr_set_all
    alias: "smol nodemgr: SET ALL default screen"
    description: >-
      On the Apply-to-all button, fan the set-all screen+page out to every per-node topic — no
      broadcast topic (ruling #3 / design §2.1). Each per-node retained value is overwritten.
      "EVERY" now means every id DISCOVERED AT RUN TIME, not a list typed into this file (#316).
    mode: single
    trigger:
      - platform: state
        entity_id: input_button.smol_all_apply
    condition:
      - condition: template
        value_template: "{{ trigger.from_state is not none and trigger.from_state.state != 'unavailable' }}"
    # #316 — this fanned out over a HAND-WRITTEN topic list: `smol/7`, `smol/8`, `smol/9`. After the
    # id7/id9 retirement removed the two dead publishes, a button labelled "all" reached exactly ONE
    # board, id8. It never touched id5, id50, id51 or id122.
    #
    # That is a correctness bug, not a cosmetic one, because under-delivery is INDISTINGUISHABLE from
    # a board ignoring the command: press "all", watch one screen change, and the reasonable
    # conclusion is "the others are offline" or "the CFG relay dropped it" — both real failure modes
    # on this fleet, both chased before. The button manufactured a symptom that mimics two genuine
    # bugs.
    #
    # The retire commit put a warning in this automation's own `description:` instead. That was the
    # right thing to do at the time and it was still not a fix: nobody reads an automation's
    # description before pressing a button labelled "all". The label is the contract; the description
    # is a footnote behind two clicks in Settings.
    #
    # Fleet discovery + the empty-fleet guard are deliberately the SAME idiom as smol_bard.yaml's
    # delivery/tale fan-outs, not a second dialect — one shape to learn, and a fix to the shape
    # reaches every user of it. `*` not `?` in the infix quantifier: the live `_status` entities are
    # `sensor.smol_5_aegis_status` / `_50_ember_status` / `_51_sigil_status` beside the bare
    # `sensor.smol_8_status`, and `?` (at most one segment) missed most of the fleet — the exact
    # quantifier bug that caused a whole-fleet blackout in build_control_room.py's resolve_fw.
    #
    # Dormant boards are INCLUDED on purpose: the publish is retained, so a sleeping board picks the
    # value up when it wakes. Same call, and same reasoning, as smol_bard.yaml:143.
    action:
      - variables:
          fleet: >-
            {%- set ns = namespace(ids=[]) -%}
            {%- for e in states.sensor | map(attribute='entity_id') | select('search','^sensor\\.smol_\\d+(_[a-z0-9]+)*_status$') -%}
              {%- set id = e.split('.')[1].split('_')[1] -%}
              {%- if id not in ns.ids -%}{%- set ns.ids = ns.ids + [id] -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.ids }}
          # Built ONCE, outside the loop, so every node gets the identical value — building it per
          # iteration re-reads the helpers and could straddle an operator's second change, which
          # would leave the fleet DISAGREEING as the direct result of a control meant to unify it.
          # Both fields defaulted anyway: `unknown:unknown` is refused by the firmware, so the
          # operator would press "all" and have nothing happen — the same class of silent no-op this
          # issue is about. Defaults MATCH each helper's own `initial:` (Menu / "0", lines 262+267);
          # inventing different ones here would make the button disagree with the control it reads.
          value: >-
            {%- set na = ['unknown', 'unavailable', 'none', ''] -%}
            {%- set s_raw = states('input_select.smol_all_screen') -%}
            {%- set p_raw = states('input_select.smol_all_page') -%}
            {%- set s = 'Menu' if s_raw in na else s_raw -%}
            {%- set p = '0' if p_raw in na else p_raw -%}
            {{ s }}:{{ p }}
      - choose:
          # An empty fleet reaching zero nodes and reporting SUCCESS is the disease this whole
          # campaign is about. `fleet` comes from MQTT-discovery entities, and after an HA restart
          # there is a window before the retained discovery configs replay — a button pressed in that
          # window silently reaches nobody. Say so, loudly. notification_id is per control so it
          # cannot cross-clear smol_bard.yaml's warnings.
          - conditions: "{{ fleet | count == 0 }}"
            sequence:
              - service: persistent_notification.create
                data:
                  notification_id: smol_fanout_empty_set_all
                  title: "smol: Apply-to-all reached NO nodes"
                  message: >-
                    The set-all screen+page button was pressed, but no smol node was discovered at
                    that moment, so nothing was published. This is usually the window just after an
                    HA restart, before the retained MQTT discovery configs replay. Press it again
                    once the fleet is back and this notice will clear itself.
        default:
          # Clears the warning once a fan-out reaches somebody, so a stale notice cannot outlive the
          # condition it described.
          - service: persistent_notification.dismiss
            data:
              notification_id: smol_fanout_empty_set_all
          - repeat:
              for_each: "{{ fleet }}"
              sequence:
                # qos deliberately left at 0, as it has always been for this topic: the bug here is
                # REACH, and quietly changing the delivery guarantee too would blur what this fix
                # proved. Revisit alongside smol_bard.yaml's qos-1 config publishes.
                - service: mqtt.publish
                  data:
                    topic: "smol/{{ repeat.item }}/config/default_screen"
                    retain: true
                    qos: 0
                    payload: "{{ value }}"
  - id: smol_ota_install_id8
    alias: "smol OTA: install staged to id8 (retained)"
    description: >-
      On the id8 OTA-Install button, publish RETAINED smol/8/ota/install = INSTALL.
      RETAINED because the fw does a retained-read on connect (wifi.rs:336/:822) — a bursty
      node (~2s/burst) misses a non-retained publish. The fw self-clears the retained install
      after acting (no re-trigger). The native Update entity stays the "update available"
      indicator; this is the working install trigger until fw discovery adds retain:true (#33 follow-up).
    mode: single
    trigger:
      - platform: state
        entity_id: input_button.smol_ota_install_8
    condition:
      - condition: template
        value_template: "{{ trigger.from_state is not none and trigger.from_state.state != 'unavailable' }}"
    action:
      - service: mqtt.publish
        data:
          topic: "smol/8/ota/install"
          retain: true
          qos: 0
          payload: "INSTALL"

  # --- #70 silent-rollback alert — pushes the instant a node reports ota=rolled-back ---
  - alias: "smol · OTA rolled back → alert (#70)"
    id: smol_ota_rollback_alert
    trigger:
      - platform: state
        entity_id:
          - sensor.smol_8_ota_outcome
        to: "rolled-back"
    action:
      - service: persistent_notification.create
        data:
          title: "smol OTA rollback"
          message: >
            {% set n = trigger.entity_id.split('_')[1] %}
            id{{ n }} rolled back its OTA (slot {{ states('sensor.smol_' ~ n ~ '_boot_slot') }},
            reset {{ states('sensor.smol_' ~ n ~ '_reset_reason') }}).

  # --- #45 publish per-node Custom screen layouts (retained → smol/<id>/config/custom, KV key Y) ---
  # The compose sensor (sensor.smol_<id>_custom_lay) auto-updates on the author string AND any
  # referenced {entity}, so its state-change covers live-refresh; + HA start + a 5-min heartbeat.
  - id: smol_publish_custom_lay
    alias: "smol: publish per-node Custom screen layouts (retained, #45)"
    mode: single
    max_exceeded: silent
    trigger:
      - platform: state
        entity_id:
          - sensor.smol_8_custom_lay
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/5"
    action:
      - repeat:
          for_each: ["7", "8", "9"]
          sequence:
            # #160: a node with an ACTIVE notification (input_text.smol_<id>_notify_wire set) owns
            # config/custom — skip it here so the heartbeat/start republish never WIPES the message.
            # The notify script publishes the notification wire directly; on clear the flag drops and
            # the next republish restores the author-composed layout. Run-time state read = always fresh.
            - if:
                - condition: template
                  value_template: "{{ states('input_text.smol_' ~ repeat.item ~ '_notify_wire') in ['unknown', 'unavailable', 'none', ''] }}"
              then:
                - service: mqtt.publish
                  data:
                    topic: "smol/{{ repeat.item }}/config/custom"
                    retain: true
                    qos: 0
                    payload: "{{ states('sensor.smol_' ~ repeat.item ~ '_custom_lay') }}"

  # --- #55 publish per-node plugin visibility mask (retained → smol/<id>/config/plugins) ---
  - id: smol_publish_plugins
    alias: "smol: publish per-node plugin visibility mask (retained, #55)"
    mode: single
    max_exceeded: silent
    trigger:
      - platform: state
        entity_id:
          - input_boolean.smol_8_plugin_clock
          - input_boolean.smol_8_plugin_snake
          - input_boolean.smol_8_plugin_bench
          - input_boolean.smol_8_plugin_batt
          - input_boolean.smol_8_plugin_grid
          - input_boolean.smol_8_plugin_wled
          - input_boolean.smol_8_plugin_about
          - input_boolean.smol_8_plugin_familiar
      - platform: homeassistant
        event: start
    action:
      - repeat:
          for_each: ["7", "8", "9"]
          sequence:
            - variables:
                n: "{{ repeat.item }}"
                mask: >-
                  {% set b = namespace(m=0) %}
                  {% for name, val in [['clock',1],['snake',2],['bench',4],['batt',8],['grid',16],['wled',32],['about',64],['familiar',128]] %}
                  {% if is_state('input_boolean.smol_' ~ n ~ '_plugin_' ~ name, 'on') %}{% set b.m = b.m + val %}{% endif %}
                  {% endfor %}
                  {{ '%04X' | format(b.m) }}
            - service: mqtt.publish
              data:
                topic: "smol/{{ n }}/config/plugins"
                retain: true
                qos: 0
                payload: "{{ mask }}"
