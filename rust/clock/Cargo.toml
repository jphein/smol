[package]
name = "clock"
version = "0.1.0"
edition = "2021"
# LOWERED 1.96 -> 1.95 by #347 Part 2, because 1.96 was blocking a supported target and had no
# reason to be there.
#
# It is a FLOOR, not a pin: the C3/C5/C6 builds and every gate run on `stable` (1.97.1 today, per
# rust-toolchain.toml's ride-stable policy), and lowering a floor cannot change what they compile.
# What it changes is the ONE toolchain that sits below it — espup's Xtensa fork, which is the only
# rustc that can target `xtensa-esp32s3-none-elf` and is pinned at **1.95.0.0** (byte-identical on
# katana and familiar; the two upgrade in lockstep or a reproducible build stops being one).
#
# So `1.96` was not describing a language requirement, it was silently declaring the S3 unsupported.
# MEASURED, not assumed: with this line at 1.95 the S3 arm compiles `core` from source, builds
# esp-hal 1.1.1 for xtensa, and reaches smol's OWN board code (6 errors in sensors.rs / ota.rs /
# main.rs). Cargo refuses before any of that with `1.96`: "rustc 1.95.0-nightly is not supported...
# clock@0.1.0 requires rustc 1.96".
#
# And 1.96 was never a reasoned choice — `git log -S` puts it in the crate's SCAFFOLD commit
# (2ae697b), alongside the `1.96.1` toolchain pin that rust-toolchain.toml has since removed as "a
# fossil from ONE familiar-side spurious-lint incident". This is the same fossil, one file over.
# Per JP's standing rule that pins are exceptions carrying written reasons, a floor with no reason
# that costs a target is exactly the kind that goes.
#
# ⚠️ RAISE IT AGAIN ONLY WITH A NAMED FEATURE. If something genuinely needs a newer language
# feature, this line moves — but raising it above the Xtensa fork's version drops the S3, so say so
# in the commit and update tools/build-matrix.toml's [chip.esp32s3] row in the same change.
rust-version = "1.95"
description = "smol: ESP32-C3 SuperMini + 0.42\" SSD1306 OLED clock with WiFi/NTP + ESP-NOW"
license = "MIT OR Apache-2.0"

# -----------------------------------------------------------------------------
# Pinned, mutually-compatible crate versions — the #233 MATCHED SET (PR #361,
# landed 2026-08-01):
#
#   esp-hal          1.1    (esp-radio requires ~1.1.0 — 1.2.0-rc.0 does NOT work)
#   esp-radio        0.18   (the esp-wifi RENAME; carries esp32c5 too, see #388)
#   esp-rtos         0.3    (owns the scheduler; the `embassy` executor feature
#                            is enabled on the #335 phase-1 branch, not here)
#   esp-alloc        0.10 · esp-storage 0.9 · esp-bootloader-esp-idf 0.5
#
# The set moves TOGETHER: esp-radio links against esp-hal internal APIs, so a
# lone bump that "passes semver" can still fail to compile or — worse — change
# a private default (that is how the I2C SCL timeout vanished, #387).
#
# HISTORICAL GOTCHA (pre-#233 cluster, kept dated because the NEXT bump will
# look exactly like this): esp-wifi 0.15.x called `Rng::new(peripherals.RNG)`
# internally; esp-hal 1.0.0-rc.1+ changed `Rng::new()` to take no argument, so
# the pair compiled under Cargo's semver check and failed at build. Signature
# arity was the only tell — grep the bumped API's call sites and BUILD it.
#
# ssd1306 0.10.0 + embedded-graphics 0.8 target embedded-hal 1.0, which esp-hal
# 1.x implements, so the display stack composes cleanly with the HAL.
# -----------------------------------------------------------------------------

# The firmware BIN needs the bare-metal crates, so it can only be built when `hw` is on.
# Declaring that to cargo (rather than leaving the target auto-discovered) matters for the
# #300 host tests: cargo builds a package's BINARIES alongside any INTEGRATION test — they
# get `CARGO_BIN_EXE_*` — so `cargo test --features hostsim --test bard` would otherwise try
# to compile `src/main.rs` without esp-hal/ssd1306 and fail with ~14 unresolved imports.
# With `required-features` the bin is SKIPPED under a hostsim-only build, which also makes
# "hostsim compiles NO firmware code" an invariant cargo enforces instead of a convention.
# `default`/`bard`/`wifi`/`espnow`/... all imply `hw`, so every firmware build is unchanged.
[[bin]]
name = "clock"
path = "src/main.rs"
required-features = ["hw"]

# The #300 story batch is a HOST tool: it uses `std` and the hostsim library target, so it can
# only build for a host triple. Declaring that keeps `--all-targets` honest on the firmware
# target (it is skipped instead of failing on `use std`).
[[example]]
name = "bard_stories"
path = "examples/bard_stories.rs"
required-features = ["hostsim"]

[dependencies]
# VENDORED realm-sigil Rust binding (rust/sigil-names). A path dep INSIDE this repo, so it builds
# for everyone — unlike a path dep to ~/Projects/realm-sigil, which builds on one machine. Zero
# transitive deps and no_std, so it adds nothing to the pinned esp-hal lockfile but itself.
# `default-features = false` is explicit: smol must never get the divergent themed realms.
sigil-names = { path = "../sigil-names", default-features = false }
# --- Core HAL (Phase 1, always on) ---------------------------------------
# `unstable` is required for I2C/SPI/RNG and is also a hard requirement of
# esp-wifi. `esp32c3` selects the chip. `rt` + `exception-handler` come from
# the default features (runtime + fault handler).
esp-hal = { version = "1.1", features = ["unstable"], optional = true }
# NOTE: esp-hal's default features already install the exception handler, so
# esp-backtrace only provides the panic handler + backtrace printing here.
# Enabling esp-backtrace's `exception-handler` too causes a duplicate
# `ExceptionHandler` symbol and an LTO bitcode-load failure at link time.
esp-backtrace = { version = "0.19", features = ["panic-handler", "println"], optional = true }
# Force the USB Serial/JTAG backend explicitly. This board's console is the
# native USB Serial/JTAG link (/dev/ttyACM0); esp-println's default `auto`
# backend only routes to USB-JTAG when it detects host SOF packets at the
# instant it writes, which proved unreliable during the busy WiFi burst and
# left app logs going to the (unwired) UART0. `jtag-serial` pins the output to
# USB-JTAG so boot/WiFi/NTP/ESP-NOW logs always appear on /dev/ttyACM0.
esp-println = { version = "0.17", default-features = false, optional = true, features = [
    "log-04",
    "jtag-serial",
    "colors",
    "critical-section",
] }
log = "0.4"
# `nb::block!` turns esp-hal's non-blocking `Adc::read_oneshot` (nb::Result) into
# a short busy-wait for the battery-voltage read in `src/sensors.rs`. Resolves to
# the 1.1.0 already in the tree (embedded-hal etc. depend on it) — no lock churn.
nb = "1"
# bard (#300): float intrinsics (expf/cosf/sinf) for the no-FPU RV32IMC — pure Rust, no_std.
# default-features=false is load-bearing: it keeps libm's `arch` feature off so host tests and
# the device run the SAME soft-float code paths (the T6 golden-baseline comparison depends on it).
libm = { version = "0.2", optional = true, default-features = false }

# --- Display stack (Phase 1) ---------------------------------------------
# ssd1306 is the concrete panel driver — HAL-facing (I2C), so it rides `hw`.
# embedded-graphics is pure (target-agnostic) and stays ALWAYS-on: both the
# firmware AND the #152 host/wasm emulator draw through it.
ssd1306 = { version = "=0.10.0", optional = true }
embedded-graphics = "=0.8.2"

# --- WiFi / NTP + radio (Phase 2, feature = "wifi") ----------------------
esp-alloc = { version = "0.10", optional = true }
# #233: the preemption scheduler that backs esp-radio's `esp_radio_preempt_*` os-adapter
# hooks. In the old stack this was esp-wifi's in-crate `builtin-scheduler`; in the 0.18
# stack it moved OUT to esp-rtos. We enable ONLY its `esp-radio` + `esp-alloc` drivers
# (NOT `embassy`) — smol stays a blocking superloop, and `esp_rtos::start()` turns main()
# into the scheduler's pinned main task, so the existing blocking code runs as-is.
esp-rtos = { version = "0.3", optional = true, features = [
    "esp-radio",
    "esp-alloc",
    "log-04",
] }
# esp-wifi RENAMED → esp-radio in 0.18. `unstable` unlocks the raw rx/tx tokens
# (our smoltcp shim) + the `esp_now` interface. `default-features = false` drops
# esp-radio's default `esp-alloc` so we re-add it explicitly.
esp-radio = { version = "0.18", optional = true, default-features = false, features = [
    "wifi",
    "esp-alloc",
    "unstable",
    "log-04",
] }
# #141 TX-power clamp + AP-info readback use raw esp-idf bindings. esp-radio's
# `sys` module is pub(crate), so we depend on the per-chip bindings crate directly
# and alias it to `esp_wifi_sys` — net.rs keeps `esp_wifi_sys::include::…` verbatim.
#
# #347: that alias used to be `package = "esp-wifi-sys-esp32c3"` — a hardcoded chip in a place a
# feature CANNOT reach, because `esp-wifi-sys` is four separate PACKAGES rather than one package
# with a chip feature, and cargo resolves `package =` before it knows any features. So the choice
# moved into `rust/esp-wifi-sys-chip`, which owns all four aliases behind its own chip features.
#
# The KEY is still spelled `esp-wifi-sys`, so `esp_wifi_sys::include::…` in net.rs is unchanged
# character for character. The dep stays optional and is pulled by `wifi` (the RADIO half); the chip
# arm is forwarded by the chip feature with the WEAK form `esp-wifi-sys?/esp32cX` (the CHIP half).
# That indirection is not taste — it is the only way to express `chip AND radio`, and getting it
# wrong would link the Espressif blob archives into the `default` tier, which links none today.
# Full derivation in rust/esp-wifi-sys-chip/src/lib.rs.
esp-wifi-sys = { package = "esp-wifi-sys-chip", path = "../esp-wifi-sys-chip", optional = true, default-features = false }
# #233: esp-radio 0.18 made connect/disconnect/scan ASYNC-only (no blocking variants).
# smol is a synchronous superloop, so we drive those futures to completion with
# embassy-futures' busy-loop `block_on` (no executor needed; the esp-rtos scheduler
# preempts the busy loop to run the radio task that posts the completion events).
embassy-futures = { version = "0.1", optional = true }
smoltcp = { version = "0.13", optional = true, default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "proto-dhcpv4",
    "socket-udp",
    "socket-dhcpv4",
    "socket-tcp",
] }

# --- OTA (Phase B, issue #6) — HAL-decoupled, folded into `wifi` ----------
# Spike-proven co-compile with the pinned quartet (WAVE 10). Both are optional
# and pulled ONLY by `wifi`, so the `default` (no-radio) build compiles NO OTA
# code. `esp32c3` on esp-bootloader-esp-idf is REQUIRED — without it the crate's
# rom.rs references an unresolved `esp_rom_sys` (md5/crc pulled by the chip
# feature). esp-storage gives XIP-safe flash writes (FlashStorage auto-detects
# 4 MB); esp-bootloader-esp-idf gives the otadata slot/state API + esp_app_desc!.
esp-storage = { version = "0.9", optional = true, features = [] }
esp-bootloader-esp-idf = { version = "0.5", optional = true, features = [] }
# Software SHA-256 for the OTA image integrity gate. Chosen over the HW `esp_hal::sha`
# peripheral deliberately: the HW path needs the SHA peripheral threaded through boot
# into the OTA burst + a self-referential `ShaDigest` (borrows the `Sha` beside it),
# whereas `sha2` is peripheral-free + move-friendly. Cost is ~4 KB flash — still negligible,
# and the slot has room again: #300's Bard model took the canonical image from ~590 KB to
# 1,432,400 B (70.5% of a 0x1F0000 / 2,031,616 B slot), and #347 took the Bard back off the
# fleet tier, measuring ~1,155,700 B — 56.9%, 1.76x headroom, ~855 KiB spare (2026-08-01).
# #348: that last figure is TREE-DEPENDENT to ~128 B — the git-ignored board.rs/secrets.rs are
# provisioned per tree and their literals sit in .rodata/.data (1,155,648 here vs 1,155,776 with
# the ci_provision.sh templates). Don't reconcile it against another doc's copy; recompute.
# Recompute rather than trusting this line: slot / actual image size; `ota_publish.sh`
# hard-gates size <= 0x1F0000, so an overflow fails the publish, not a board.
# Hashing is bound by the ~1.2 MB HTTP download, not the digest, so there is still no
# throughput reason to prefer the HW peripheral here. (spec §Stage C-4.)
sha2 = { version = "0.11", default-features = false, optional = true }
# The `NorFlash` trait (erase/write) whose impl on esp-storage's FlashStorage the OTA
# ImageWriter drives. Trait-only crate; pin to the 0.3.x esp-storage already links.
embedded-storage = { version = "0.3", optional = true }
# #32 OTA authenticity: Ed25519 VERIFY-ONLY over the signed manifest ("build|size|sha256").
# no_std, pure-Rust, no getrandom/curve25519 (self-contained) — spike-proven co-compile vs the
# pinned quartet on riscv32imc (issue-32-spike-result.md). Gated in `espnow` (only run_ota_fetch
# verifies) → default/wifi-only builds pull NO crypto. ⚠️ REQUIRES the opt-z per-pkg override in
# [profile.release.package.ed25519-compact] below — without it the scalar-mult unrolls to ~1.19 MB.
ed25519-compact = { version = "2", default-features = false, optional = true }

# --- ESP-NOW (Phase 3, feature = "espnow") -------------------------------
# ESP-NOW support lives inside esp-wifi behind its `esp-now` feature.
# (No extra top-level crate; the feature is toggled on esp-wifi below.)

[features]
# ── CHIP TARGETS (#347 / #331). EXACTLY ONE must be enabled. ───────────────────────────────────
#
# Every `esp-*` declaration above used to carry `features = ["esp32c3", …]`. A chip named in EIGHT
# dependency declarations is not a target, it is a transplant: adding a second board meant editing
# eight lists in lockstep and there was nothing to check that you had. Now the chip is named ONCE,
# here, and fans out.
#
# ⚠️ THE INVARIANT THAT MAKES PER-CHIP ARMS LEGAL AT ALL:
#
#   esp-hal accepts exactly ONE chip feature, and cargo UNIFIES features across a workspace.
#   Four arms in one manifest is nonetheless fine, because EVERY BUILD INVOCATION IS SINGLE-CHIP:
#   the features and the target triple are chosen together, per invocation, and a build carrying
#   two chip features is refused below rather than resolved.
#
#   What this manifest can therefore never do is build two chips AT ONCE, or share a cargo
#   workspace graph with a crate compiled for a different chip. That is why `rust/sigil-names` and
#   `rust/esp-wifi-sys-chip` declare their own `[workspace]` (see either file): a riscv crate and an
#   xtensa crate in one graph would hand esp-hal two chips, and no amount of care in THIS file
#   would help. Shared logic crosses that boundary as chip-agnostic, zero-dep, host-testable
#   crates consumed BY PATH — the shape emberburrito proved on its own C3+S3 tree.
#
# ⚠️ WEAK (`?/`) FORWARDING IS LOAD-BEARING, NOT STYLE. `esp-hal?/esp32c3` means "if esp-hal ends up
# enabled, turn on its esp32c3 feature". The plain form `esp-hal/esp32c3` would additionally ENABLE
# the optional dependency — which would drag every bare-metal crate into the `hostsim` build and
# destroy #152's host-emulator boundary, and would drag the radio + OTA crates into the `default`
# tier. Every forward below is weak for that reason. The chip is a FACT about the build; it must not
# be a reason for a crate to appear.
#
# A chip feature also supplies the board-independent CAPABILITY features for that silicon (see
# below). Adding a fifth chip is: one arm here, one `ChipBudget` row in src/budget.rs, one
# `[chip.*]` row in tools/build-matrix.toml. The checker asserts the last two agree.
esp32c3 = [
    "esp-hal?/esp32c3", "esp-backtrace?/esp32c3", "esp-println?/esp32c3",
    "esp-rtos?/esp32c3", "esp-radio?/esp32c3",
    "esp-storage?/esp32c3", "esp-bootloader-esp-idf?/esp32c3",
    "esp-wifi-sys?/esp32c3",
    "has-tsens", "has-reset-glitch-split",
]
esp32c5 = [
    "esp-hal?/esp32c5", "esp-backtrace?/esp32c5", "esp-println?/esp32c5",
    "esp-rtos?/esp32c5", "esp-radio?/esp32c5",
    "esp-storage?/esp32c5", "esp-bootloader-esp-idf?/esp32c5",
    "esp-wifi-sys?/esp32c5",
    "has-ieee802154", "has-reset-glitch-unified",
]
esp32c6 = [
    "esp-hal?/esp32c6", "esp-backtrace?/esp32c6", "esp-println?/esp32c6",
    "esp-rtos?/esp32c6", "esp-radio?/esp32c6",
    "esp-storage?/esp32c6", "esp-bootloader-esp-idf?/esp32c6",
    "esp-wifi-sys?/esp32c6",
    "has-ieee802154", "has-tsens",
    # NO glitch marker: the C6 is the chip that reports no glitch reason AT ALL. See
    # `has-reset-glitch-split` below — the absence is the measured fact, not an omission.
]
esp32s3 = [
    "esp-hal?/esp32s3", "esp-backtrace?/esp32s3", "esp-println?/esp32s3",
    "esp-rtos?/esp32s3", "esp-radio?/esp32s3",
    "esp-storage?/esp32s3", "esp-bootloader-esp-idf?/esp32s3",
    "esp-wifi-sys?/esp32s3",
    "has-psram", "has-reset-glitch-split",
    "hal-cpu-reset-unindexed",
    # NO `has-tsens`. This arm CARRIED it in the first draft of this commit, from a datasheet-shaped
    # assumption that the big chip has at least what the little one has. A per-chip `cargo check` on
    # familiar's xtensa toolchain said otherwise: `esp_hal::tsens` is unresolved for
    # xtensa-esp32s3-none-elf on esp-hal 1.1.1, exactly as on the C5. Left as a comment rather than
    # silently corrected, because "the superset chip has the peripheral" is the specific wrong
    # instinct this whole layer exists to stop anyone acting on. MEASURE the chip.
]

# ── HARDWARE CAPABILITIES ──────────────────────────────────────────────────────────────────────
#
# Empty markers, existing to be `cfg`'d on. Chips select capabilities; code predicates on the
# capability, never on the chip name — the OpenWrt model (`low_mem`, `small_flash`) that
# src/budget.rs documents and that the esp32c6-watch's `has-pmu`/`has-imu`/`has-audio` seam
# already runs in this house.
#
# ── WHERE smol DIVERGES FROM THE WATCH, AND WHY ────────────────────────────────────────────────
#
# The watch's seam is TWO layers: a `board-*` feature supplies the chip AND the capabilities, so
# `board-waveshare-c6` and `board-cyd-c5` are the user-facing choice. smol has only the chip layer
# and deliberately grows no `board-*` features. That is not a shortcut — the two repos put the
# board/chip line in genuinely different places:
#
#   * The watch is ONE board per image. Its panel geometry is compile-time (Slint scenes are
#     absolute-positioned per panel, so build.rs picks a different scene root per board), so a
#     board IS a build.
#   * smol is "fat image / thin runtime config" (#72). A board announces what it is at RUNTIME:
#     `BoardProfile` (#352) is selected from `SELF_CHIP` plus an I2C display PROBE, node identity
#     comes from a runtime id, and the #72 pin-map arrives over the air. Two smol boards on the
#     same silicon run the SAME binary on purpose.
#
# So at smol the only thing that must be compile-time is what the SILICON fixes, and that is
# exactly the chip feature and the capabilities it implies. A `board-*` layer here would compile in
# a fact the runtime already discovers better, and would fork the fleet image per board — the one
# property the OTA story depends on not doing.
#
# ⚠️ Correspondingly, DO NOT add capability features for things BoardProfile probes. `has-display`
# would be exactly that mistake: it is a runtime I2C probe today (`BoardProfile::for_self(has_display)`),
# and freezing it into the feature set would make one image per board variant.

# 802.15.4 radio (Thread/Zigbee PHY): the C6 and the C5 have one, the C3 and S3 do not. Marker
# only — it deliberately does NOT forward to `esp-radio/ieee802154`, and MUST NOT.
#
# ⚠️ `esp-radio`'s build script HARD-PANICS when `esp-now` and `ieee802154` are enabled together
# (the same class of refusal as the `coex`-without-`ble` error documented on the `espnow` feature
# below). smol's mesh IS ESP-NOW on every tier that has a radio, so a build that turned this marker
# into the real esp-radio feature would fail at build-script time on the two chips that own the
# capability — i.e. enabling a C6's headline feature would break the C6. The Zigbee-bridge role
# (#331 / the NM-CYD-C5's 802.15.4 role) therefore needs a tier where the mesh transport is NOT
# ESP-NOW, which is a protocol decision and not a feature-flag one. Until then this marker records
# that the silicon has the radio, and nothing links it.
has-ieee802154 = []

# Octal/quad PSRAM (the S3's 8 MB). Marker only; the amount and mode are NOT expressible here.
#
# ⚠️ PSRAM mode is a RUNTIME `PsramConfig` field in esp-hal 1.1.x, NOT a cargo feature and NOT an
# `ESP_HAL_CONFIG_*` env knob. A research doc in the emberburrito tree asserted both and was
# disproven on hardware; write the mode in code where the config struct is built.
#
# ⚠️ AND THE ONE THAT SILENTLY CORRUPTS: `esp-radio`'s heap must NEVER live in PSRAM on the S3.
# The radio blobs use atomics that do not work against PSRAM, and the failure is not a panic — it
# is wrong data. `net::init_heap` must keep the radio heap in internal DRAM and add PSRAM as a
# separate region if at all. Recorded at the feature that makes PSRAM reachable, because the
# temptation ("8 MB of heap, why is the heap still 128 KiB") arrives with the feature.
has-psram = []

# ── The two markers that GATE REAL CODE (#347 Part 2) ──────────────────────────────────────────
#
# Worth stating plainly, because the four above are declarations and these two are not: everything
# from `has-ieee802154` up records a fact and links nothing. The markers below are read by
# `src/ota.rs` and `src/sensors.rs`, and they are the reason the has-* layer is a mechanism rather
# than a vocabulary. They were derived from a MEASURED per-chip `cargo check`, not from a datasheet
# reading — see the tables in each block.

# Internal temperature sensor (`esp_hal::tsens` + `peripherals::TSENS`).
#
# esp-hal gates the whole module behind `#[cfg(soc_has_tsens)]`, so on a chip without it the C3's
# `src/sensors.rs` imports are not a type error but an UNRESOLVED IMPORT — the module does not
# exist. MEASURED on esp-hal 1.1.1, one `cargo check` per chip: **C3 ✓, C6 ✓, C5 ✗, S3 ✗**.
#
# The S3 being a ✗ is the entry worth reading twice: it is the biggest chip of the four and it does
# not expose the sensor the smallest one does. Half of this table is counter-intuitive, which is the
# argument for the table.
#
# ⚠️ The C5 is the odd one out, and this marker does NOT yet make the C5 compile. `sensors.rs`,
# `main.rs`'s `peripherals.TSENS` wiring and the `Sensors::new` signature still assume the sensor
# exists unconditionally; giving them `#[cfg(feature = "has-tsens")]` arms plus a no-sensor
# fallback is #388's board-bring-up work, tracked in tools/build-matrix.toml's [chip.esp32c5]
# `blocked_on`. What this marker does is make that work a matter of ADDING cfg arms against a
# predicate that already exists and is already correct on the other three chips — rather than
# inventing the predicate at the same time as the fallback, which is how a bring-up ends up
# spelling `#[cfg(feature = "esp32c5")]` in a sensors module and re-pinning the chip #347 just
# un-pinned. Declared ahead of its consumer ON PURPOSE, and that is the exception to the rule
# above, not a new default.
has-tsens = []

# Glitch-detector reset reporting, in the SoC's `SocResetReason` enum. THREE shapes, not two, which
# is why this is a pair of markers and not one boolean — MEASURED against esp-hal 1.1.1's
# per-chip `rtc_cntl/rtc/*.rs`:
#
#   | chip           | variants                                          | marker          |
#   |----------------|---------------------------------------------------|-----------------|
#   | C3, S3         | `SysClkGlitch` = 0x13 AND `CorePwrGlitch` = 0x17  | -split          |
#   | C5             | `PowerGlitch`  = 0x19 only                        | -unified        |
#   | C6             | **none at all**                                   | *neither*       |
#
# A chip selecting NEITHER is a legal, meaningful state: `src/ota.rs`'s match arm compiles out and
# a glitch reset falls through the existing `Some(_) => "other"`. That is honest — the C6 does not
# distinguish it in hardware, so there is nothing for the token to report. This is exactly why the
# predicate is a capability and not `cfg(feature = "esp32c6")`: "has no glitch detector" is a fact
# about silicon that a future fifth chip may share, and it should not have to be re-discovered.
#
# ⚠️ DEFERRED, NOT DONE: the C5 also has `CpuLockup` = 0x1A, which the C3 lacks and which nothing
# maps — it falls to "other". Correct but lossy, and it needs its own marker. Left undone because
# there is no C5 board to read a DIAG off yet (#388); recorded here so it is a task rather than a
# caveat that reads as handled. `reset_reason_token()` is NOT chip-complete.
has-reset-glitch-split = []
has-reset-glitch-unified = []

# ── HAL API FACTS — `hal-*`, a DIFFERENT namespace from `has-*`, on purpose ─────────────────────
#
# `has-*` means "the silicon has a thing". This namespace means "esp-hal spells a thing
# differently for this chip" — no silicon difference at all. The first tenant is the S3's
# CPU-scoped reset reasons: esp-hal drops the core index (`CpuSw`/`CpuMwdt0`/`CpuMwdt1`/
# `CpuRtcWdt` where the C3/C5/C6 have `Cpu0*`), at IDENTICAL discriminants (0x0C/0x0B/0x11/0x0D).
# `reset_reason_token()` in src/ota.rs predicates its match arms on this instead of on a chip
# name. The namespace was deliberately NOT invented during the de-pin (#347 Part 2 left it as a
# named decision, see the reset_reason_token doc) — it lands here, with the S3 arm that needs it
# (#398/#331). Spending a `has-*` marker on a spelling would make that layer's one guarantee
# unreliable; a chip-name cfg in ota.rs would re-pin what #347 just un-pinned. This is the third
# door.
hal-cpu-reset-unindexed = []

# Phase 1 only: clock on the OLED. `default` = `hw` so `cargo build --release` with no
# flags is the guaranteed-green firmware baseline — BYTE-IDENTICAL to before the #152
# split (the bare-metal crates were non-optional before; now they ride `hw`, which
# `default` and every firmware tier pull, so the same deps + code compile).
#
# #347: `esp32c3` joins it, so `cargo build --release` with no flags is still a C3 image and still
# byte-identical — the chip moved from eight dependency declarations into one feature, and feature
# resolution is a set union, so the resolved set is unchanged. That equality is MEASURED, not
# argued: section sizes + `nm` against the pre-#347 artifact, reported on the PR.
#
# ⚠️ Consequence worth knowing before you type it: because the chip rides `default`, building for
# another chip needs `--no-default-features` and the tier spelled out, or you get TWO chip features
# and the refusal in src/budget.rs. See the per-chip invocations in tools/build-matrix.toml.
default = ["esp32c3", "hw"]

# #152 host-emulator boundary. The bare-metal crates (esp-hal / esp-backtrace /
# esp-println / ssd1306) are `optional` so a NON-hardware target (the `hostsim` wasm lib)
# builds the pure game/render cores without them. `hw` re-bundles them; it is implied by
# `default` + `wifi` (⊃ espnow/io/cast/wled), so no firmware build changes.
hw = ["dep:esp-hal", "dep:esp-backtrace", "dep:esp-println", "dep:ssd1306"]

# #152 web emulator: compile the crate's LIBRARY (src/lib.rs) exposing ONLY the pure
# plugin/render cores (app contract + snake + clock + input Press + sensors/units host
# stubs) for a host/wasm target — NO `hw` crates, NO radio. Used solely by the `web-emu`
# cdylib; the firmware BIN (src/main.rs) is never compiled under this feature. Every
# hostsim change in the shared source is `#[cfg(feature="hostsim")]`/`#[cfg(not)]`, so the
# firmware (hw) path is untouched. See src/lib.rs.
hostsim = ["dep:libm"]

# #72 IO/component registry (ESPHome inverted, "fat image / thin runtime config").
# Compiles the digital-`Flex` driver menu into ONE image; a runtime pin-map relayed
# over the #56 keyed-CFG `G` channel selects which driver binds each free GPIO at
# boot — no recompile. Default-OFF so the default/wifi/espnow builds stay BYTE-FREE
# of it (#44): `src/io.rs` is gated at its `mod io;` declaration (main.rs) and every hook
# is cfg-gated. (This line said `src/io.rs` carries `#![cfg(feature = "io")]`; it does not —
# same effect, wrong citation, corrected while #351 made the CLAIM checkable.)
# Implies `espnow`: the pin-map's transport (the CfgTracker relay + `take_cfg_offer`
# apply) lives in the ESP-NOW radio manager, and the fleet runs espnow end-to-end.
# v1 = digital in/out only (the provably-feasible `Flex` case); ADC/PWM/WS2812-RMT
# are deferred to v1.5/v2 behind the §2.4 bind-time spike.
io = ["espnow"]

# Phase 2: WiFi STA + SNTP time sync (+ optional weather).
# Also carries OTA (issue #6): the flash/otadata crates + esp-backtrace's
# `custom-halt` (panic→software_reset, MF-2) are pulled in HERE, not on the base
# esp-backtrace dep, so the `default` build's panic behavior stays the stock
# loop{} (OTA rollback semantics only matter once there's a radio to fetch over).
wifi = [
    "hw", # #152: every firmware tier carries the bare-metal crates (byte-identical to before)
    "dep:esp-alloc",
    "dep:esp-rtos",
    "dep:esp-radio",
    "dep:esp-wifi-sys",
    "dep:smoltcp",
    "dep:embassy-futures",
    "dep:esp-storage",
    "dep:esp-bootloader-esp-idf",
    "dep:sha2",
    "dep:embedded-storage",
    "esp-backtrace/custom-halt",
]

# Phase 3: ESP-NOW peer messaging + WiFi<->ESP-NOW switching.
# Builds on `wifi` (shares the radio init path) and turns on esp-wifi/esp-now.
# NOTE (#233): we deliberately do NOT enable esp-radio's `coex` feature. `coex` is the
# cross-radio (WiFi+BLE) coexistence arbiter and esp-radio's build script HARD-ERRORS if
# `coex` is set without `ble`. smol's WiFi<->ESP-NOW coexistence (#40/#23) is SAME-RADIO
# channel management (both live in the WiFi domain), not cross-radio arbitration — the old
# esp-wifi 0.15 build never enabled coex either. Pulling BLE in would also wedge the C3 in
# ROM (btdm init busy-wait — see the "native BLE refuted on C3" finding). So: esp-now only.
espnow = ["wifi", "esp-radio/esp-now", "dep:ed25519-compact"]

# #181/#184 mesh-ledger key PROVISIONING (a JP-supervised USB-touch build, NOT for the fleet OTA
# image). Enables the one-shot NVS seeding of the ed25519 signing key from a build-time
# `SMOL_LEDGER_SEED` (hex, supplied out-of-band, NEVER committed). The default / OTA image omits this
# feature → it only ever READS an already-provisioned key. NO key generation in the firmware or CI.
ledger-provision = ["espnow"]

# #25 WLED WiZmote-emit: smol impersonates a WLED "linked remote" (13-B WiZmote
# ESP-NOW broadcast). Needs the ESP-NOW broadcast path + RadioManager, so it builds
# on `espnow`. Nothing new links — pure encode + the existing `esp_now.send`. The
# default build is BYTE-FREE of it (net/wled.rs is `#![cfg(feature = "wled")]` and every
# hook is `#[cfg(feature = "wled")]`). Since #351 that is CHECKED, not asserted:
# `tools/check_exclusions.py` links each tier and reads its DWARF line table, and the
# default tier contributes no row from net/wled.rs. "Symbol-absence provable" was the old
# wording and was the weaker claim — under fat LTO an inlined module leaves no symbol while
# its bytes are very much there, which is why the line table is the instrument.
wled = ["espnow"]

# #26 smol Cast: mirror the gateway's OLED image onto a network WLED matrix as
# realtime UDP pixels (DNRGB, :21324) — NOT ESP-NOW (cleaner than #25's control path).
# Builds on `espnow` (⊃ `wifi`): casting is a GATEWAY-role activity — it needs an
# associated STA to reach the matrix AND the recurring gateway flush that carries the
# stream, both of which only the espnow build has (a wifi-only board only associates
# once at boot). Pure-additive: NO new crate links — a DrawTarget tee mirrors the
# framebuffer, a pure packer encodes DNRGB, and the existing flush association carries
# it. The default / wifi / espnow builds are BYTE-FREE of it (`net::cast*` is
# `#[cfg(feature = "cast")]` and every hook is cfg-gated; the `Oled` type only swaps to
# the tee under this flag) — checked per tier by #351's `tools/check_exclusions.py`.
# NOTE: this line used to include `wled` in that list. It no longer can: since #350 the
# `wled` TIER is `wled,${canonical}` and the canonical fleet features include `cast`, so a
# wled build DOES carry the cast code. The claim was about a hypothetical `--features wled`
# alone; the exclusion checker judges the tiers that are actually built, and would have
# called this false. Narrowed rather than waived.
cast = ["espnow"]

# ── bard (#300): on-device tiny-LLM storyteller ─────────────────────────────
# Radio-free: rides `hw` only, so it can ship in every tier incl. `default`.
# Pulls no alloc — the core is static-buffer only (spec §5).
# ⚠️ SINCE #348 this feature is PREDICATED on the chip's declared memory budget
# (src/budget.rs): `--features bard` is a COMPILE ERROR on the C3, because the model's
# 39,072 B of DRAM does not fit the 32,352 B a C3 has left after the radio stack and the
# stack floor. That is #347's decision made permanent — it was one word in
# tools/repro_build.sh that anyone could re-add. The feature STAYS here: the S3 and C6
# have the DRAM to carry it as an ordinary smol feature (OpenWrt's `DEFAULT := n` — the
# definition stays, the default flips), and `bard` still gets a CI tier.
bard = ["hw", "dep:libm"]

# ── #348 budget waiver ───────────────────────────────────────────────────────
# Declares "this build is NOT the C3 fleet image, so the fleet baseline the budget was
# measured against does not apply" — which is the honest reason a build may exceed it, and
# the only one. Two in-tree users, both deliberate:
#   * tools/gate.sh's `bard` tier, which exists to keep the Bard compiled + linted for the
#     bigger chips (#347). Without this the tier that keeps a feature alive would be the
#     thing the guard kills.
#   * a future Bard-only / S3 image (#347 Phase 3), which carries no radio stack and so has
#     a different baseline entirely.
# It is NOT an "ignore the guard" switch: `repro_build_bin` REFUSES to package a build that
# names it, so a waived image cannot become a published OTA artifact. (OpenWrt keeps the
# same split — `sysupgrade -F` is a documented escape hatch, and it is separate from the
# gate that decides suitability.)
off-fleet = []

# #300 BENCH ONLY — stack high-water measurement (src/bard/stack_paint.rs). Paints the unused
# stack with a sentinel at boot and reports how deep the story actually went, turning "14240 B
# should be enough" into a measured number. Deliberately NOT in the canonical fleet list in
# tools/repro_build.sh: it writes the whole free stack at boot, which is a diagnostic cost no
# shipped image should pay.
#
# #350: `off-fleet` is part of the feature, not something each call site has to remember. This
# build is BY DEFINITION not the fleet image — see the paragraph above — so it must carry #348's
# waiver or the budget predicate refuses to compile it. Without this, `--features stack-paint`
# fails outright with "`bard` does not fit this chip's declared DRAM budget", which took the
# bench instrument that MEASURES the high-water the stack floor is derived from and made it
# unbuildable. Nothing noticed, because no tier compiled it. Declaring the waiver here means the
# next person to reach for the instrument finds it working.
stack-paint = ["bard", "off-fleet"]

# COEXIST SOAK (issue #23 PART 1 — the gating experiment, NOT for production).
# The gateway stays WiFi-associated after boot (no switch to ESP-NOW time-share),
# the mesh rides the AP channel (pinned to ch1 = north-bedroom), and mesh + MQTT
# flushes run CONCURRENTLY while the Bench beacon seq-gap loss/RTT is logged to
# serial. Builds on espnow. Everything it changes is `cfg(feature = "coexist-soak")`.
coexist-soak = ["espnow"]

# #13 MESH-TEST rig (NOT for production). A debug-only MAC deaf-list: a node silently
# drops inbound frames whose source MAC is in the per-board `board::DEAF_MACS`, so the
# 3-board fleet can be forced into a 2-hop topology (G→R→F) to validate routed multi-hop
# (scratch/smol-dreamteam/13-rig-design.md). Builds on espnow. Default-OFF so a production
# build is BYTE-FREE of it AND structurally CANNOT be made deaf (no field, no hook) — the
# strongest guard against a "won't-rejoin" leftover-deaf ghost. DIAG surfaces deaf=/ddrops=.
mesh-test = ["espnow"]

[profile.release]
# esp-wifi strongly recommends opt-level "s"/2/3 and LTO; the radio blobs are
# timing-sensitive and misbehave when built at opt-level 0.
opt-level = "s"
lto = "fat"
codegen-units = 1
overflow-checks = false

# 🟥 #32 BUILD GATE (MANDATORY — spike-proven, issue-32-spike-result.md): without this,
# ed25519-compact's `double_scalarmult_vartime` inlines/unrolls under opt="s"+fat-LTO into a
# single ~1 MB function → total ed25519 symbols ~1.19 MB → the OTA image overflows the slot
# (0x1F0000). opt="z" collapses it 32× (~93 KB) → production image ~37% of slot. Per-PACKAGE
# only: the global stays opt="s" (the radio blobs' required timing). Verify runs once per OTA
# (~ms) on PUBLIC data, so size-over-speed here is free (constant-time not a concern).
#
# ⚠️ THE CONDITION MOVED (2026-08-25, #398): the hazard above is stated for opt="s"+fat-LTO,
# and the S3 builds at opt-level 2 (a per-chip TOOLCHAIN-BUG workaround — see
# tools/build-matrix.toml [chip.esp32s3]), which is OUTSIDE those stated conditions. Measured
# at opt=2/fat on the S3: `double_scalarmult_vartime` = 43,475 B — this per-package opt="z" is
# independent of the global and still in force, so the PROTECTION holds; but that measurement
# is evidence the gate works, NOT a re-derivation of the premise. If opt-level ever changes
# again (any chip), re-measure the symbol — do not inherit this paragraph.
[profile.release.package.ed25519-compact]
opt-level = "z"

[profile.dev]
opt-level = "s"
