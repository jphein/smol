[package]
name = "sigil-names"
version = "0.1.0"
edition = "2021"
description = "VENDORED copy of realm-sigil's Rust binding. src/ is byte-identical upstream; do not edit."

# #347: DECLARED as its own workspace root, not merely positioned as one.
#
# esp-hal accepts exactly one chip feature and cargo unifies features across workspace members, so
# a riscv crate and an xtensa crate cannot share a workspace graph. `rust/clock` is its own root and
# absorbs path dependencies only from INSIDE its directory — this crate is beside `clock`, not under
# it, so it was never a member (verified: `cargo metadata --no-deps` in rust/clock reports one
# member). But that made a load-bearing invariant depend on where a directory sits, and the symptom
# of breaking it is an esp-hal build-script error about two chips, which names neither this crate nor
# the move that caused it. `[workspace]` pins the boundary regardless of position. Same line, same
# reason, in rust/esp-wifi-sys-chip — the chip-AGNOSTIC crate and the chip-DEPENDENT one both have
# to stay out of the firmware's feature-unification graph.
[workspace]

# ⚠️ VENDORED, NOT AUTHORED HERE. `src/lib.rs`, `src/realms.rs` and `src/reserved.rs` are
# byte-identical copies of realm-sigil's `rust/src/`. Edit them THERE, regenerate with
# `./sync-words.sh --only rust`, then re-vendor with `tools/sigil_vendor.sh --sync`.
#
# WHY vendored rather than a dependency: smol is a PUBLIC repo, so a `path` dependency on
# ~/Projects/realm-sigil builds on JP's workstation and nowhere else, and a `git` dependency needs
# the upstream commit pushed — which is JP's call. Vendoring is the only shape that builds for
# everyone today. `tools/sigil_vendor.sh --check` is what keeps it from becoming the very drift it
# replaced: it diffs against upstream when the sibling repo is present, and verifies a committed
# sha256 manifest when it is not, so CI can catch in-tree tampering with no sibling checkout.
#
# When realm-sigil is pushed, swap this for
#   sigil-names = { git = "https://github.com/jphein/realm-sigil", ... }
# and delete this directory. The vendor is a bridge, not a destination.
#
# Deliberately OUTSIDE both `rust/clock` and `rust/viz` workspaces (they are kept separate so the
# no_std firmware never entangles the host tools' lockfile — see rust/viz/Cargo.toml). This crate is
# path-depended by both. It is safe to share precisely because it has ZERO dependencies and is
# no_std: it adds nothing to either lockfile but itself.

[lib]
name = "sigil_names"
path = "src/lib.rs"

[dependencies]

[features]
# Node identity + creatures only. smol must NEVER enable `divergent-themed-realms`: its version names
# come from the deliberately-pinned FORGE table in `clock/src/net/names.rs`, because version names are
# historical record (v345 is "Furnace" in commits, memories and speech) and the upstream themed
# corpora have moved. `fleet` and `creature` are the namespaces smol takes.
#
# ⚠️ They were described here as the namespaces "that cannot diverge — they exist in no other
# binding, so nothing else can produce a conflicting name". **That stopped being true on
# 2026-07-29**, when realm-sigil's `sync-words.sh --all` wrote both into the go, python and js
# embeds. Both exist in all four bindings now and can drift like any other realm. What protects
# them is upstream's generated content check plus the #384 gate arm that makes this vendored copy
# prove it still matches — not a structural immunity, which has expired. The reason to take them
# is what they NAME: a board, a familiar.
default = []

# DECLARED BUT NEVER ENABLED, and it has to be declared to stay that way.
#
# Omitting it did not disable the gate — it made `cfg(feature = "divergent-themed-realms")` an
# UNKNOWN cfg, which Rust compiles out while emitting `unexpected cfg condition value` (12 of them,
# once the host workspace built this crate). Two problems with that: the warnings are permanent
# noise, and an unknown cfg is silently-always-false rather than deliberately-false — so the gate
# would have kept "working" even if the condition were later misspelled, which is exactly the class
# of check that cannot fail.
#
# Declaring it makes the choice explicit and auditable: the feature exists, smol does not take it,
# and `default-features = false` at each dependency site says so out loud.
divergent-themed-realms = []
